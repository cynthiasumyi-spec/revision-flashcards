<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Game · English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="preload" href="../assets/fonts/jf-openhuninn-2.1.woff2?v=2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="../assets/fonts.css?v=3"/>
<link rel="stylesheet" href="../practice/grammar/grammar.css?v=51"/>
</head>
<body>
<header class="prac-header">
  <a class="back" href="../index.html">← Home</a>
  <h1>Game</h1>
  <p class="sub">Easy, fun mystery games</p>
</header>
<main class="wrap">
  <p class="section-label">Choose a case</p>
  <div class="game-grid">
    <a class="game-card gc-mystery" href="clue-hunt.html">
      <div class="case-book">
        <div class="case-page">
          <div class="case-page-top">
            <span class="case-holes" aria-hidden="true"><i></i><i></i><i></i></span>
            <p class="case-file-kicker">Case file</p>
            <div class="case-photo">
              <img src="illust/zoom-raffle-box.png" alt="" width="72" height="72"/>
            </div>
          </div>
          <img class="case-stamp" src="../assets/stamps/confidential-irasutoya.png" alt="Confidential" width="640" height="110"/>
          <div class="case-box">
            <span class="case-label">Case No.</span>
            <span class="case-no">001</span>
          </div>
          <div class="case-box">
            <span class="case-label">Case Name</span>
            <h3>School Mystery</h3>
            <p>Missing raffle box</p>
          </div>
          <div class="case-box">
            <span class="case-label">Date</span>
            <p>School Fair Day</p>
          </div>
          <div class="case-box">
            <span class="case-label">Location</span>
            <p>School</p>
          </div>
          <div class="case-box case-incident">
            <span class="case-label">Incident Details</span>
            <p>The raffle prize box went missing at the school fair.</p>
          </div>
        </div>
      </div>
    </a>
  </div>
</main>
</body>
</html>
