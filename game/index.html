<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Game · English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../practice/grammar/grammar.css?v=40"/>
</head>
<body>
<header class="prac-header">
  <a class="back" href="../index.html">← Home</a>
  <h1>Game</h1>
  <p class="sub">Easy, fun mystery games</p>
</header>
<main class="wrap">
  <p class="section-label">Choose a case</p>
  <div class="game-grid">
    <a class="game-card gc-mystery" href="clue-hunt.html">
      <header class="case-doc-head">
        <div class="case-doc-brand">
          <svg class="case-badge" viewBox="0 0 24 24" aria-hidden="true">
            <polygon fill="currentColor" points="12,1.2 14.8,8 22,8.5 16.5,13.1 18.5,20.4 12,16.4 5.5,20.4 7.5,13.1 2,8.5 9.2,8"/>
          </svg>
          <p class="case-file-kicker">Case file</p>
        </div>
        <h3>School Mystery</h3>
      </header>
      <div class="case-doc-rule"></div>
      <div class="case-doc-mid">
        <div class="case-doc-side">
          <p class="case-field case-no">Case No. 001</p>
          <p class="case-field case-field-blank" aria-hidden="true"></p>
          <p class="case-field case-field-blank" aria-hidden="true"></p>
        </div>
        <div class="case-doc-photo">
          <img src="illust/zoom-raffle-box.png" alt="" width="88" height="112"/>
        </div>
      </div>
      <div class="case-doc-lines" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <p class="case-doc-note">Leo was looking after the raffle box and did not come back. Walk the school fair, fill your notebook, and find who took the box, and why.</p>
      <div class="case-doc-foot">
        <span class="case-seal" aria-hidden="true"><span>Case</span><span>001</span></span>
        <span class="case-foot-line" aria-hidden="true"></span>
      </div>
    </a>
  </div>
</main>
</body>
</html>
