<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no"/>
<title>Unit 4 Film magic</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --ink:#1a2332; --muted:#5b6b7c;
  --accent:#7b68ee; --accent-soft:#e1ddfb;
  --coral:#FF6B4A; --teal:#01383b; --box:#e6f5f3;
  --shadow:0 8px 24px rgba(26,35,50,.08); --radius:18px;
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header {
  position:sticky; top:0; z-index:10;
  background:rgba(244,247,251,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(26,35,50,.06);
  padding:14px 16px 12px;
}
.back { display:inline-block; color:var(--accent); text-decoration:none; font-weight:600; font-size:.92rem; margin-bottom:6px; }
h1 { margin:0; font-size:1.28rem; font-weight:700; }
.sub { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
.hint { max-width:720px; margin:10px auto 0; padding:0 16px; color:var(--muted); font-size:.88rem; }
.list {
  max-width:720px; margin:0 auto;
  padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:14px;
}
.card {
  background:var(--card); border-radius:var(--radius);
  box-shadow:var(--shadow); border:1px solid rgba(26,35,50,.05);
  padding:16px 16px 14px; position:relative;
}
.card.playing { outline:2px solid var(--accent); }
.top { display:flex; gap:12px; align-items:flex-start; }
.illust {
  flex:0 0 96px; width:96px; height:96px; border-radius:14px;
  background:#eef2f7; overflow:hidden; border:1px solid rgba(26,35,50,.06);
}
.illust img { width:100%; height:100%; object-fit:contain; background:#fff; display:block; }
.main { flex:1; min-width:0; }
.num {
  display:inline-grid; place-items:center;
  min-width:28px; height:28px; padding:0 8px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent);
  font-weight:700; font-size:.85rem; margin-bottom:6px;
}
.syllables {
  font-size:1.55rem; font-weight:800; color:var(--teal);
  line-height:1.25; letter-spacing:.01em; margin:0 0 6px;
  word-break:break-word;
}
.zh {
  font-size:1.05rem; font-weight:700; color:var(--coral);
  margin:0 0 10px; line-height:1.35;
}
.speaker {
  position:absolute; top:14px; right:14px;
  width:52px; height:52px; border-radius:50%; border:0;
  background:var(--accent); color:#fff; font-size:1.4rem;
  box-shadow:0 6px 16px rgba(0,0,0,.16);
  display:grid; place-items:center; cursor:pointer; z-index:2;
}
.speaker:active { transform:scale(.94); }
.card.playing .speaker { animation:pulse .9s ease infinite; filter:brightness(.92); }
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(0,0,0,.25); }
  50% { box-shadow:0 0 0 10px rgba(0,0,0,0); }
}
.ex {
  background:var(--box); border:1.5px solid color-mix(in srgb, var(--accent) 45%, white);
  border-radius:14px; padding:12px 12px 10px; margin-top:8px;
}
.ex-label {
  display:inline-block; font-size:.78rem; font-weight:700; color:#fff;
  background:var(--accent); border-radius:999px; padding:3px 10px; margin-bottom:6px;
}
.ex-en { font-size:.98rem; line-height:1.45; color:var(--teal); margin:0 0 4px; }
.ex-zh { font-size:.9rem; line-height:1.4; color:var(--muted); margin:0; }
.hl { color:var(--coral); font-weight:700; }
@media (min-width:640px) {
  .illust { flex-basis:120px; width:120px; height:120px; }
  .syllables { font-size:1.75rem; }
}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← 返回目錄</a>
  <h1>Unit 4 Film magic</h1>
  <p class="sub">點 🔊 聽讀音 · 例句目標字已標示橙色</p>
</header>
<p class="hint">共 14 個生字／詞語 · Primary 6 例句 + 中一進階例句</p>
<main class="list" id="list"></main>
<script>
const CARDS = [{"n": 1, "en": "an action film", "syllables": "an ac-tion film", "zh": "動作片", "pos": "名詞 n.", "ex_en": "The children watch an action film about a hero.", "ex_zh": "孩子們看一齣關於英雄的動作片。", "adv_en": "Because the fights look exciting, this action film is popular with boys.", "adv_zh": "因為打鬥場面很刺激，這齣動作片很受男孩子歡迎。", "highlight": "action film", "audio": "audio/audio_01.mp3", "img": "thumb_01.png", "art_source": "remixed from dictation3 card art"}, {"n": 2, "en": "a comedy", "syllables": "a com-e-dy", "zh": "喜劇", "pos": "名詞 n.", "ex_en": "The two men tell jokes in a comedy.", "ex_zh": "那兩個男人在喜劇裡說笑話。", "adv_en": "When the actors tell silly jokes, everyone laughs at the comedy.", "adv_zh": "當演員講傻笑話時，大家都為這齣喜劇大笑。", "highlight": "comedy", "audio": "audio/audio_02.mp3", "img": "thumb_02.png", "art_source": "remixed from dictation3 card art"}, {"n": 3, "en": "a fantasy film", "syllables": "a fan-ta-sy film", "zh": "奇幻片", "pos": "名詞 n.", "ex_en": "In a fantasy film, a girl lives in a tall tower.", "ex_zh": "在奇幻片裡，一個女孩住在高塔中。", "adv_en": "In the fantasy film that she loves, a girl with long hair waits for help.", "adv_zh": "在她喜愛的那齣奇幻片裡，一個長髮女孩等待救援。", "highlight": "fantasy film", "audio": "audio/audio_03.mp3", "img": "thumb_03.png", "art_source": "remixed from dictation3 card art"}, {"n": 4, "en": "a horror film", "syllables": "a hor-ror film", "zh": "恐怖片", "pos": "名詞 n.", "ex_en": "The girl is scared of the horror film.", "ex_zh": "那個女孩很害怕恐怖片。", "adv_en": "Although she covers her eyes, she is still scared of the horror film.", "adv_zh": "雖然她捂着眼睛，她仍然很害怕恐怖片。", "highlight": "horror film", "audio": "audio/audio_04.mp3", "img": "thumb_04.png", "art_source": "remixed from dictation3 card art"}, {"n": 5, "en": "a musical", "syllables": "a mu-si-cal", "zh": "音樂劇／歌舞片", "pos": "名詞 n.", "ex_en": "The woman sings and dances in a musical.", "ex_zh": "那個女人在音樂劇裡又唱又跳。", "adv_en": "Although she felt nervous, the star of the musical sang her solo well.", "adv_zh": "雖然她感到緊張，這齣音樂劇的主角仍唱好了獨唱。", "highlight": "musical", "audio": "audio/audio_05.mp3", "img": "thumb_05.png", "art_source": "remixed from dictation3 card art"}, {"n": 6, "en": "a science fiction film", "syllables": "a sci-ence fic-tion film", "zh": "科幻片", "pos": "名詞 n.", "ex_en": "They watch a science fiction film about a spaceship.", "ex_zh": "他們看一齣關於太空船的科幻片。", "adv_en": "When the spaceship lands on a new planet, the science fiction film becomes more exciting.", "adv_zh": "當太空船降落在新行星上時，這齣科幻片變得更刺激。", "highlight": "science fiction film", "audio": "audio/audio_06.mp3", "img": "thumb_06.jpg", "art_source": "generated"}, {"n": 7, "en": "cruel", "syllables": "cru-el", "zh": "殘忍的", "pos": "形容詞 adj.", "ex_en": "The cruel boy chases the scared cat.", "ex_zh": "那個殘忍的男孩追趕受驚的貓。", "adv_en": "Because he is cruel, the boy never shows kindness to the little cat.", "adv_zh": "因為他很殘忍，那個男孩從不對小貓表現善意。", "highlight": "cruel", "audio": "audio/audio_07.mp3", "img": "thumb_07.jpg", "art_source": "generated (textbook: boy chasing cat)"}, {"n": 8, "en": "curious", "syllables": "cu-ri-ous", "zh": "好奇的", "pos": "形容詞 adj.", "ex_en": "The curious girl looks at the ladybird.", "ex_zh": "那個好奇的女孩看着瓢蟲。", "adv_en": "When she finds a ladybird, the curious girl looks at it through a magnifying glass.", "adv_zh": "當她發現瓢蟲時，那個好奇的女孩用放大鏡看它。", "highlight": "curious", "audio": "audio/audio_08.mp3", "img": "thumb_08.png", "art_source": "remixed from dictation3 card art"}, {"n": 9, "en": "lonely", "syllables": "lone-ly", "zh": "寂寞的", "pos": "形容詞 adj.", "ex_en": "The lonely man sits by the window.", "ex_zh": "那個寂寞的男人坐在窗邊。", "adv_en": "Although he has a warm room, the lonely man still feels sad by the window.", "adv_zh": "雖然他有溫暖的房間，那個寂寞的男人坐在窗邊仍感到難過。", "highlight": "lonely", "audio": "audio/audio_09.mp3", "img": "thumb_09.png", "art_source": "irasutoya:https://www.irasutoya.com/2015/03/blog-post_88.html"}, {"n": 10, "en": "obedient", "syllables": "o-be-di-ent", "zh": "聽話的", "pos": "形容詞 adj.", "ex_en": "The obedient girl stands quietly with her dog.", "ex_zh": "那個聽話的女孩和她的狗安靜地站着。", "adv_en": "The obedient girl, who always listens to her parents, waits patiently with her dog.", "adv_zh": "那個總是聽父母話的聽話女孩，耐心地和狗一起等待。", "highlight": "obedient", "audio": "audio/audio_10.mp3", "img": "thumb_10.jpg", "art_source": "generated (textbook: girl with dog)"}, {"n": 11, "en": "selfish", "syllables": "self-ish", "zh": "自私的", "pos": "形容詞 adj.", "ex_en": "The selfish girl keeps all the cookies.", "ex_zh": "那個自私的女孩把曲奇全留給自己。", "adv_en": "Because she is selfish, the girl will not share the cookies with the sad boy.", "adv_zh": "因為她很自私，那個女孩不肯把曲奇分給難過的男孩。", "highlight": "selfish", "audio": "audio/audio_11.mp3", "img": "thumb_11.jpg", "art_source": "generated"}, {"n": 12, "en": "timid", "syllables": "tim-id", "zh": "膽小的", "pos": "形容詞 adj.", "ex_en": "The timid boy hides behind the wall.", "ex_zh": "那個膽小的男孩躲在牆後。", "adv_en": "Although the mouse is tiny, the timid boy still hides behind the wall.", "adv_zh": "雖然老鼠很小，那個膽小的男孩仍躲在牆後。", "highlight": "timid", "audio": "audio/audio_12.mp3", "img": "thumb_12.png", "art_source": "remixed from dictation3 card art"}, {"n": 13, "en": "wicked", "syllables": "wick-ed", "zh": "邪惡的", "pos": "形容詞 adj.", "ex_en": "The wicked witch casts a spell.", "ex_zh": "邪惡的女巫施展咒語。", "adv_en": "The wicked witch, who wears a pointed hat, plans to make trouble for everyone.", "adv_zh": "戴着尖帽的邪惡女巫計劃給每個人製造麻煩。", "highlight": "wicked", "audio": "audio/audio_13.mp3", "img": "thumb_13.png", "art_source": "remixed from dictation3 card art"}, {"n": 14, "en": "wise", "syllables": "wise", "zh": "明智的／有智慧的", "pos": "形容詞 adj.", "ex_en": "The wise old man reads many books.", "ex_zh": "那位有智慧的老先生讀了很多書。", "adv_en": "Because he is wise, the old man gives good advice to the children.", "adv_zh": "因為他有智慧，那位老先生給孩子們很好的忠告。", "highlight": "wise", "audio": "audio/audio_14.mp3", "img": "thumb_14.png", "art_source": "irasutoya:https://www.irasutoya.com/2013/02/blog-post_24.html"}];
const list = document.getElementById('list');
let currentAudio=null, currentEl=null, lastPlayAt=0;
const GUARD_MS=180;

function highlight(text, target) {
  if (!target) return text;
  // Escape and match with word boundaries (letters)
  const esc = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
  const re = new RegExp('(?<![A-Za-z])(' + esc + ')(?![A-Za-z])', 'ig');
  return text.replace(re, '<span class="hl">$1</span>');
}

function stopCurrent() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
  if (currentEl) { currentEl.classList.remove('playing'); currentEl=null; }
}

function playCard(card, el) {
  const now=Date.now();
  if (now-lastPlayAt<GUARD_MS && currentEl===el) return;
  lastPlayAt=now; stopCurrent();
  const audio=new Audio(card.audio);
  currentAudio=audio; currentEl=el||null;
  if (el) el.classList.add('playing');
  audio.addEventListener('ended', () => {
    if (currentAudio===audio) { if (el) el.classList.remove('playing'); currentAudio=null; currentEl=null; }
  });
  audio.addEventListener('error', () => {
    if (el) el.classList.remove('playing');
    if (currentAudio===audio) { currentAudio=null; currentEl=null; }
  });
  const p=audio.play();
  if (p && p.catch) p.catch(() => { if (el) el.classList.remove('playing'); });
}

CARDS.forEach(card => {
  const article=document.createElement('article');
  article.className='card';
  article.id='c'+String(card.n).padStart(2,'0');

  const speaker=document.createElement('button');
  speaker.type='button'; speaker.className='speaker';
  speaker.setAttribute('aria-label','播放：'+card.en);
  speaker.textContent='🔊';
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });

  const top=document.createElement('div'); top.className='top';
  if (card.img) {
    const wrap=document.createElement('div'); wrap.className='illust';
    const img=document.createElement('img');
    img.src=card.img; img.alt=card.en; img.loading='lazy'; img.decoding='async';
    wrap.appendChild(img); top.appendChild(wrap);
  }
  const main=document.createElement('div'); main.className='main';
  main.innerHTML =
    '<span class="num">'+String(card.n).padStart(2,'0')+'</span>'+
    '<p class="syllables">'+card.syllables+'</p>'+
    '<p class="zh">'+card.zh+'（'+card.pos+'）</p>';
  top.appendChild(main);

  function exBox(label, en, zh) {
    const d=document.createElement('div'); d.className='ex';
    d.innerHTML =
      '<span class="ex-label">'+label+'</span>'+
      '<p class="ex-en">'+highlight(en, card.highlight)+'</p>'+
      '<p class="ex-zh">'+zh+'</p>';
    return d;
  }

  article.appendChild(speaker);
  article.appendChild(top);
  article.appendChild(exBox('例句', card.ex_en, card.ex_zh));
  article.appendChild(exBox('進階例句', card.adv_en, card.adv_zh));
  // tap card (except speaker) also plays
  article.addEventListener('click', e => {
    if (e.target===speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });
  list.appendChild(article);
});
</script>
</body>
</html>
