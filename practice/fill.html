<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Sentence fill-in · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="practice.css"/>
</head>
<body>
<header class="prac-header">
  <a class="back" href="#" id="back-hub">← Practice hub</a>
  <h1>Sentence fill-in</h1>
  <p class="sub" id="sub">Drag a word from the bank into the blank</p>
</header>
<main class="wrap">
  <div class="toolbar">
    <span class="chip" id="q-num">1 / 10</span>
    <div class="diff-toggle" role="group" aria-label="Difficulty">
      <button type="button" id="diff-easy" class="is-on">Easy</button>
      <button type="button" id="diff-hard">Hard</button>
    </div>
    <div class="progress-bar" aria-hidden="true"><span id="prog"></span></div>
  </div>
  <div class="panel" id="game">
    <p class="section-label" id="bank-label">Word bank · drag into the blank</p>
    <div class="word-bank" id="bank"></div>
    <p class="sentence" id="sentence"></p>
    <div class="btn-row">
      <button type="button" class="btn btn-ghost" id="btn-clear">Clear</button>
      <button type="button" class="btn btn-primary" id="btn-check" disabled>Check</button>
      <button type="button" class="btn btn-secondary" id="btn-next" hidden>Next</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="panel result-card" id="done" hidden>
    <h2>Round complete</h2>
    <p class="big" id="score-big">0</p>
    <p id="score-msg">correct</p>
    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-primary" id="again" href="#">Play again</a>
      <a class="btn btn-ghost" id="to-hub" href="#">Hub</a>
    </div>
  </div>
  <div class="empty-state" id="empty" hidden>
    <p>No fill-in items for this unit yet.</p>
    <a href="index.html">Back to hub</a>
  </div>
</main>
<script src="data/unit1.js"></script>
<script src="data/unit2.js"></script>
<script src="data/unit3.js"></script>
<script src="data/unit4.js"></script>
<script src="data/dictation3.js"></script>
<script src="data/registry.js"></script>
<script src="mastery.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const C = window.PracticeCommon;
  const M = window.Mastery;
  const { id: unitId, pack } = C.loadUnit();
  document.getElementById('back-hub').href = C.hubLink(unitId);
  document.getElementById('to-hub').href = C.hubLink(unitId);
  document.getElementById('again').href = C.practiceLink('fill.html', unitId);

  function loadItems(m) {
    if (m === 'hard') {
      const hard = (pack && pack.fillInHard && pack.fillInHard.length)
        ? pack.fillInHard
        : (pack && pack.fillIn) || [];
      return C.shuffle(hard.slice());
    }
    const easy = (pack && pack.fillIn) || [];
    return C.shuffle(easy.slice());
  }

  let mode = 'easy';
  let items = loadItems(mode);
  if (!items.length) {
    document.getElementById('game').hidden = true;
    document.getElementById('empty').hidden = false;
    return;
  }

  let idx = 0;
  let placed = null;
  let selectedChip = null;
  let locked = false;
  let correctCount = 0;

  const sentenceEl = document.getElementById('sentence');
  const bankEl = document.getElementById('bank');
  const bankLabel = document.getElementById('bank-label');
  const btnCheck = document.getElementById('btn-check');
  const btnNext = document.getElementById('btn-next');
  const btnClear = document.getElementById('btn-clear');
  const toast = document.getElementById('toast');
  const subEl = document.getElementById('sub');
  const slotRef = { el: null, input: null };

  document.getElementById('diff-easy').addEventListener('click', function () { setMode('easy'); });
  document.getElementById('diff-hard').addEventListener('click', function () { setMode('hard'); });

  function setMode(m) {
    mode = m;
    document.getElementById('diff-easy').classList.toggle('is-on', m === 'easy');
    document.getElementById('diff-hard').classList.toggle('is-on', m === 'hard');
    items = loadItems(mode);
    idx = 0;
    correctCount = 0;
    document.getElementById('done').hidden = true;
    document.getElementById('game').hidden = false;
    if (!items.length) {
      document.getElementById('game').hidden = true;
      document.getElementById('empty').hidden = false;
      return;
    }
    document.getElementById('empty').hidden = true;
    render();
  }

  function updateModeChrome() {
    if (mode === 'hard') {
      subEl.textContent = 'Type the missing word — no word bank';
      bankLabel.hidden = true;
      bankEl.hidden = true;
      bankEl.innerHTML = '';
    } else {
      subEl.textContent = 'Drag a word from the bank into the blank';
      bankLabel.hidden = false;
      bankEl.hidden = false;
    }
  }

  function normalize(s) {
    return String(s || '')
      .toLowerCase()
      .trim()
      .replace(/[.,!?;:'"“”‘’]/g, '')
      .replace(/\s+/g, ' ');
  }

  function isAccept(item, val) {
    const list = item.accept && item.accept.length ? item.accept : [item.answer];
    const got = normalize(val);
    return list.some(function (a) { return normalize(a) === got; });
  }

  function currentAnswer() {
    if (mode === 'hard') return slotRef.input ? slotRef.input.value : '';
    return placed || '';
  }

  function render() {
    locked = false;
    placed = null;
    selectedChip = null;
    slotRef.input = null;
    toast.hidden = true;
    btnCheck.disabled = true;
    btnCheck.hidden = false;
    btnNext.hidden = true;
    btnClear.disabled = false;
    updateModeChrome();

    const item = items[idx];
    document.getElementById('q-num').textContent = (idx + 1) + ' / ' + items.length;
    document.getElementById('prog').style.width = ((idx / items.length) * 100) + '%';

    const parts = item.sentence.split(item.blank || '______');
    sentenceEl.innerHTML = '';
    sentenceEl.appendChild(document.createTextNode(parts[0] || ''));

    const slot = document.createElement('span');
    slot.className = 'blank-slot' + (mode === 'hard' ? ' blank-slot-hard' : '');
    slotRef.el = slot;

    if (mode === 'hard') {
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.className = 'blank-input';
      inp.setAttribute('aria-label', 'Type the missing word');
      inp.placeholder = 'type here';
      inp.autocapitalize = 'none';
      inp.autocomplete = 'off';
      inp.autocorrect = 'off';
      inp.spellcheck = false;
      inp.inputMode = 'text';
      inp.addEventListener('input', function () {
        if (locked) return;
        const v = inp.value.trim();
        slot.classList.toggle('filled', !!v);
        btnCheck.disabled = !v;
      });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !btnCheck.disabled) btnCheck.click();
      });
      slot.appendChild(inp);
      slotRef.input = inp;
      sentenceEl.appendChild(slot);
      sentenceEl.appendChild(document.createTextNode(parts[1] || ''));
      bankEl.innerHTML = '';
      setTimeout(function () { try { inp.focus(); } catch (e) {} }, 40);
    } else {
      slot.setAttribute('tabindex', '0');
      slot.setAttribute('role', 'button');
      slot.setAttribute('aria-label', 'Answer blank');
      slot.textContent = '…';
      sentenceEl.appendChild(slot);
      sentenceEl.appendChild(document.createTextNode(parts[1] || ''));

      function place(word, chip) {
        if (locked) return;
        placed = word;
        slot.textContent = word;
        slot.classList.add('filled');
        bankEl.querySelectorAll('.bank-chip').forEach(function (c) { c.classList.remove('used', 'selected'); });
        if (chip) chip.classList.add('used');
        selectedChip = null;
        btnCheck.disabled = false;
      }

      slot.addEventListener('click', function () {
        if (locked) return;
        if (selectedChip) {
          place(selectedChip.dataset.word, selectedChip);
        } else if (placed) {
          placed = null;
          slot.textContent = '…';
          slot.classList.remove('filled');
          bankEl.querySelectorAll('.bank-chip').forEach(function (c) { c.classList.remove('used'); });
          btnCheck.disabled = true;
        }
      });

      slot.addEventListener('dragover', function (e) { e.preventDefault(); slot.classList.add('drag-over'); });
      slot.addEventListener('dragleave', function () { slot.classList.remove('drag-over'); });
      slot.addEventListener('drop', function (e) {
        e.preventDefault();
        slot.classList.remove('drag-over');
        const word = e.dataTransfer.getData('text/plain');
        const chip = bankEl.querySelector('.bank-chip[data-word="' + CSS.escape(word) + '"]');
        if (word) place(word, chip);
      });

      bankEl.innerHTML = '';
      C.shuffle(item.options).forEach(function (opt) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'bank-chip';
        chip.draggable = true;
        chip.dataset.word = opt;
        chip.textContent = opt;
        chip.addEventListener('dragstart', function (e) {
          e.dataTransfer.setData('text/plain', opt);
          chip.classList.add('selected');
        });
        chip.addEventListener('dragend', function () { chip.classList.remove('selected'); });
        chip.addEventListener('click', function () {
          if (locked) return;
          if (chip.classList.contains('used')) return;
          bankEl.querySelectorAll('.bank-chip').forEach(function (c) { c.classList.remove('selected'); });
          chip.classList.add('selected');
          selectedChip = chip;
          if (!placed) place(opt, chip);
        });
        bankEl.appendChild(chip);
      });
    }
  }

  btnCheck.addEventListener('click', function () {
    const val = currentAnswer();
    if (locked || !String(val).trim()) return;
    locked = true;
    btnCheck.hidden = true;
    btnClear.disabled = true;
    if (slotRef.input) slotRef.input.disabled = true;
    const item = items[idx];
    const ok = isAccept(item, val);
    if (ok) {
      correctCount += 1;
      M.markCorrect(item.wordKey);
      C.toast(toast, 'Nice! ✓', 'ok');
      if (slotRef.el) slotRef.el.classList.add('filled', 'is-correct');
    } else {
      M.markWrong(item.wordKey);
      C.toast(toast, 'Answer: ' + item.answer, 'bad');
      if (slotRef.el) slotRef.el.classList.add('is-wrong');
      if (mode === 'hard' && slotRef.input) slotRef.input.value = item.answer;
    }
    btnNext.hidden = false;
    document.getElementById('prog').style.width = (((idx + 1) / items.length) * 100) + '%';
  });

  btnClear.addEventListener('click', function () {
    if (locked) return;
    placed = null;
    selectedChip = null;
    if (mode === 'hard') {
      if (slotRef.input) { slotRef.input.value = ''; slotRef.input.focus(); }
      if (slotRef.el) slotRef.el.classList.remove('filled', 'is-correct', 'is-wrong');
    } else if (slotRef.el) {
      slotRef.el.textContent = '…';
      slotRef.el.classList.remove('filled', 'is-correct', 'is-wrong');
      bankEl.querySelectorAll('.bank-chip').forEach(function (c) { c.classList.remove('used', 'selected'); });
    }
    btnCheck.disabled = true;
  });

  btnNext.addEventListener('click', function () {
    idx += 1;
    if (idx >= items.length) {
      document.getElementById('game').hidden = true;
      document.getElementById('done').hidden = false;
      document.getElementById('score-big').textContent = correctCount + ' / ' + items.length;
      return;
    }
    render();
  });

  render();
})();
</script>
</body>
</html>
