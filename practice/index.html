<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Practice · English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="practice.css?v=3"/>
<link rel="stylesheet" href="../assets/profile.css?v=2"/>
<link rel="stylesheet" href="../assets/review-list.css?v=1"/>
</head>
<body>
<header class="prac-header">
  <div class="prac-header-top">
    <a class="back" href="../index.html">← Home</a>
    <div id="profile-slot" class="profile-slot"></div>
  </div>
  <h1>Practice hub</h1>
  <p class="sub" id="unit-sub">Pick a unit and a game</p>
  <p class="sub"><a href="../badges.html">Badges</a> — finish practice to earn them. No points.</p>
</header>
<main class="wrap">
  <section class="needs-review" id="needs-review" aria-labelledby="needs-review-title">
    <h2 class="needs-review-title" id="needs-review-title">Needs review <span class="needs-review-zh">需要重溫</span></h2>
    <div id="review-words"></div>
  </section>
  <p class="section-label">Unit</p>
  <div class="unit-pills" id="unit-pills" role="list"></div>

  <div class="panel" id="unit-lock" hidden>
    <p id="unit-lock-msg"></p>
  </div>

  <p class="section-label" id="quiz-label">Quiz</p>
  <div class="game-grid" id="game-grid"></div>
</main>

<script src="data/unit1.js"></script>
<script src="data/unit2.js"></script>
<script src="data/unit3.js"></script>
<script src="data/unit4.js"></script>
<script src="data/dictation3.js"></script>
<script src="data/registry.js"></script>
<script src="mastery.js"></script>
<script src="badges.js"></script>
<script src="../assets/profile.js"></script>
<script src="../assets/review-list.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const C = window.PracticeCommon;
  const R = window.PracticeRegistry;
  if (window.ReviewList && window.Mastery) {
    window.ReviewList.render(
      document.getElementById('review-words'),
      window.ReviewList.groups(R, window.Mastery, { practicePage: 'letters.html', cardPrefix: '../' })
    );
  }
  const unitId = C.unitParam();
  const pack = R.getUnit(unitId);
  const units = R.listUnits();

  document.getElementById('unit-sub').textContent = (pack && pack.title) || 'Pick a unit and a game';

  const pills = document.getElementById('unit-pills');
  units.forEach(u => {
    const open = !window.Badges || window.Badges.unitUnlocked(u.id);
    const a = document.createElement('a');
    a.href = 'index.html?unit=' + encodeURIComponent(u.id);
    a.className = 'pill tone-' + u.tone + (u.id === unitId ? ' is-active' : '') + (open ? '' : ' is-locked');
    a.setAttribute('role', 'listitem');
    if (!open) a.setAttribute('aria-disabled', 'true');
    a.innerHTML = C.escapeHtml(u.label) + (open ? '' : ' <span class="badge">locked</span>');
    pills.appendChild(a);
  });

  const unitOpen = !window.Badges || window.Badges.unitUnlocked(unitId);
  if (!unitOpen) {
    document.getElementById('quiz-label').hidden = true;
    document.getElementById('game-grid').hidden = true;
    document.getElementById('unit-lock').hidden = false;
    document.getElementById('unit-lock-msg').textContent = window.Badges.lockReason(unitId);
    return;
  }

  const ready = !!(pack && ((pack.fillIn && pack.fillIn.length) || (pack.matching && pack.matching.length)));
  const games = [
    { id: 'fill', cls: 'gc-fill', icon: 'icons/fill.svg', title: 'Sentence fill-in', desc: 'Easy: drag words · Hard: type the phrase', href: 'fill.html' },
    { id: 'letters', cls: 'gc-letters', icon: 'icons/letters.svg', title: 'Missing letters', desc: 'Spell the full phrase · Easy or Hard', href: 'letters.html' },
    { id: 'match', cls: 'gc-match', icon: 'icons/match.svg', title: 'Memory match', desc: '6 cards · 3 pairs · word form shown', href: 'match.html' },
    { id: 'timed', cls: 'gc-timed', icon: 'icons/timed.svg', title: 'Timed challenge', desc: '60 seconds · wrong answers keep the clock', href: 'timed.html' }
  ];
  const grid = document.getElementById('game-grid');
  games.forEach(g => {
    const a = document.createElement(ready ? 'a' : 'div');
    if (ready) a.href = C.practiceLink(g.href, unitId);
    a.className = 'game-card ' + g.cls + (ready ? '' : ' is-disabled');
    a.innerHTML = '<div class="icon"><img src="' + g.icon + '" alt="" width="34" height="34"/></div><h3>' + g.title + '</h3><p>' + g.desc + '</p>';
    grid.appendChild(a);
  });
})();
</script>
</body>
</html>
