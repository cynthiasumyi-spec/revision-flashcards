        kind: "fill", tag: "U3 · before", img: "illust/u4_s4_prop_check.jpg",
        parts: ["", "____", " the musical finale began under the bright lights, the prop team checked every silver mic cable behind the cardboard curtains."],
        options: ["Before", "Although", "So that", "If"],
        answer: "Before",
        explain: "Before + the later event — checking finished first."
      }
    ]
  };


  // Set 5 — 12 NEW mixed stems (toy bazaar / power-cut help / Breakfast Club / newsroom weather)
  // Themes draw on Unit Set 5 worlds but stems are not recycled from Unit Story/Chat/Join or Boss Sets 1–4
  const set5Data = {
    items: [
      {
        kind: "fill", tag: "U1 · so many", img: "illust/u1_s5_sorting_toys.jpg",
        parts: ["When the Warm Hearts helpers unlocked the sorting room after assembly, Class 6A stacked ", "____", " board-game boxes along the blue shelf, and Miss Chan still wheeled in another crate before the bazaar gate opened."],
        options: ["so many", "so much", "although", "so that"],
        answer: "so many",
        explain: "Board-game boxes are plural countable → so many."
      },
      {
        kind: "fill", tag: "U2 · if…will", img: "illust/u2_s5_stuck_lift.jpg",
        parts: ["If the lift doors freeze halfway during the blackout drill, the night helpers ", "____", " guide every neighbour down the cool stairwell with a spare torch."],
        options: ["will", "would", "so that", "although"],
        answer: "will",
        explain: "First conditional: If + present, … will + verb."
      },
      {
        kind: "join", tag: "U1 · who", img: "illust/u1_s5_lemonade_teachers.jpg",
        a: "This is the teacher.",
        b: "She pours cold lemonade for tired helpers beside the charity toy tables.",
        options: ["who", "which"],
        answer: "who",
        full: "This is the teacher who pours cold lemonade for tired helpers beside the charity toy tables.",
        explain: "Teacher = person → who."
      },
      {
        kind: "fill", tag: "U3 · although", img: "illust/u3_s5_honey_drizzle.jpg",
        parts: ["", "____", " the golden honey looked sticky on the tasting spoons, the Breakfast Club parents still asked for a second drizzle on every pancake."],
        options: ["Although", "After", "So that", "If"],
        answer: "Although",
        explain: "Although introduces a contrast."
      },
      {
        kind: "fill", tag: "U4 · as…as", img: "illust/u4_s5_studio_lights.jpg",
        parts: ["Our weather-report short looked ", "____", " bright ", "____", " the studio lights behind the cardboard news desk."],
        options: ["as · as", "so · that", "as · than", "more · as"],
        answer: "as · as",
        answers: ["as", "as"],
        explain: "as + adjective + as → equal comparison."
      },
      {
        kind: "fill", tag: "U2 · so that", img: "illust/u2_s5_hall_torches.jpg",
        parts: ["Class 6A taped bright arrows on every stair corner ", "____", " late families could find the hall help station without asking twice."],
        options: ["so that", "although", "before", "as"],
        answer: "so that",
        explain: "so that shows purpose — we want them to find the station."
      },
      {
        kind: "fill", tag: "U3 · after", img: "illust/u3_s5_chop_bananas.jpg",
        parts: ["", "____", " we chopped the bananas for the yoghurt cups, Leo lined the tasting spoons beside the Breakfast Club sign."],
        options: ["After", "Although", "So that", "If"],
        answer: "After",
        explain: "After + the action that finished first."
      },
      {
        kind: "fill", tag: "U4 · if…would", img: "illust/u4_s5_field_reporter.jpg", hard: true,
        parts: ["I would hold the toy camera steady until the weather cue music started if I ", "____", " the orange-badge field reporter on the cardboard street, and the crew will help tomorrow."],
        options: ["were", "am", "will be", "was being"],
        answer: "were",
        explain: "Imaginary / second conditional: If I were…, I would…"
      },
      {
        kind: "fill", tag: "U2 · mixed harder", img: "illust/u2_s5_battery_kits.jpg", hard: true,
        parts: ["We ", "____", " hand out spare battery kits if the hall radio crackles during the blackout, ", "____", " every family can keep a small torch working until morning."],
        options: ["will · so that", "would · although", "will · although", "would · so that"],
        answer: "will · so that",
        answers: ["will", "so that"],
        explain: "Real future plan → will. Purpose → so that. (Unit 2)"
      },
      {
        kind: "join", tag: "U1 · which", img: "illust/u1_s5_toy_tables.jpg",
        a: "These are the long toy tables.",
        b: "Parents wiped them twice before the first Warm Hearts visitor arrived.",
        options: ["who", "which"],
        answer: "which",
        full: "These are the long toy tables which parents wiped twice before the first Warm Hearts visitor arrived.",
        explain: "Toy tables = things → which."
      },
      {
        kind: "fill", tag: "U1 · so much", img: "illust/u1_s5_coin_envelopes.jpg",
        parts: ["After the last raffle spin, Class 6A had counted ", "____", " spare change into the sealed envelopes, and the Warm Hearts driver still waited cheerfully at the gate."],
        options: ["so much", "so many", "although", "so that"],
        answer: "so much",
        explain: "Change / money is uncountable → so much."
      },
      {
        kind: "fill", tag: "U3 · before", img: "illust/u3_s5_label_cups.jpg",
        parts: ["", "____", " the Breakfast Club tasting began, Mia wiped every yoghurt cup and stuck a name sticker on each clear lid."],
        options: ["Before", "Although", "So that", "If"],
        answer: "Before",
        explain: "Before + the later event — wiping finished first."
      }
    ]
  };

  const SETS = [set1Data, set2Data, set3Data, set4Data, set5Data];
  const SET_KEY = "boss-set-i";

  function resolveSet() {
    const q = parseInt(new URLSearchParams(location.search).get("set"), 10);
    if (q >= 1 && q <= SETS.length) return { index: q - 1, forced: true };
    let i = parseInt(localStorage.getItem(SET_KEY) || "0", 10);
    if (isNaN(i) || i < 0) i = 0;
    return { index: i % SETS.length, forced: false };
  }

  const resolved = resolveSet();
  const setIndex = resolved.index;
  const forced = resolved.forced;
  const items = SETS[setIndex].items;

  let idx = 0, selected = null, locked = false, correctCount = 0, lives = 3;

  const qNum = document.getElementById("q-num");
  const livesEl = document.getElementById("lives");
  const dots = document.getElementById("dots");
  const art = document.getElementById("art");
  const prompt = document.getElementById("prompt");
  const pair = document.getElementById("pair");
  const choices = document.getElementById("choices");
  const btnCheck = document.getElementById("btn-check");
  const btnNext = document.getElementById("btn-next");
  const btnClear = document.getElementById("btn-clear");
  const toast = document.getElementById("toast");

  function renderLives() {
    let html = "";
    for (let i = 0; i < 3; i++) {
      html += '<span class="heart' + (i >= lives ? " lost" : "") + '" aria-hidden="true">' + HEART_SVG + "</span>";
    }
    livesEl.innerHTML = html;
  }

  function renderDots() {
    dots.innerHTML = "";
    items.forEach((_, i) => {
      const s = document.createElement("span");
      if (i < idx) s.className = "done";
      else if (i === idx) s.className = "now";
      dots.appendChild(s);
    });
  }

  function joinParts(it) {
    const token = " " + it.answer + " ";
    const full = it.full || "";
    const at = full.indexOf(token);
    if (at < 0) return [full];
    return [full.slice(0, at + 1), "REL", full.slice(at + token.length - 1)];
  }

  function renderJoinStem(val, mode) {
    const it = items[idx];
    let html = "";
    joinParts(it).forEach((p) => {
      if (p === "REL") {
        const shown = val || "________";
        let cls = "blank";
        if (val) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + shown + "</span>";
      } else html += p;
    });
    prompt.innerHTML = html;
  }

  function renderPrompt(val, mode) {
    const it = items[idx];
    if (it.kind === "join") {
      renderJoinStem(val, mode);
      return;
    }
    let html = "", bi = 0;
    const vals = it.answers
      ? (val ? String(val).split(" · ") : null)
      : (val != null ? [val] : null);
    it.parts.forEach((p) => {
      if (p === "____") {
        const v = vals && vals[bi] != null ? vals[bi] : "____";
        let cls = "blank";
        if (vals && vals[bi] != null) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + v + "</span>";
        bi++;
      } else html += p;
    });
    if (it.hard) html += '<span class="hard-badge">Harder</span>';
    prompt.innerHTML = html;
  }

  function render() {
    const it = items[idx];
    locked = false;
    selected = null;
    qNum.textContent = (idx + 1) + " / " + items.length;
    art.src = it.img;
    toast.hidden = true;
    btnNext.hidden = true;
    btnCheck.disabled = true;
    btnClear.disabled = false;
    renderDots();
    renderLives();

    if (it.kind === "join") {
      pair.hidden = true;
      pair.innerHTML = "";
      renderJoinStem(null);
    } else {
      pair.hidden = true;
      pair.innerHTML = "";
      renderPrompt(null);
    }

    choices.innerHTML = "";
    it.options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      if (it.answers || (it.kind === "join" && opt.length > 8)) btn.classList.add("block");
      if (it.answers) btn.classList.add("block");
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (locked) return;
        selected = opt;
        [...choices.children].forEach((c) => c.classList.remove("selected"));
        btn.classList.add("selected");
        if (it.kind === "join") renderJoinStem(opt);
        else renderPrompt(opt);
        btnCheck.disabled = false;
      });
      choices.appendChild(btn);
    });
  }

  function advanceSetIfNeeded() {
    if (!forced) {
      localStorage.setItem(SET_KEY, String((setIndex + 1) % SETS.length));
    }
  }

  function finish(won) {
    advanceSetIfNeeded();
    if (won && lives >= 1 && !forced && window.Badges) {
      var grammarRewards = Badges.recordGrammarBoss(lives);
      if (window.GrammarProgress) GrammarProgress.show(grammarRewards);
    }
    document.getElementById("game").hidden = true;
    document.getElementById("done").hidden = false;
    document.getElementById("done-title").textContent = won ? "Boss cleared!" : "Out of lives";
    document.getElementById("done-art").src = won ? FB.ok : FB.bad;
    document.getElementById("score-big").textContent = correctCount + " / " + items.length;
    document.getElementById("done-sub").textContent =
      won
        ? ("correct · " + lives + " life" + (lives === 1 ? "" : "s") + " left")
        : ("correct before the round ended · try again!");
  }

  btnClear.addEventListener("click", () => {
    if (locked) return;
    selected = null;
    [...choices.children].forEach((c) => c.classList.remove("selected"));
    if (items[idx].kind === "join") renderJoinStem(null);
    else renderPrompt(null);
    btnCheck.disabled = true;
    toast.hidden = true;
  });

  btnCheck.addEventListener("click", () => {
    if (!selected || locked) return;
    locked = true;
    const it = items[idx];
    const ok = selected === it.answer;
    [...choices.children].forEach((c) => {
      c.disabled = true;
      if (c.textContent === it.answer) c.classList.add("correct");
      else if (c.textContent === selected && !ok) c.classList.add("wrong");
    });
    if (it.kind === "join") renderJoinStem(it.answer, ok ? "ok" : "soft");
    else renderPrompt(it.answer, ok ? "ok" : "soft");
    if (ok) {
      correctCount++;
      showToast(toast, "Nice!", it.explain + (it.full ? " → " + it.full : ""), "ok");
    } else {
      lives--;
      renderLives();
      showToast(
        toast,
        "Not quite",
        (it.full ? it.full + " — " : "Answer: " + it.answer + " — ") + it.explain,
        "bad"
      );
    }
    btnCheck.disabled = true;
    btnClear.disabled = true;
    if (lives <= 0) {
      btnNext.hidden = false;
      btnNext.textContent = "See result";
      btnNext.dataset.end = "lose";
    } else {
      btnNext.hidden = false;
      btnNext.textContent = idx === items.length - 1 ? "Finish" : "Next";
      btnNext.dataset.end = "";
    }
  });

  btnNext.addEventListener("click", () => {
    if (btnNext.dataset.end === "lose") {
      finish(false);
      return;
    }
    if (idx >= items.length - 1) {
      finish(true);
      return;
    }
    idx++;
    render();
  });

  render();
})();
</script>
