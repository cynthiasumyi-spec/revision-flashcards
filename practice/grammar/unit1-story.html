  function resolveSet() {
    const q = parseInt(new URLSearchParams(location.search).get("set"), 10);
    if (q >= 1 && q <= SETS.length) return { index: q - 1, forced: true };
    let i = parseInt(localStorage.getItem(SET_KEY) || "0", 10);
    if (isNaN(i) || i < 0) i = 0;
    return { index: i % SETS.length, forced: false };
  }

  const setIndex = resolved.index;
  const forced = resolved.forced;
  const activeSet = SETS[setIndex];

    if (s.optionPairs) return s.optionPairs[selectedIdx];
    return [s.options[selectedIdx]];

  function renderDots() {
    dots.innerHTML = "";
    scenes.forEach((_, i) => {
      const el = document.createElement("span");
      if (i < idx) el.className = "done";
      else if (i === idx) el.className = "now";
      dots.appendChild(el);
    });
  }

    let bi = 0;
    let html = "";
    s.parts.forEach((p) => {
      if (p === "____") {
        const v = values && values[bi] != null ? values[bi] : "____";
        let cls = "blank";
        if (values && values[bi] != null) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + v + "</span>";
        bi++;
      } else {
        html += p;
      }
    });
    prompt.innerHTML = html;
  }

  function render() {
    const s = scenes[idx];
    locked = false;
    selectedIdx = null;
    qNum.textContent = "Scene " + (idx + 1) + " / " + scenes.length;
    beatLabel.innerHTML = s.label + (s.hard ? ' <span class="hard-badge">Harder</span>' : "");
    art.src = s.img;
    art.alt = s.label;
    renderDots();
    renderPrompt(null);
    toast.hidden = true;
    btnNext.hidden = true;
    btnCheck.disabled = true;
    btnClear.disabled = false;
    choices.innerHTML = "";
    s.options.forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice" + (s.blanks > 1 ? " block" : "");
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (locked) return;
        selectedIdx = i;
        [...choices.children].forEach((c) => c.classList.remove("selected"));
        btn.classList.add("selected");
        renderPrompt(fillValues());
        btnCheck.disabled = false;
      });
      choices.appendChild(btn);
    });
  }

  btnClear.addEventListener("click", () => {
    if (locked) return;
    selectedIdx = null;
    [...choices.children].forEach((c) => c.classList.remove("selected"));
    renderPrompt(null);
    btnCheck.disabled = true;
    toast.hidden = true;
  });

  btnCheck.addEventListener("click", () => {
    if (selectedIdx == null || locked) return;
    locked = true;
    const s = scenes[idx];
    const vals = fillValues();
    const ok = vals && vals.length === s.answer.length && vals.every((v, i) => v === s.answer[i]);
    [...choices.children].forEach((c, i) => {
      c.disabled = true;
      const pair = s.optionPairs ? s.optionPairs[i] : [s.options[i]];
      const isAns = pair.every((v, j) => v === s.answer[j]);
      if (isAns) c.classList.add("correct");
      else if (i === selectedIdx && !ok) c.classList.add("wrong");
    });
    if (ok) {
      correctCount++;
      renderPrompt(s.answer, "ok");
      showToast(toast, "Nice!", s.explain, "ok");
    } else {
      renderPrompt(s.answer, "soft");
      showToast(toast, "Not quite", s.explain, "bad");
    }
    btnCheck.disabled = true;
    btnClear.disabled = true;
    btnNext.hidden = false;
    btnNext.textContent = idx === scenes.length - 1 ? "Finish" : "Next page";
  });

  btnNext.addEventListener("click", () => {
    if (idx >= scenes.length - 1) {
      if (!forced) {
        localStorage.setItem(SET_KEY, String((setIndex + 1) % SETS.length));
        if (window.Badges) {
          var grammarRewards = Badges.recordGrammarSession('unit1', 'story');
          if (window.GrammarProgress) GrammarProgress.show(grammarRewards);
        }
      }
      document.getElementById("game").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("score-big").textContent = correctCount + " / " + scenes.length;
      return;
    }
    idx++;
    render();
  });

  render();
})();
</script>
</body>
</html>
