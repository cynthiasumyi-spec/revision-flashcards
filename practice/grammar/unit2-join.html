<header class="prac-header">
  <a class="back" href="unit2-hub.html">← Unit 2 hub</a>
  <h1>Join the sentences</h1>
  <p class="sub">Combine with will / so that</p>

<main class="wrap">
  <div class="toolbar">
    <span class="chip pink" id="q-num">1 / 6</span>
    <div class="progress-dots" id="dots" aria-label="Progress"></div>
  </div>

  <div class="panel" id="game">
    <div class="illust pink" style="max-width:180px;aspect-ratio:1.2">
      <img src="illust/u2_03_flood.png" alt=""/>
    </div>
    <p class="prompt join-stem" id="stem"></p>
    <div class="choices join-choices" id="choices"></div>
    <div class="btn-row join-actions">
      <button type="button" class="btn btn-ghost" id="btn-clear">Clear</button>
      <button type="button" class="btn btn-primary" id="btn-check" disabled>Check</button>
      <button type="button" class="btn btn-secondary" id="btn-next" hidden>Next</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <div class="panel result-card" id="done" hidden>
    <h2>Join complete</h2>
    <p class="big" id="score-big">0</p>
    <p>correct sentences</p>
    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-primary" id="btn-again" href="unit2-join.html">Play again</a>
      <a class="btn btn-ghost" href="unit2-hub.html">Hub</a>
    </div>
  </div>
</main>

    el.querySelector(".toast-title").textContent = title;
    el.querySelector(".toast-explain").textContent = explain || "";
    el.hidden = false;
  }

  const set4Data = {
  "items": [

    },

      "preview": [
        "If the sandbags hold overnight after the practice, helpers ",

        " check the lower garden path at sunrise."
      ],

    {
      "hard": true,
      "a": "Amy packed bright yellow helmets for the hillside helpers.",
      "b": "They could stay safe near the cracked slope.",

  const set5Data = {

      "a": "Helpers packed spare batteries and small radios.",

      "preview": [

      "preview": [

        "REL",
        " open the school hall as a quiet help station."
      ],
      "full": "If the power cut lasts past dinner, Class 6A will open the school hall as a quiet help station."
    },
    {
      "a": "Helpers cleared schoolbags from the stair landings.",
      "b": "Neighbours could walk safely in the dark.",
      "answer": "so that",
      "preview": [
        "Helpers cleared schoolbags from the stair landings ",
        "REL",
        " neighbours could walk safely in the dark."
      ],
      "full": "Helpers cleared schoolbags from the stair landings so that neighbours could walk safely in the dark."
    },
    {
      "a": "If the hall radio stays clear tonight,",
      "b": "volunteers ____ share warm updates for every family.",
      "answer": "will",
      "preview": [
        "If the hall radio stays clear tonight, volunteers ",
        "REL",

      ],
      "full": "If the hall radio stays clear tonight, volunteers will share warm updates for every family."
    },

      "answer": "so that",
      "preview": [

        "REL",

      ],

    },

      "a": "If the green torch blinks three times for the blackout drill,",
      "b": "Class 6A ____ gather on the painted safe line at once.",
      "answer": "will",
      "preview": [
        "If the green torch blinks three times for the blackout drill, Class 6A ",
        "REL",
        " gather on the painted safe line at once."
      ],

    }
  ]
};

  const SETS = [set1Data, set2Data, set3Data, set4Data, set5Data];
  const SET_KEY = "u2-join-set-i";

  function resolveSet() {
    const q = parseInt(new URLSearchParams(location.search).get("set"), 10);
    if (q >= 1 && q <= SETS.length) return { index: q - 1, forced: true };
    let i = parseInt(localStorage.getItem(SET_KEY) || "0", 10);
    if (isNaN(i) || i < 0) i = 0;
    return { index: i % SETS.length, forced: false };
  }

  const resolved = resolveSet();
  const setIndex = resolved.index;
  const forced = resolved.forced;
  const items = SETS[setIndex].items;
  if (forced) {
    document.getElementById("btn-again").href = "unit2-join.html?set=" + (setIndex + 1);
  }

  let idx = 0;
  let selected = null;
  let locked = false;
  let correctCount = 0;

  const qNum = document.getElementById("q-num");
  const dots = document.getElementById("dots");
  const choices = document.getElementById("choices");
  const btnCheck = document.getElementById("btn-check");
  const btnNext = document.getElementById("btn-next");
  const btnClear = document.getElementById("btn-clear");
  const toast = document.getElementById("toast");

  function renderDots() {
    dots.innerHTML = "";
    items.forEach((_, i) => {
      const s = document.createElement("span");
      if (i < idx) s.className = "done";
      else if (i === idx) s.className = "now";
      dots.appendChild(s);
    });
  }

  function renderStem(val, mode) {
    const item = items[idx];
    const el = document.getElementById("stem");
    let html = "";
    const shownRaw = val || null;
    item.preview.forEach((p) => {
      if (p === "REL") {
        let shown = "________";
        if (shownRaw) {
          if (item.fillMap && item.fillMap[shownRaw]) shown = item.fillMap[shownRaw];
          else shown = shownRaw;
        }
        let cls = "blank";
        if (shownRaw) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + shown + "</span>";
      } else html += p;
    });
    el.innerHTML = html;
  }
  function showSoftJoin(val) { renderStem(val); }
  function showFullJoin(val, mode) { renderStem(val, mode); }
  function hideJoin() { renderStem(null); }

  function render() {
    const item = items[idx];
    locked = false;
    selected = null;
    qNum.innerHTML = (idx + 1) + " / " + items.length + (item.hard ? ' <span class="hard-badge">Harder</span>' : "");
    toast.hidden = true;
    btnNext.hidden = true;
    btnCheck.disabled = true;
    btnClear.disabled = false;
    renderDots();
    renderStem(null);
    choices.innerHTML = "";
    choiceOpts.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (locked) return;
        selected = opt;
        [...choices.children].forEach((c) => c.classList.remove("selected"));
        btn.classList.add("selected");
        showSoftJoin(opt);
        btnCheck.disabled = false;
      });
      choices.appendChild(btn);
    });
  }

  btnClear.addEventListener("click", () => {
    if (locked) return;
    selected = null;
    [...choices.children].forEach((c) => c.classList.remove("selected"));
    hideJoin();
    btnCheck.disabled = true;
    toast.hidden = true;
  });

  btnCheck.addEventListener("click", () => {
    if (!selected || locked) return;
    locked = true;
    const item = items[idx];
    const ok = selected === item.answer;
    [...choices.children].forEach((c) => {
      c.disabled = true;
      if (c.textContent === item.answer) c.classList.add("correct");
      else if (c.textContent === selected && !ok) c.classList.add("wrong");
    });
    if (ok) {
      correctCount++;
      showFullJoin(item.answer, "ok");
      showToast(toast, "Perfect!", item.full, "ok");
    } else {
      showFullJoin(item.answer, "soft");
      showToast(toast, "Try this", item.full, "bad");
    }
    btnCheck.disabled = true;
    btnClear.disabled = true;
    btnNext.hidden = false;
    btnNext.textContent = idx === items.length - 1 ? "Finish" : "Next";
  });

  btnNext.addEventListener("click", () => {
    if (idx >= items.length - 1) {
      if (!forced) {
        localStorage.setItem(SET_KEY, String((setIndex + 1) % SETS.length));
        if (window.Badges) {
          var grammarRewards = Badges.recordGrammarSession('unit2', 'join');
          if (window.GrammarProgress) GrammarProgress.show(grammarRewards);
        }
      }
      document.getElementById("game").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("score-big").textContent = correctCount + " / " + items.length;
      return;
    }
    idx++;
    render();
  });

  render();
})();

</html>
