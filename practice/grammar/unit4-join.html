  const SETS = [set1Data, set2Data, set3Data, set4Data, set5Data];
  const SET_KEY = "u4-join-set-i";
  function resolveSet() {
    const q = parseInt(new URLSearchParams(location.search).get("set"), 10);
    if (q >= 1 && q <= SETS.length) return { index: q - 1, forced: true };
    let i = parseInt(localStorage.getItem(SET_KEY) || "0", 10);
    if (isNaN(i) || i < 0) i = 0;
    return { index: i % SETS.length, forced: false };
  }
  const resolved = resolveSet();
  const setIndex = resolved.index;
  const forced = resolved.forced;
  const items = SETS[setIndex].items;
  if (forced) document.getElementById("btn-again").href = "unit4-join.html?set=" + (setIndex + 1);
  let idx = 0, selected = null, locked = false, correctCount = 0;
  const qNum = document.getElementById("q-num");
  const dots = document.getElementById("dots");
  const choices = document.getElementById("choices");
  const btnCheck = document.getElementById("btn-check");
  const btnNext = document.getElementById("btn-next");
  const btnClear = document.getElementById("btn-clear");
  const toast = document.getElementById("toast");
  function renderDots() {
    dots.innerHTML = "";
    items.forEach((_, i) => {
      const s = document.createElement("span");
      if (i < idx) s.className = "done";
      else if (i === idx) s.className = "now";
      dots.appendChild(s);
    });
  }
  function renderStem(val, mode) {
    const item = items[idx];
    const el = document.getElementById("stem");
    let html = "";
    const shownRaw = val || null;
    item.preview.forEach((p) => {
      if (p === "REL") {
        let shown = "________";
        if (shownRaw) {
          if (item.fillMap && item.fillMap[shownRaw]) shown = item.fillMap[shownRaw];
          else shown = shownRaw;
        }
        let cls = "blank";
        if (shownRaw) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + shown + "</span>";
      } else html += p;
    });
    el.innerHTML = html;
  }
  function showSoftJoin(val) { renderStem(val); }
  function showFullJoin(val, mode) { renderStem(val, mode); }
  function hideJoin() { renderStem(null); }
  function render() {
    const item = items[idx];
    locked = false; selected = null;
    qNum.innerHTML = (idx + 1) + " / " + items.length + (item.hard ? ' <span class="hard-badge">Harder</span>' : "");
    toast.hidden = true; btnNext.hidden = true; btnCheck.disabled = true; btnClear.disabled = false;
    renderDots();
    renderStem(null); choices.innerHTML = "";
    choiceOpts.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "choice"; btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (locked) return;
        selected = opt;
        [...choices.children].forEach((c) => c.classList.remove("selected"));
        btn.classList.add("selected");
        showSoftJoin(opt); btnCheck.disabled = false;
      });
      choices.appendChild(btn);
    });
  }
  btnClear.addEventListener("click", () => {
    if (locked) return;
    selected = null;
    [...choices.children].forEach((c) => c.classList.remove("selected"));
    hideJoin(); btnCheck.disabled = true; toast.hidden = true;
  });
  btnCheck.addEventListener("click", () => {
    if (!selected || locked) return;
    locked = true;
    const item = items[idx];
    const ok = selected === item.answer;
    [...choices.children].forEach((c) => {
      c.disabled = true;
      if (c.textContent === item.answer) c.classList.add("correct");
      else if (c.textContent === selected && !ok) c.classList.add("wrong");
    });
    if (ok) { correctCount++; showFullJoin(item.answer, "ok"); showToast(toast, "Perfect!", item.full, "ok"); }
    else { showFullJoin(item.answer, "soft"); showToast(toast, "Try this", item.full, "bad"); }
    btnCheck.disabled = true; btnClear.disabled = true; btnNext.hidden = false;
    btnNext.textContent = idx === items.length - 1 ? "Finish" : "Next";
  });

        if (window.Badges) {

          if (window.GrammarProgress) GrammarProgress.show(grammarRewards);
        }
      }
      document.getElementById("game").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("score-big").textContent = correctCount + " / " + items.length;
      return;
    }
    idx++; render();
  });
