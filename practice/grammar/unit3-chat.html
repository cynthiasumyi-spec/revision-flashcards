  const btnCheck = document.getElementById("btn-check");
  const btnNext = document.getElementById("btn-next");
  const btnClear = document.getElementById("btn-clear");
  const toast = document.getElementById("toast");
  const qLabel = document.getElementById("q-label");
  function buildBubbleHtml(parts, value, mode) {
    let html = "";
    parts.forEach((p) => {
      if (p === "____") {
        const v = value != null ? value : "____";
        let cls = "blank";
        if (value != null) {
          if (mode === "ok") cls = "blank ok";
          else if (mode === "soft") cls = "blank soft-answer";
          else if (mode === "done") cls = "blank ok";
          else cls = "blank filled";
        }
        html += '<span class="' + cls + '">' + v + "</span>";
      } else html += p;
    });
    return html;
  }
  function renderDots() {
    dots.innerHTML = "";
    for (let i = 0; i < totalDots; i++) {
      const s = document.createElement("span");
      if (i < idx) s.className = "done";
      else if (i === idx) s.className = "now";
      dots.appendChild(s);
    }
  }
  function renderThread(activeValue, activeMode) {
    thread.innerHTML = "";
    for (let i = 0; i < idx && i < bubbles.length; i++) {
      const b = bubbles[i];
      const d = document.createElement("div");
      d.className = "bubble " + b.speaker;
      d.innerHTML = '<span class="who">' + names[b.speaker] + "</span>" + buildBubbleHtml(b.parts, filled[i] || b.answer, "done");
      thread.appendChild(d);
    }
    if (idx < bubbles.length) {
      const b = bubbles[idx];
      const d = document.createElement("div");
      d.className = "bubble " + b.speaker + " active-bubble";
      d.innerHTML = '<span class="who">' + names[b.speaker] + "</span>" + buildBubbleHtml(b.parts, activeValue, activeMode);
      thread.appendChild(d);
    }
    thread.scrollTop = thread.scrollHeight;
  }
  function renderChoices(options) {
    choices.innerHTML = "";
    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "choice"; btn.textContent = opt;
      btn.addEventListener("click", () => {
        if (locked) return;
        selected = opt;
        [...choices.children].forEach((c) => c.classList.remove("selected"));
        btn.classList.add("selected");
        if (idx < bubbles.length) renderThread(opt, null);
        btnCheck.disabled = false;
      });
      choices.appendChild(btn);
    });
  }
  function render() {
    selected = null; locked = false; toast.hidden = true; btnNext.hidden = true; btnCheck.disabled = true; btnClear.disabled = false;
    renderDots();
    if (idx < bubbles.length) {
      phaseChip.textContent = (idx + 1) + " / " + bubbles.length;
      phaseChip.className = "chip sky";
      qLabel.innerHTML = "Fill the blank in " + names[bubbles[idx].speaker] + "’s message" + (bubbles[idx].hard ? ' <span class="hard-badge">Harder</span>' : "");
      renderThread(null); renderChoices(bubbles[idx].options);
    } else {
      phaseChip.textContent = "Inference"; phaseChip.className = "chip coral";
      qLabel.textContent = endQ.q; thread.innerHTML = "";
      bubbles.forEach((b, i) => {
        const d = document.createElement("div");
        d.className = "bubble " + b.speaker;
        d.innerHTML = '<span class="who">' + names[b.speaker] + "</span>" + buildBubbleHtml(b.parts, filled[i] || b.answer, "done");
        thread.appendChild(d);
      });
      renderChoices(endQ.options);
      [...choices.children].forEach((c) => c.classList.add("block"));
    }
  }
  btnClear.addEventListener("click", () => {
    if (locked) return;
    selected = null;
    [...choices.children].forEach((c) => c.classList.remove("selected"));
    if (idx < bubbles.length) renderThread(null);
    btnCheck.disabled = true; toast.hidden = true;
  });
  btnCheck.addEventListener("click", () => {
    if (!selected || locked) return;
    locked = true;
    const isBubble = idx < bubbles.length;
    const answer = isBubble ? bubbles[idx].answer : endQ.answer;
    const explain = isBubble ? bubbles[idx].explain : endQ.explain;
    const ok = selected === answer;
    [...choices.children].forEach((c) => {
      c.disabled = true;
      if (c.textContent === answer) c.classList.add("correct");
      else if (c.textContent === selected && !ok) c.classList.add("wrong");
    });
    if (ok) { correctCount++; if (!isBubble && !forced && window.Badges) inferenceRewards = Badges.recordGrammarInference(); showToast(toast, "Yes!", explain, "ok"); if (isBubble) { filled[idx] = answer; renderThread(answer, "ok"); } }
    else { showToast(toast, "Answer: " + answer, explain, "bad"); if (isBubble) { filled[idx] = answer; renderThread(answer, "soft"); } }
    btnCheck.disabled = true; btnClear.disabled = true; btnNext.hidden = false;
    if (isBubble) btnNext.textContent = idx === bubbles.length - 1 ? "Inference question" : "Next bubble";
    else btnNext.textContent = "Finish";
  });
  btnNext.addEventListener("click", () => {
    if (idx >= bubbles.length) {
      if (!forced) {
        localStorage.setItem(SET_KEY, String((setIndex + 1) % SETS.length));
        if (window.Badges) {
          var grammarRewards = [Badges.recordGrammarSession('unit3', 'chat')];
          if (inferenceRewards) grammarRewards.push(inferenceRewards);
          if (window.GrammarProgress) GrammarProgress.showMany(grammarRewards);
        }
      }
      document.getElementById("game").hidden = true;
      document.getElementById("done").hidden = false;
      document.getElementById("score-big").textContent = correctCount + " / " + totalDots;
      return;
    }
    idx++; render();
  });
  render();
})();
</script>
</body>
</html>
