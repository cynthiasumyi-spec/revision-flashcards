<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Missing letters · Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="practice.css"/>
</head>
<body>
<header class="prac-header">
  <a class="back" href="#" id="back-hub">← Practice hub</a>
  <h1>Missing letters</h1>
  <p class="sub" id="sub">Type the missing letters</p>
</header>
<main class="wrap">
  <div class="toolbar">
    <span class="chip" id="q-num">1 / 10</span>
    <div class="diff-toggle" role="group" aria-label="Difficulty">
      <button type="button" id="diff-easy" class="is-on">Easy</button>
      <button type="button" id="diff-hard">Hard</button>
    </div>
    <div class="progress-bar" aria-hidden="true"><span id="prog"></span></div>
  </div>
  <p class="hard-note" id="hard-note" hidden>Hard unlocks after you finish Easy Sentence Fill and Easy Missing Letters for this unit.</p>
  <div class="panel" id="game">
    <p class="hint-word" id="hint">Spell the word</p>
    <div class="letter-row" id="letters"></div>
    <div class="btn-row">
      <button type="button" class="btn btn-primary" id="btn-check">Check</button>
      <button type="button" class="btn btn-secondary" id="btn-next" hidden>Next</button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="panel result-card" id="done" hidden>
    <h2>Round complete</h2>
    <p class="big" id="score-big">0</p>
    <div id="badge-note" class="badge-note"></div>
    <div class="btn-row" style="justify-content:center">
      <a class="btn btn-primary" id="again" href="#">Play again</a>
      <a class="btn btn-ghost" id="to-hub" href="#">Hub</a>
      <a class="btn btn-ghost" href="../badges.html">Badges</a>
    </div>
  </div>
  <div class="empty-state" id="empty" hidden>
    <p>No letter items for this unit yet.</p>
    <a href="index.html">Back to hub</a>
  </div>
  <div class="empty-state" id="locked" hidden>
    <p id="locked-msg">This unit is locked.</p>
    <a href="index.html">Back to hub</a>
  </div>
</main>
<script src="data/unit1.js"></script>
<script src="data/unit2.js"></script>
<script src="data/unit3.js"></script>
<script src="data/unit4.js"></script>
<script src="data/dictation3.js"></script>
<script src="data/registry.js"></script>
<script src="mastery.js"></script>
<script src="badges.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const C = window.PracticeCommon;
  const M = window.Mastery;
  const B = window.Badges;
  const { id: unitId, pack } = C.loadUnit();
  document.getElementById('back-hub').href = C.hubLink(unitId);
  document.getElementById('to-hub').href = C.hubLink(unitId);
  document.getElementById('again').href = C.practiceLink('letters.html', unitId);
  document.getElementById('sub').textContent = (pack && pack.title) ? (pack.title + ' · full phrases') : 'Full phrases';

  if (B && !B.unitUnlocked(unitId)) {
    document.getElementById('game').hidden = true;
    document.querySelector('.toolbar').hidden = true;
    document.getElementById('locked').hidden = false;
    document.getElementById('locked-msg').textContent = B.lockReason(unitId);
    return;
  }

  function syncHardLock() {
    const open = !B || B.hardUnlocked(unitId);
    const btn = document.getElementById('diff-hard');
    btn.classList.toggle('is-locked', !open);
    btn.setAttribute('aria-disabled', open ? 'false' : 'true');
    document.getElementById('hard-note').hidden = open;
  }

  function loadLetterItems() {
    const list = (pack && pack.missingLetters) ? pack.missingLetters.slice() : [];
    const focus = new URLSearchParams(location.search).get('focus');
    if (!focus) return C.shuffle(list);
    list.sort(function (a, b) {
      if (a.wordKey === focus) return -1;
      if (b.wordKey === focus) return 1;
      return 0;
    });
    return list;
  }

  let mode = 'easy';
  let items = loadLetterItems();
  if (!items.length) {
    document.getElementById('game').hidden = true;
    document.getElementById('empty').hidden = false;
    return;
  }

  let idx = 0;
  let locked = false;
  let correctCount = 0;
  let blankInputs = [];

  const lettersEl = document.getElementById('letters');
  const toast = document.getElementById('toast');
  const btnCheck = document.getElementById('btn-check');
  const btnNext = document.getElementById('btn-next');

  document.getElementById('diff-easy').addEventListener('click', () => setMode('easy'));
  document.getElementById('diff-hard').addEventListener('click', () => {
    if (B && !B.hardUnlocked(unitId)) return;
    setMode('hard');
  });

  function setMode(m) {
    mode = m;
    document.getElementById('diff-easy').classList.toggle('is-on', m === 'easy');
    document.getElementById('diff-hard').classList.toggle('is-on', m === 'hard');
    // restart round with new masks
    items = loadLetterItems();
    idx = 0;
    correctCount = 0;
    document.getElementById('done').hidden = true;
    document.getElementById('game').hidden = false;
    render();
  }

  function buildPattern(item) {
    return C.maskPhrase(item.word, mode);
  }

  function render() {
    locked = false;
    toast.hidden = true;
    btnCheck.hidden = false;
    btnCheck.disabled = false;
    btnNext.hidden = true;
    blankInputs = [];

    const item = items[idx];
    document.getElementById('q-num').textContent = (idx + 1) + ' / ' + items.length;
    document.getElementById('prog').style.width = ((idx / items.length) * 100) + '%';
    const meta = (pack.words || []).find(w => w.key === item.wordKey);
    document.getElementById('hint').textContent = meta && meta.zh
      ? ('Spell the phrase · ' + meta.zh)
      : 'Spell the phrase';

    const pattern = buildPattern(item);
    const slots = C.patternToSlots(item.word, pattern);
    lettersEl.innerHTML = '';
    slots.forEach((s, si) => {
      const wrap = document.createElement('div');
      const space = s.type === 'show' && s.char === ' ';
      wrap.className = 'letter-slot' + (s.type === 'show' ? ' show' : '') + (space ? ' is-space' : '');
      if (s.type === 'show') {
        wrap.textContent = space ? '' : s.char;
      } else {
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.maxLength = 1;
        inp.setAttribute('aria-label', 'Letter ' + (s.index + 1));
        inp.autocapitalize = 'none';
        inp.autocomplete = 'off';
        inp.spellcheck = false;
        inp.dataset.answer = s.answer;
        inp.addEventListener('input', () => {
          inp.value = inp.value.slice(-1);
          // auto-advance
          const i = blankInputs.indexOf(inp);
          if (inp.value && blankInputs[i + 1]) blankInputs[i + 1].focus();
        });
        inp.addEventListener('keydown', e => {
          if (e.key === 'Backspace' && !inp.value) {
            const i = blankInputs.indexOf(inp);
            if (blankInputs[i - 1]) blankInputs[i - 1].focus();
          }
          if (e.key === 'Enter') btnCheck.click();
        });
        wrap.appendChild(inp);
        blankInputs.push(inp);
      }
      lettersEl.appendChild(wrap);
    });
    if (blankInputs[0]) blankInputs[0].focus();
  }

  btnCheck.addEventListener('click', () => {
    if (locked) return;
    const item = items[idx];
    const ok = blankInputs.every(inp => {
      const got = (inp.value || '').toLowerCase();
      const need = (inp.dataset.answer || '').toLowerCase();
      return got === need;
    });
    locked = true;
    btnCheck.hidden = true;
    if (ok) {
      correctCount += 1;
      M.markCorrect(item.wordKey);
      C.toast(toast, 'Correct! ▶', 'ok');
      C.playAudio(item.audio);
      blankInputs.forEach(inp => {
        const wrap = inp.parentElement;
        wrap.classList.add('is-correct');
        wrap.textContent = inp.dataset.answer;
      });
      blankInputs = [];
    } else {
      M.markWrong(item.wordKey);
      C.toast(toast, 'It\'s “' + item.word + '”', 'bad');
      blankInputs.forEach(inp => { inp.value = inp.dataset.answer; inp.disabled = true; });
    }
    blankInputs.forEach(inp => { inp.disabled = true; });
    btnNext.hidden = false;
    document.getElementById('prog').style.width = (((idx + 1) / items.length) * 100) + '%';
  });

  btnNext.addEventListener('click', () => {
    idx += 1;
    if (idx >= items.length) {
      document.getElementById('game').hidden = true;
      document.getElementById('done').hidden = false;
      document.getElementById('score-big').textContent = correctCount + ' / ' + items.length;
      if (B) B.writeResult(document.getElementById('badge-note'), B.recordSession(unitId, 'letters', mode));
      syncHardLock();
      return;
    }
    render();
  });

  syncHardLock();
  render();
})();
</script>
</body>
</html>
