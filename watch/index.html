<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Watch mode · English Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="watch.css?v=2"/>
</head>
<body class="">
<div class="app" id="app">
  <div class="face">
    <!-- Pack picker -->
    <section class="home" id="home">
      <header class="home-head">
        <h1>Watch mode</h1>
        <p>One word · big tap · audio</p>
      </header>
      <div class="packs" id="packs" role="list"></div>
      <footer class="home-foot"><a href="../index.html">Full site</a></footer>
    </section>

    <!-- Card play -->
    <section class="play" id="play" aria-live="polite">
      <div class="play-top">
        <button type="button" class="back" id="btn-back" aria-label="Back to packs">←</button>
        <div class="title" id="play-title">Pack</div>
        <div class="count" id="play-count">1/10</div>
      </div>
      <div class="stage" id="stage">
        <div class="illust-wrap"><img id="card-img" alt="" /></div>
        <p class="word" id="card-en"></p>
        <p class="syl" id="card-syl"></p>
        <p class="zh" id="card-zh"></p>
      </div>
      <div class="controls">
        <button type="button" class="nav" id="btn-prev" aria-label="Previous">◀</button>
        <button type="button" class="play-audio" id="btn-audio" aria-label="Play audio">▶</button>
        <button type="button" class="nav" id="btn-next" aria-label="Next">▶</button>
      </div>
    </section>
  </div>
</div>
<script src="packs.js"></script>
<script>
(function () {
  const tones = { unit1: 'tone-u1', unit2: 'tone-u2', unit3: 'tone-u3', unit4: 'tone-u4', dictation3: 'tone-d3' };
  const home = document.getElementById('home');
  const play = document.getElementById('play');
  const packsEl = document.getElementById('packs');
  const imgEl = document.getElementById('card-img');
  const enEl = document.getElementById('card-en');
  const sylEl = document.getElementById('card-syl');
  const zhEl = document.getElementById('card-zh');
  const titleEl = document.getElementById('play-title');
  const countEl = document.getElementById('play-count');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const btnAudio = document.getElementById('btn-audio');
  const btnBack = document.getElementById('btn-back');

  let packId = null;
  let idx = 0;
  let audio = null;

  function qsPack() {
    const q = new URLSearchParams(location.search);
    return q.get('pack');
  }

  function setUrl(pack, i) {
    const u = new URL(location.href);
    if (pack) {
      u.searchParams.set('pack', pack);
      u.searchParams.set('i', String(i + 1));
    } else {
      u.searchParams.delete('pack');
      u.searchParams.delete('i');
    }
    history.replaceState(null, '', u.pathname + u.search);
  }

  function stopAudio() {
    if (audio) { audio.pause(); audio = null; }
    btnAudio.classList.remove('is-playing');
    btnAudio.textContent = '▶';
  }

  function showHome() {
    stopAudio();
    packId = null;
    home.classList.remove('is-off');
    play.classList.remove('is-on');
    setUrl(null, 0);
  }

  function showPlay(id, startIdx) {
    const pack = window.WATCH_PACKS[id];
    if (!pack) { showHome(); return; }
    packId = id;
    idx = Math.max(0, Math.min(startIdx || 0, pack.cards.length - 1));
    home.classList.add('is-off');
    play.classList.add('is-on');
    titleEl.textContent = pack.title;
    renderCard();
    setUrl(id, idx);
  }

  function renderCard() {
    stopAudio();
    const pack = window.WATCH_PACKS[packId];
    const c = pack.cards[idx];
    enEl.textContent = c.en;
    sylEl.textContent = c.syllables;
    zhEl.textContent = c.zh + (c.pos ? '（' + c.pos + '）' : '');
    imgEl.src = c.img;
    imgEl.alt = c.en;
    countEl.textContent = (idx + 1) + '/' + pack.cards.length;
    btnPrev.disabled = idx <= 0;
    btnNext.disabled = idx >= pack.cards.length - 1;
  }

  function playAudio() {
    const pack = window.WATCH_PACKS[packId];
    if (!pack) return;
    const c = pack.cards[idx];
    stopAudio();
    audio = new Audio(c.audio);
    btnAudio.classList.add('is-playing');
    btnAudio.textContent = '…';
    audio.play().catch(function () {});
    audio.onended = function () {
      btnAudio.classList.remove('is-playing');
      btnAudio.textContent = '▶';
      audio = null;
    };
  }

  // Build pack list
  window.WATCH_PACK_LIST.forEach(function (p) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pack-btn ' + (tones[p.id] || '');
    b.setAttribute('role', 'listitem');
    b.innerHTML = p.title + '<span class="sub">' + p.sub + ' · ' + p.count + '</span>';
    b.addEventListener('click', function () { showPlay(p.id, 0); });
    packsEl.appendChild(b);
  });

  btnBack.addEventListener('click', showHome);
  btnPrev.addEventListener('click', function () {
    if (idx > 0) { idx--; renderCard(); setUrl(packId, idx); }
  });
  btnNext.addEventListener('click', function () {
    const pack = window.WATCH_PACKS[packId];
    if (idx < pack.cards.length - 1) { idx++; renderCard(); setUrl(packId, idx); }
  });
  btnAudio.addEventListener('click', playAudio);
  // Tap stage to play
  document.getElementById('stage').addEventListener('click', playAudio);

  // Boot from query
  const boot = qsPack();
  const bootI = parseInt(new URLSearchParams(location.search).get('i') || '1', 10) - 1;
  if (boot && window.WATCH_PACKS[boot]) showPlay(boot, isNaN(bootI) ? 0 : bootI);
})();
</script>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('device') === 'huawei' || q.get('frame') === 'huawei') {
    document.body.classList.add('device-huawei');
  }
  // Auto-enable squircle frame on typical watch-sized viewports for review
  if (window.innerWidth <= 280 && window.innerHeight >= window.innerWidth * 1.15) {
    document.body.classList.add('device-huawei');
  }
})();
</script>
</body>
</html>
