<script src="../assets/last-place.js"></script>
<script>
const CARDS = [{"n": 1, "en": "China", "syllables": "Chi-na", "zh": "中國", "pos": "名詞 n.", "ex_en": "The Great Wall is in China.", "ex_zh": "萬里長城在中國。", "adv_en": "If you enjoy ancient history, you can visit China and walk along the Great Wall near Beijing.", "adv_zh": "如果你喜歡古代歷史，可以到中國，沿着北京附近的萬里長城步行。", "highlight": "China", "audio": "audio/audio_01.mp3", "img": "thumb_01.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/01/blog-post_92.html"}, {"n": 2, "en": "Canada", "syllables": "Can-a-da", "zh": "加拿大", "pos": "名詞 n.", "ex_en": "Maple leaves are a symbol of Canada.", "ex_zh": "楓葉是加拿大的象徵。", "adv_en": "Because maple trees turn bright red in autumn, many visitors photograph the leaves when they travel in Canada.", "adv_zh": "因為楓樹在秋天會變成鮮紅色，許多旅客在加拿大旅行時都會拍攝楓葉。", "highlight": "Canada", "audio": "audio/audio_02.mp3", "img": "thumb_02.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/02/blog-post_94.html"}, {"n": 3, "en": "Japan", "syllables": "Ja-pan", "zh": "日本", "pos": "名詞 n.", "ex_en": "Mount Fuji is in Japan.", "ex_zh": "富士山在日本。", "adv_en": "Although Mount Fuji is often hidden by clouds, travellers still hope to see it clearly when they visit Japan.", "adv_zh": "雖然富士山常常被雲遮住，旅客到日本時仍希望能清楚看見它。", "highlight": "Japan", "audio": "audio/audio_03.mp3", "img": "thumb_03.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2014/05/blog-post_1792.html"}, {"n": 4, "en": "Korea", "syllables": "Ko-re-a", "zh": "韓國", "pos": "名詞 n.", "ex_en": "Seoul is a big city in Korea.", "ex_zh": "首爾是韓國的大城市。", "adv_en": "After her meetings in Busan finish, my aunt will spend a weekend in Seoul, a big city in Korea.", "adv_zh": "在釜山的會議結束後，阿姨會在韓國的大城市首爾度過一個週末。", "highlight": "Korea", "audio": "audio/audio_04.mp3", "img": "thumb_04.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_3182.html"}, {"n": 5, "en": "Italy", "syllables": "It-a-ly", "zh": "意大利", "pos": "名詞 n.", "ex_en": "The leaning tower is in Italy.", "ex_zh": "斜塔在意大利。", "adv_en": "While guides explain its unusual shape, visitors stand below the leaning tower in Italy and take photos.", "adv_zh": "當導遊講解它奇特的外形時，旅客站在意大利的斜塔下拍照。", "highlight": "Italy", "audio": "audio/audio_05.mp3", "img": "thumb_05.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2012/07/blog-post_08.html"}, {"n": 6, "en": "Scotland", "syllables": "Scot-land", "zh": "蘇格蘭", "pos": "名詞 n.", "ex_en": "People play the bagpipes in Scotland.", "ex_zh": "人們在蘇格蘭吹奏風笛。", "adv_en": "Bands play the bagpipes in Scotland so that dancers can keep time during the national parade.", "adv_zh": "樂隊在蘇格蘭吹奏風笛，好讓舞者在國家巡遊中跟上節拍。", "highlight": "Scotland", "audio": "audio/audio_06.mp3", "img": "thumb_06.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/12/blog-post_227.html"}, {"n": 7, "en": "cheongsam", "syllables": "cheong-sam", "zh": "旗袍", "pos": "名詞 n.", "ex_en": "Auntie wears a cheongsam at the wedding.", "ex_zh": "阿姨在婚禮上穿旗袍。", "adv_en": "Even though modern dresses are common now, Auntie still chooses a red cheongsam for the traditional wedding.", "adv_zh": "即使現在流行現代禮服，阿姨在傳統婚禮上仍選穿紅色旗袍。", "highlight": "cheongsam", "audio": "audio/audio_07.mp3", "img": "thumb_07.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/10/blog-post_9396.html"}, {"n": 8, "en": "a Chinese opera", "syllables": "a Chi-nese op-er-a", "zh": "中國戲曲／京劇表演", "pos": "名詞片語 n. phr.", "ex_en": "We watched a Chinese opera with bright face paint.", "ex_zh": "我們看了一場有鮮豔臉譜的中國戲曲。", "adv_en": "As the drums and gongs grow louder, we watch a Chinese opera with bright face paint and long sleeves.", "adv_zh": "隨着鼓鑼聲愈來愈響，我們觀看一場有鮮豔臉譜與長袖的中國戲曲。", "highlight": "a Chinese opera", "audio": "audio/audio_08.mp3", "img": "thumb_08.png", "cutout": true, "art_source": "generated"}, {"n": 9, "en": "ice hockey", "syllables": "ice hock-ey", "zh": "冰球", "pos": "名詞 n.", "ex_en": "They play ice hockey on the frozen rink.", "ex_zh": "他們在冰場上打冰球。", "adv_en": "Since the puck can fly across the ice so quickly, players must stay alert while they play ice hockey.", "adv_zh": "由於冰球能在冰上飛得很快，球員打冰球時必須保持警覺。", "highlight": "ice hockey", "audio": "audio/audio_09.mp3", "img": "thumb_09.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/05/blog-post_594.html"}, {"n": 10, "en": "a kimono", "syllables": "a ki-mo-no", "zh": "和服", "pos": "名詞 n.", "ex_en": "She wears a kimono with a wide sash.", "ex_zh": "她穿着有寬腰帶的和服。", "adv_en": "Before the summer festival begins, she puts on a kimono with a wide sash and checks the bow at the back.", "adv_zh": "夏日祭典開始前，她穿上有寬腰帶的和服，並檢查背後的蝴蝶結。", "highlight": "a kimono", "audio": "audio/audio_10.mp3", "img": "thumb_10.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/01/blog-post_297.html"}, {"n": 11, "en": "origami", "syllables": "o-ri-ga-mi", "zh": "摺紙", "pos": "名詞 n.", "ex_en": "We practise origami and fold a paper crane.", "ex_zh": "我們練習摺紙，並摺成一隻紙鶴。", "adv_en": "Once the teacher has shown each careful fold, we practise origami until every paper crane can stand on the desk.", "adv_zh": "老師一示範完每個仔細的摺法，我們便練習摺紙，直到每隻紙鶴都能站在桌上。", "highlight": "origami", "audio": "audio/audio_11.mp3", "img": "thumb_11.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/06/blog-post_7774.html"}, {"n": 12, "en": "kimchi", "syllables": "kim-chi", "zh": "泡菜", "pos": "名詞 n.", "ex_en": "Kimchi is a spicy cabbage side dish.", "ex_zh": "泡菜是一道辣白菜小菜。", "adv_en": "Although the cabbage tastes very spicy at first, kimchi is still served beside the rice at almost every Korean meal.", "adv_zh": "雖然白菜起初吃起來很辣，泡菜在幾乎每頓韓國餐中仍會配着飯一起上桌。", "highlight": "kimchi", "audio": "audio/audio_12.mp3", "img": "thumb_12.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/10/blog-post_23.html"}, {"n": 13, "en": "a carnival", "syllables": "a car-ni-val", "zh": "嘉年華／狂歡節", "pos": "名詞 n.", "ex_en": "The street has a carnival with floats and confetti.", "ex_zh": "街上有嘉年華，有花車和紙屑。", "adv_en": "The town organises a carnival with floats and confetti so that families can enjoy the music in the street.", "adv_zh": "鎮上籌辦有花車與紙屑的嘉年華，好讓家庭能在街上享受音樂。", "highlight": "a carnival", "audio": "audio/audio_13.mp3", "img": "thumb_13.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2020/01/blog-post_248.html"}, {"n": 14, "en": "a Venetian mask", "syllables": "a Ve-ne-tian mask", "zh": "威尼斯面具", "pos": "名詞片語 n. phr.", "ex_en": "She holds a Venetian mask at the party.", "ex_zh": "她在派對上拿着威尼斯面具。", "adv_en": "If she wants to keep her face a secret at the fancy-dress party, she wears a Venetian mask over her eyes.", "adv_zh": "如果她想在化裝派對上不讓人認出自己，就會戴上威尼斯面具遮住眼睛。", "highlight": "a Venetian mask", "audio": "audio/audio_14.mp3", "img": "thumb_14.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/12/blog-post_505.html"}, {"n": 15, "en": "a kilt", "syllables": "a kilt", "zh": "蘇格蘭短裙（格子呢）", "pos": "名詞 n.", "ex_en": "He wears a kilt in a tartan pattern.", "ex_zh": "他穿着格子呢的蘇格蘭短裙。", "adv_en": "Because he is marching with a Scottish band, he wears a kilt in a tartan pattern and thick knee socks.", "adv_zh": "因為他要與蘇格蘭樂隊一起行進，他穿着格子呢蘇格蘭短裙和厚膝襪。", "highlight": "a kilt", "audio": "audio/audio_15.mp3", "img": "thumb_15.png", "cutout": true, "art_source": "generated"}, {"n": 16, "en": "an African drum", "syllables": "an Af-ri-can drum", "zh": "非洲鼓", "pos": "名詞片語 n. phr.", "ex_en": "The player beats an African drum.", "ex_zh": "演奏者敲打非洲鼓。", "adv_en": "While the dancers stamp and clap, he beats an African drum with both hands to keep a strong beat.", "adv_zh": "當舞者踏腳拍手時，他用雙手敲打非洲鼓，以保持有力的節拍。", "highlight": "an African drum", "audio": "audio/audio_16.mp3", "img": "thumb_16.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/06/blog-post_575.html"}, {"n": 17, "en": "samba", "syllables": "sam-ba", "zh": "森巴舞", "pos": "名詞 n.", "ex_en": "The dancers perform samba in the street.", "ex_zh": "舞者在街上跳森巴舞。", "adv_en": "The dancers who perform samba in the street smile and wave as the music grows faster.", "adv_zh": "在街上跳森巴舞的舞者，隨着音樂加快而微笑並向人揮手。", "highlight": "samba", "audio": "audio/audio_17.mp3", "img": "thumb_17.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/06/blog-post_988.html"}, {"n": 18, "en": "belly dance", "syllables": "bel-ly dance", "zh": "肚皮舞", "pos": "名詞 n.", "ex_en": "She learns belly dance with a coin scarf.", "ex_zh": "她跟着有錢幣的圍巾學肚皮舞。", "adv_en": "After she ties the coin scarf around her hips, she practises belly dance slowly in front of the mirror.", "adv_zh": "她把錢幣圍巾繫在髖部後，便在鏡前慢慢練習肚皮舞。", "highlight": "belly dance", "audio": "audio/audio_18.mp3", "img": "thumb_18.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/10/blog-post_31.html"}, {"n": 19, "en": "rock music", "syllables": "rock mu-sic", "zh": "搖滾樂", "pos": "名詞 n.", "ex_en": "The band plays rock music on electric guitars.", "ex_zh": "樂隊用電結他演奏搖滾樂。", "adv_en": "Although the neighbours complain about the noise, the band still plays rock music on electric guitars after school.", "adv_zh": "雖然鄰居投訴噪音，樂隊放學後仍用電結他演奏搖滾樂。", "highlight": "rock music", "audio": "audio/audio_19.mp3", "img": "thumb_19.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/02/blog-post_8510.html"}, {"n": 20, "en": "until", "syllables": "un-til", "zh": "直到……為止", "pos": "", "ex_en": "We play outside until the weather gets too cold.", "ex_zh": "我們在外面玩，直到天氣變得太冷。", "adv_en": "The children stay in the park until the weather gets too cold, and then they go indoors.", "adv_zh": "孩子們留在公園，直到天氣變得太冷，然後他們走進室內。", "highlight": "until", "audio": "audio/audio_20.mp3", "img": "thumb_20.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_4063.html"}, {"n": 21, "en": "each", "syllables": "each", "zh": "每一", "pos": "", "ex_en": "Each dancer holds a pair of candles.", "ex_zh": "每一位舞者拿着一對蠟燭。", "adv_en": "On the stage, each dancer holds a pair of candles while the music plays.", "adv_zh": "在舞台上，每一位舞者在音樂聲中拿着一對蠟燭。", "highlight": "each", "audio": "audio/audio_21.mp3", "img": "thumb_21.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/06/blog-post_5010.html"}, {"n": 22, "en": "both", "syllables": "both", "zh": "兩個都", "pos": "", "ex_en": "Both dancers come from India.", "ex_zh": "兩位舞者都來自印度。", "adv_en": "Although they are still young, both dancers come from India and train hard.", "adv_zh": "雖然他們年紀尚輕，兩位舞者都來自印度並努力練習。", "highlight": "both", "audio": "audio/audio_22.mp3", "img": "thumb_22.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/10/blog-post_284.html"}, {"n": 23, "en": "several", "syllables": "sev-er-al", "zh": "幾個（三個或以上）", "pos": "", "ex_en": "Several balloons floated above the stage.", "ex_zh": "有幾個氣球漂浮在舞台上方。", "adv_en": "Although the party was over, several balloons were still hanging from the ceiling.", "adv_zh": "雖然派對已結束，天花板上仍掛着幾個氣球。", "highlight": "several", "audio": "audio/audio_23.mp3", "img": "thumb_23.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/09/blog-post_191.html"}];
const WORDS_MAX = 19;
const list = document.getElementById('list');
const FILLS = ['fill-a','fill-b','fill-c','fill-d','fill-e','fill-f'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  activeCard = { card, article };
  lbImg.src = card.img + "?v=2";
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio + "?v=3");
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

function glossLine(card) {
  return card.pos ? card.zh + '（' + card.pos + '）' : card.zh;
}

function showSyllableLine(card) {
  var syl = String(card.syllables || '');
  var norm = function (value) {
    return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
  };
  if (norm(syl) === norm(card.en)) return false;
  if (syl.indexOf('-') < 0) return false;
  return true;
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];
  article.id = 'c' + card.n;
  article.dataset.section = card.n <= WORDS_MAX ? 'words' : 'grammar';

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust' + (card.cutout ? ' cutout' : '');
    const img = document.createElement('img');
    img.src = card.img + "?v=2"; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + card.n + '</span>' +
    '<p class="headword">' + card.en + '</p>' +
    (showSyllableLine(card) ? '<p class="syllables is-break">' + card.syllables + '</p>' : '') +
    '<p class="zh">' + glossLine(card) + '</p>';
  top.appendChild(main);
  article.appendChild(top);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
function showSection(name) {
  document.querySelectorAll('.section-pill').forEach(function (btn) {
    var on = btn.dataset.section === name;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#list .card').forEach(function (el) {
    el.hidden = el.dataset.section !== name;
  });
}
document.querySelectorAll('.section-pill').forEach(function (btn) {
  btn.addEventListener('click', function () { showSection(btn.dataset.section); });
});
var hashN = Number(String(location.hash).replace('#c', ''));
showSection(hashN > WORDS_MAX ? 'grammar' : 'words');
if (window.LastPlace && location.hash) {
  var hashed = CARDS.filter(function (c) { return c.n === hashN; })[0];
  if (hashed) LastPlace.save(hashed);
  LastPlace.focusHash();
}
</script>
</body>
</html>
