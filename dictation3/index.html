<!DOCTYPE html>
<html lang="en">
<head>

<title>Dictation 3 flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>

<body class="theme-dictation3">
<header class="unit-header">
  <a class="back" href="../index.html">Back to packs</a>
  <h1>Dictation 3</h1>
  <p class="sub">15 cards · Film genres, adjectives and similes · Primary 6 + Form 1 examples</p>
</header>
<p class="hint">Tap Play for audio. Tap the illustration to enlarge.</p>
<div class="list" id="list"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarge illustration">
  <img id="lb-img" alt="" />
  <div class="lb-bar">
    <button type="button" class="lb-btn lb-play" id="lb-play">Play audio</button>
    <button type="button" class="lb-btn lb-close" id="lb-close">Close</button>
  </div>
</div>
<script src="../assets/last-place.js"></script>
<script>
const CARDS = [{"n": 1,"en": "an action film","syllables": "an ac-tion film","zh": "動作片","pos": "名詞 n.","ex_en": "The hero fights a giant monster in an action film.","ex_zh": "在動作片裡，英雄與一隻巨大怪獸打鬥。","adv_en": "Because the fights look exciting, many children love an action film about a brave hero.","adv_zh": "因為打鬥場面很刺激，很多小朋友都喜歡關於勇敢英雄的動作片。","highlight": "an action film","audio": "audio/audio_01.mp3","img": "thumb_01.png"},{"n": 2,"en": "a comedy","syllables": "a com-e-dy","zh": "喜劇","pos": "名詞 n.","ex_en": "The two men tell funny jokes in a comedy.","ex_zh": "那兩個男人在喜劇裡說好笑的笑話。","adv_en": "When the actors tell silly jokes, everyone laughs at a comedy.","adv_zh": "當演員說傻傻的笑話時，大家都為喜劇發笑。","highlight": "a comedy","audio": "audio/audio_02.mp3","img": "thumb_02.png"},{"n": 3,"en": "a fantasy film","syllables": "a fan-ta-sy film","zh": "奇幻片","pos": "名詞 n.","ex_en": "In a fantasy film, a girl lives in a tall tower.","ex_zh": "在奇幻片裡，一個女孩住在高塔中。","adv_en": "Although magic is not real, she still enjoys a fantasy film about a girl with long hair.","adv_zh": "雖然魔法並不真實，她仍喜歡關於長髮女孩的奇幻片。","highlight": "a fantasy film","audio": "audio/audio_03.mp3","img": "thumb_03.png"},{"n": 4,"en": "a horror film","syllables": "a hor-ror film","zh": "恐怖片","pos": "名詞 n.","ex_en": "The girl covers her eyes during a horror film.","ex_zh": "看恐怖片時，那個女孩用手遮住眼睛。","adv_en": "Although she is brave at school, she is still scared of a horror film at night.","adv_zh": "雖然她在學校很勇敢，晚上看恐怖片時她仍然害怕。","highlight": "a horror film","audio": "audio/audio_04.mp3","img": "thumb_04.png"},{"n": 5,"en": "a musical","syllables": "a mu-si-cal","zh": "音樂劇／歌舞片","pos": "名詞 n.","ex_en": "The woman sings and dances in a musical.","ex_zh": "那位女士在音樂劇裡又唱又跳。","adv_en": "If you like songs and dance, you will enjoy a musical on the big screen.","adv_zh": "如果你喜歡歌曲和舞蹈，你會喜歡大銀幕上的音樂劇。","highlight": "a musical","audio": "audio/audio_05.mp3","img": "thumb_05.png"},{"n": 6,"en": "cruel","syllables": "cru-el","zh": "殘忍的","pos": "形容詞 adj.","ex_en": "The cruel witch stirs the fire in her cauldron.","ex_zh": "殘忍的女巫正在攪動鍋裡的火。","adv_en": "Although the witch smiles, she is cruel to everyone around her.","adv_zh": "雖然女巫面帶笑容，但她對身邊的人都很殘忍。","highlight": "cruel","audio": "audio/audio_06.mp3","img": "thumb_06.png"},{"n": 7,"en": "curious","syllables": "cu-ri-ous","zh": "好奇的","pos": "形容詞 adj.","ex_en": "The curious girl looks closely at the little insect.","ex_zh": "好奇的女孩仔細看著那隻小昆蟲。","adv_en": "When she finds something new, the curious girl always asks many questions.","adv_zh": "當她發現新事物時，好奇的女孩總是會問很多問題。","highlight": "curious","audio": "audio/audio_07.mp3","img": "thumb_07.png"},{"n": 8,"en": "obedient","syllables": "o-be-di-ent","zh": "聽話的","pos": "形容詞 adj.","ex_en": "The obedient girl stands quietly with her dog.","ex_zh": "聽話的女孩安靜地和狗站在一起。","adv_en": "The obedient girl, who always listens to her parents, waits patiently with her dog.","adv_zh": "那位總是聽父母話的聽話女孩，耐心地和狗一起等待。","highlight": "obedient","audio": "audio/audio_08.mp3","img": "thumb_08.png"},{"n": 9,"en": "timid","syllables": "tim-id","zh": "膽小的","pos": "形容詞 adj.","ex_en": "The timid boy hides behind the wall.","ex_zh": "膽小的男孩躲在牆後面。","adv_en": "Although the mouse is tiny, the timid boy still hides behind the wall.","adv_zh": "雖然老鼠很小，膽小的男孩仍躲在牆後面。","highlight": "timid","audio": "audio/audio_09.mp3","img": "thumb_09.png"},{"n": 10,"en": "wicked","syllables": "wick-ed","zh": "邪惡的","pos": "形容詞 adj.","ex_en": "The wicked witch casts a spell.","ex_zh": "邪惡的女巫施展咒語。","adv_en": "The wicked witch, who wears a pointed hat, plans to make trouble for everyone.","adv_zh": "那個戴尖帽的邪惡女巫，打算給大家製造麻煩。","highlight": "wicked","audio": "audio/audio_10.mp3","img": "thumb_10.png"},{"n": 11,"en": "as blind as a bat","syllables": "as blind as a bat","zh": "像蝙蝠一樣看不見","pos": "習語 idiom.","ex_en": "Without his glasses, he is as blind as a bat.","ex_zh": "沒戴眼鏡時，他像蝙蝠一樣看不清。","adv_en": "When he forgets his glasses, he is as blind as a bat and cannot read the board.","adv_zh": "當他忘記戴眼鏡時，他像蝙蝠一樣看不清，連黑板也讀不到。","highlight": "as blind as a bat","audio": "audio/audio_11.mp3","img": "thumb_11.png"},{"n": 12,"en": "as busy as a bee","syllables": "as bus-y as a bee","zh": "像蜜蜂一樣忙碌","pos": "習語 idiom.","ex_en": "Mum is as busy as a bee in the kitchen.","ex_zh": "媽媽在廚房裡像蜜蜂一樣忙碌。","adv_en": "Because there is so much homework, she is as busy as a bee all afternoon.","adv_zh": "因為功課很多，她整個下午都像蜜蜂一樣忙碌。","highlight": "as busy as a bee","audio": "audio/audio_12.mp3","img": "thumb_12.png"},{"n": 13,"en": "as free as a bird","syllables": "as free as a bird","zh": "像鳥兒一樣自由","pos": "習語 idiom.","ex_en": "On the holiday he feels as free as a bird.","ex_zh": "假期裡他感覺像鳥兒一樣自由。","adv_en": "When school ends, she feels as free as a bird and runs in the park.","adv_zh": "放學後，她感覺像鳥兒一樣自由，在公園裡奔跑。","highlight": "as free as a bird","audio": "audio/audio_13.mp3","img": "thumb_13.png"},{"n": 14,"en": "as strong as an ox","syllables": "as strong as an ox","zh": "像牛一樣強壯","pos": "習語 idiom.","ex_en": "My brother is as strong as an ox.","ex_zh": "我哥哥像牛一樣強壯。","adv_en": "Although he is young, he is as strong as an ox and can carry heavy bags.","adv_zh": "雖然他還年輕，但他像牛一樣強壯，能提很重的袋子。","highlight": "as strong as an ox","audio": "audio/audio_14.mp3","img": "thumb_14.png"},{"n": 15,"en": "as hungry as a wolf","syllables": "as hun-gry as a wolf","zh": "像狼一樣餓","pos": "習語 idiom.","ex_en": "After PE I am as hungry as a wolf.","ex_zh": "上完 PE 我餓得像狼一樣。","adv_en": "After PE class, I am as hungry as a wolf, so I cannot wait for dinner.","adv_zh": "上完 PE 課後，我餓得像狼一樣，所以等不及要吃晚飯。","highlight": "as hungry as a wolf","audio": "audio/audio_15.mp3","img": "thumb_15.png"}];
const list = document.getElementById('list');
const FILLS = ['fill-a','fill-b','fill-c','fill-d','fill-e','fill-f'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  activeCard = { card, article };
  lbImg.src = card.img;
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio);
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];
  article.id = 'c' + card.n;

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust';
    const img = document.createElement('img');
    img.src = card.img; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + card.n + '</span>' +
    '<p class="syllables">' + card.syllables + '</p>' +
    '<p class="zh">' + card.zh + '（' + card.pos + '）</p>';
  top.appendChild(main);
  article.appendChild(top);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
if (window.LastPlace && location.hash) {
  var hashN = Number(String(location.hash).replace('#c', ''));
  var hashed = CARDS.filter(function (c) { return c.n === hashN; })[0];
  if (hashed) LastPlace.save(hashed);
  LastPlace.focusHash();
}
</script>
</body>
</html>
