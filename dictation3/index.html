<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no"/>
<title>Dictation 3 flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../assets/unit.css"/>
</head>
<body>
<header class="unit-header">
  <a class="back" href="../index.html">Back to packs</a>
  <h1>Dictation 3</h1>
  <p class="sub">15 cards · Film genres, adjectives and similes</p>
</header>
<p class="hint">Tap Play for audio. Tap the picture to enlarge.</p>
<div class="grid" id="grid"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarge illustration">
  <img id="lb-img" alt="" />
  <div class="lb-bar">
    <button type="button" class="lb-btn lb-play" id="lb-play">Play audio</button>
    <button type="button" class="lb-btn lb-close" id="lb-close">Close</button>
  </div>
</div>
<script>
const CARDS = [
      { n: 1,  img: "card_01_action_film.png",   audio: "audio/audio_01.mp3", label: "an action film" },
      { n: 2,  img: "card_02_comedy.png",        audio: "audio/audio_02.mp3", label: "a comedy" },
      { n: 3,  img: "card_03_fantasy_film.png",  audio: "audio/audio_03.mp3", label: "a fantasy film" },
      { n: 4,  img: "card_04_horror_film.png",   audio: "audio/audio_04.mp3", label: "a horror film" },
      { n: 5,  img: "card_05_musical.png",       audio: "audio/audio_05.mp3", label: "a musical" },
      { n: 6,  img: "card_06_cruel.png",         audio: "audio/audio_06.mp3", label: "cruel" },
      { n: 7,  img: "card_07_curious.png",       audio: "audio/audio_07.mp3", label: "curious" },
      { n: 8,  img: "card_08_obedient.png",      audio: "audio/audio_08.mp3", label: "obedient" },
      { n: 9,  img: "card_09_timid.png",         audio: "audio/audio_09.mp3", label: "timid" },
      { n: 10, img: "card_10_wicked.png",        audio: "audio/audio_10.mp3", label: "wicked" },
      { n: 11, img: "card_11_blind_as_bat.png",  audio: "audio/audio_11.mp3", label: "as blind as a bat" },
      { n: 12, img: "card_12_busy_as_bee.png",   audio: "audio/audio_12.mp3", label: "as busy as a bee" },
      { n: 13, img: "card_13_free_as_bird.png",  audio: "audio/audio_13.mp3", label: "as free as a bird" },
      { n: 14, img: "card_14_strong_as_ox.png",  audio: "audio/audio_14.mp3", label: "as strong as an ox" },
      { n: 15, img: "card_15_hungry_as_wolf.png",audio: "audio/audio_15.mp3", label: "as hungry as a wolf" }
    ];
const grid = document.getElementById("grid");
const lightbox = document.getElementById("lightbox");
const lbImg = document.getElementById("lb-img");
const lbPlay = document.getElementById("lb-play");
const lbClose = document.getElementById("lb-close");
const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let currentCardEl = null;
let activeCard = null;

function openLightbox(card, el) {
  activeCard = { card, el };
  lbImg.src = card.img;
  lbImg.alt = card.label;
  lightbox.classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeLightbox() {
  lightbox.classList.remove("open");
  document.body.style.overflow = "";
  activeCard = null;
}
if (lbClose) lbClose.addEventListener("click", closeLightbox);
if (lightbox) lightbox.addEventListener("click", e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener("click", () => { if (activeCard) playCard(activeCard.card, activeCard.el); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });

function playCard(card, el) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll(".d-card.playing").forEach(n => n.classList.remove("playing"));
  el.classList.add("playing");
  const a = new Audio(card.audio);
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => el.classList.remove("playing");
}

CARDS.forEach(card => {
  const article = document.createElement("article");
  article.className = "d-card card";

  const speaker = document.createElement("button");
  speaker.type = "button";
  speaker.className = "speaker";
  speaker.setAttribute("aria-label", "Play: " + card.label);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener("click", e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const wrap = document.createElement("div");
  wrap.className = "illust";
  const img = document.createElement("img");
  img.src = card.img; img.alt = card.label; img.loading = "lazy"; img.decoding = "async";
  wrap.appendChild(img);
  wrap.setAttribute("role", "button");
  wrap.setAttribute("tabindex", "0");
  wrap.setAttribute("aria-label", "Enlarge: " + card.label);
  wrap.addEventListener("click", e => { e.stopPropagation(); openLightbox(card, article); });
  wrap.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(card, article); }
  });
  article.appendChild(wrap);

  const lab = document.createElement("p");
  lab.className = "label-word";
  lab.innerHTML = '<span class="num">' + card.n + '</span> ' + card.label;
  article.appendChild(lab);

  article.addEventListener("click", e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  grid.appendChild(article);
});
</script>
</body>
</html>
