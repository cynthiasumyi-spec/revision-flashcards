<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no"/>
<title>Unit 1 For a good cause</title>
<style>
:root {
  --bg:#fcf0d8; --cream:#fcf0d8; --navy:#243c6c; --white:#ffffff;
  --coral:#fc903c; --green:#009c48; --sky:#84c0e4; --sunny:#fcc03c; --pink:#f0909c;
  --muted:#5a6570; --ink:#183c6c; --radius:22px;
  --illust:210px;
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; background:var(--bg); color:var(--navy);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header {
  position:sticky; top:0; z-index:10;
  background:rgba(252,240,216,.96);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:0; box-shadow:none;
  padding:14px 16px 12px;
}
/* Solid coral color block (not a stroke frame) */
header::after {
  content:""; display:block; height:8px; background:var(--coral);
  margin:12px -16px -12px;
}
.back { display:inline-block; color:var(--coral); text-decoration:none; font-weight:700; font-size:.92rem; margin-bottom:6px; }
h1 { margin:0; font-size:1.28rem; font-weight:800; color:var(--navy); }
.sub { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
.hint { max-width:720px; margin:10px auto 0; padding:0 16px; color:var(--muted); font-size:.88rem; }
.list {
  max-width:720px; margin:0 auto;
  padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:16px;
}
/* Canva Class News: solid fills, rounded, NO outer stroke */
.card {
  border-radius:var(--radius);
  box-shadow:none; border:0; outline:none;
  padding:16px 16px 14px; position:relative;
  color:var(--white);
}
.card.fill-coral { background:var(--coral); color:var(--white); }
.card.fill-green { background:var(--green); color:var(--white); }
.card.fill-navy  { background:var(--navy);  color:var(--white); }
.card.fill-sky   { background:var(--sky);   color:#183c6c; }
.card.fill-sunny { background:var(--sunny); color:#183c6c; }
.card.fill-pink  { background:var(--pink);  color:var(--white); }
.card.playing { outline:none; }
.top { display:flex; gap:14px; align-items:flex-start; }
.illust {
  flex:0 0 var(--illust); width:var(--illust); height:var(--illust);
  border-radius:14px; background:var(--white); overflow:hidden;
  border:0; box-shadow:none; cursor:zoom-in;
}
.illust img {
  width:100%; height:100%; object-fit:cover; object-position:center; background:var(--white);
  display:block; box-shadow:none; filter:none;
}
.main { flex:1; min-width:0; padding-right:56px; }
.num {
  display:inline-grid; place-items:center;
  min-width:28px; height:28px; padding:0 8px; border-radius:8px;
  background:rgba(255,255,255,.28); color:inherit;
  font-weight:800; font-size:.85rem; margin-bottom:6px;
}
.fill-sky .num, .fill-sunny .num {
  background:rgba(24,60,108,.14); color:#183c6c;
}
.syllables {
  font-size:1.5rem; font-weight:800; color:inherit;
  line-height:1.25; margin:0 0 6px; word-break:break-word;
}
.zh {
  font-size:1.02rem; font-weight:700; color:inherit;
  margin:0 0 4px; line-height:1.35; opacity:.95;
}
.speaker {
  position:absolute; top:14px; right:14px;
  width:52px; height:52px; border-radius:50%; border:0;
  background:rgba(255,255,255,.95); color:var(--navy); font-size:1.45rem;
  box-shadow:none !important; filter:none !important; text-shadow:none;
  display:grid; place-items:center; cursor:pointer; z-index:3; line-height:1;
}
.fill-sky .speaker, .fill-sunny .speaker {
  background:var(--navy); color:var(--white);
}
.speaker:active { transform:scale(.94); }
.card.playing .speaker {
  outline:3px solid var(--sunny); outline-offset:2px;
  box-shadow:none !important; animation:none; filter:none;
}
/* Example: high-contrast near-white inset on ALL fills (navy text) */
.ex {
  background:rgba(255,255,255,.92);
  border:0; border-radius:14px; padding:12px; margin-top:10px;
  color:#183c6c;
}
.ex-label {
  display:inline-block; font-size:.78rem; font-weight:800;
  color:#fff; background:#183c6c;
  border-radius:999px; padding:3px 10px; margin-bottom:6px;
}
.ex-en { font-size:.98rem; line-height:1.45; color:#183c6c; margin:0 0 4px; }
.ex-zh { font-size:.9rem; line-height:1.4; color:#183c6c; opacity:.92; margin:0; }
/* Universal vocab highlight: navy chip + white text (passes on every fill) */
.hl {
  background:#183c6c; color:#fff; font-weight:800;
  padding:0 4px; border-radius:4px;
}
@media (min-width:640px) {
  :root { --illust:248px; }
  .syllables { font-size:1.7rem; }
}
@media (max-width:380px) {
  :root { --illust:168px; }
}
/* Lightbox */
.lightbox {
  position:fixed; inset:0; z-index:100;
  background:rgba(36,60,108,.92);
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
.lightbox.open { display:flex; }
.lightbox img {
  max-width:100%; max-height:calc(100vh - 88px);
  width:auto; height:auto; object-fit:contain;
  border-radius:16px; background:var(--white); box-shadow:none;
}
.lb-bar {
  display:flex; gap:12px; align-items:center; justify-content:center;
  margin-top:12px; width:100%; max-width:480px;
}
.lb-btn {
  appearance:none; border:0; border-radius:999px;
  padding:12px 18px; font-size:1rem; font-weight:700;
  cursor:pointer; color:var(--white); box-shadow:none;
}
.lb-close { background:var(--navy); }
.lb-play { background:var(--coral); }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← Back to home</a>
  <h1>Unit 1 For a good cause</h1>
  <p class="sub">10 words · Primary 6 examples + Form 1 advanced examples</p>
</header>
<p class="hint">Tap the speaker for audio; tap the illustration to enlarge. Mid-size art, no shadow or frame.</p>
<div class="list" id="list"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarge illustration">
  <img id="lb-img" alt="" />
  <div class="lb-bar">
    <button type="button" class="lb-btn lb-play" id="lb-play">🔊 Play audio</button>
    <button type="button" class="lb-btn lb-close" id="lb-close">Close</button>
  </div>
</div>
<script>
const CARDS = [{"n": 1, "en": "adopt a pet", "syllables": "a-dopt a pet", "zh": "領養寵物", "pos": "動詞 v.", "ex_en": "The family wants to adopt a pet from the shelter.", "ex_zh": "這家人想從收容所領養寵物。", "adv_en": "Because they love animals, the family decided to adopt a pet that needed a home.", "adv_zh": "因為他們喜愛動物，這家人決定領養一隻需要家的寵物。", "highlight": "adopt a pet", "audio": "audio/audio_01.mp3", "img": "thumb_01.jpg", "art_source": "generated"}, {"n": 2, "en": "be a volunteer", "syllables": "be a vol-un-teer", "zh": "當志願者", "pos": "動詞短語 v.", "ex_en": "The boy is happy to be a volunteer.", "ex_zh": "那個男孩很高興當志願者。", "adv_en": "When the school needs helpers, he is always glad to be a volunteer.", "adv_zh": "當學校需要幫手時，他總是樂於當志願者。", "highlight": "be a volunteer", "audio": "audio/audio_02.mp3", "img": "thumb_02.jpg", "art_source": "generated"}, {"n": 3, "en": "buy/sell flags", "syllables": "buy/sell flags", "zh": "買／賣旗籌", "pos": "動詞短語 v.", "ex_en": "The children buy/sell flags to raise money.", "ex_zh": "孩子們買／賣旗籌來籌款。", "adv_en": "Although it is raining, the children still buy/sell flags for charity.", "adv_zh": "雖然下着雨，孩子們仍為慈善買／賣旗籌。", "highlight": "buy/sell flags", "audio": "audio/audio_03.mp3", "img": "thumb_03.jpg", "art_source": "generated"}, {"n": 4, "en": "buy/sell raffle tickets", "syllables": "buy/sell raf-fle tick-ets", "zh": "買／賣抽獎券", "pos": "動詞短語 v.", "ex_en": "She helps buy/sell raffle tickets at the fair.", "ex_zh": "她在義賣會幫忙買／賣抽獎券。", "adv_en": "If more people buy/sell raffle tickets, the school can raise more money.", "adv_zh": "如果有更多人買／賣抽獎券，學校就能籌到更多錢。", "highlight": "buy/sell raffle tickets", "audio": "audio/audio_04.mp3", "img": "thumb_04.jpg", "art_source": "generated"}, {"n": 5, "en": "do voluntary work", "syllables": "do vol-un-ta-ry work", "zh": "做義務工作", "pos": "動詞短語 v.", "ex_en": "The girl does voluntary work at the elderly home.", "ex_zh": "那個女孩在安老院做義務工作。", "adv_en": "Every Saturday she does voluntary work, which helps the elderly people feel less lonely.", "adv_zh": "她每逢星期六做義務工作，這能幫助長者少點孤單。", "highlight": "does voluntary work", "audio": "audio/audio_05.mp3", "img": "thumb_05.jpg", "art_source": "generated"}, {"n": 6, "en": "donate money", "syllables": "do-nate mon-ey", "zh": "捐錢", "pos": "動詞短語 v.", "ex_en": "The boy puts a coin in to donate money.", "ex_zh": "那個男孩把硬幣投進去捐錢。", "adv_en": "Because he wants to help others, the boy saves his pocket money to donate money.", "adv_zh": "因為他想幫助別人，那個男孩把零用錢存起來捐錢。", "highlight": "donate money", "audio": "audio/audio_06.mp3", "img": "thumb_06.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_7349.html"}, {"n": 7, "en": "give away old books", "syllables": "give a-way old books", "zh": "贈送舊書", "pos": "動詞短語 v.", "ex_en": "He puts books in the box to give away old books.", "ex_zh": "他把書放進箱子裡，以便贈送舊書。", "adv_en": "When he cleans his room, he likes to give away old books that he no longer reads.", "adv_zh": "當他整理房間時，他喜歡把不再看的舊書贈送出去。", "highlight": "give away old books", "audio": "audio/audio_07.mp3", "img": "thumb_07.jpg", "art_source": "generated"}, {"n": 8, "en": "go on a walkathon", "syllables": "go on a walk-a-thon", "zh": "參加步行籌款", "pos": "動詞短語 v.", "ex_en": "The children go on a walkathon together.", "ex_zh": "孩子們一起參加步行籌款。", "adv_en": "Although they feel tired, the children still go on a walkathon to help raise money.", "adv_zh": "雖然他們感到疲倦，孩子們仍參加步行籌款來幫忙籌錢。", "highlight": "go on a walkathon", "audio": "audio/audio_08.mp3", "img": "thumb_08.jpg", "art_source": "generated"}, {"n": 9, "en": "take part in a fund-raising fair", "syllables": "take part in a fund-rais-ing fair", "zh": "參加籌款嘉年華", "pos": "動詞短語 v.", "ex_en": "They take part in a fund-raising fair at school.", "ex_zh": "他們在學校參加籌款嘉年華。", "adv_en": "Many parents come to watch when the students take part in a fund-raising fair.", "adv_zh": "當學生參加籌款嘉年華時，很多家長都會前來觀看。", "highlight": "take part in a fund-raising fair", "audio": "audio/audio_09.mp3", "img": "thumb_09.jpg", "art_source": "generated"}, {"n": 10, "en": "visit an elderly home", "syllables": "vis-it an eld-er-ly home", "zh": "探訪安老院", "pos": "動詞短語 v.", "ex_en": "The children visit an elderly home and chat.", "ex_zh": "孩子們探訪安老院並聊天。", "adv_en": "When they visit an elderly home, the children sing songs which make the old people smile.", "adv_zh": "當他們探訪安老院時，孩子們唱歌，讓長者臉上露出笑容。", "highlight": "visit an elderly home", "audio": "audio/audio_10.mp3", "img": "thumb_10.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_87.html"}];
const list = document.getElementById('list');
const FILLS = ['fill-coral','fill-green','fill-navy','fill-sky','fill-sunny','fill-pink'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  activeCard = { card, article };
  lbImg.src = card.img;
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio);
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.textContent = '🔊';
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust';
    const img = document.createElement('img');
    img.src = card.img; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + String(card.n).padStart(2,'0') + '</span>' +
    '<p class="syllables">' + card.syllables + '</p>' +
    '<p class="zh">' + card.zh + '（' + card.pos + '）</p>';
  top.appendChild(main);
  article.appendChild(top);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
</script>
</body>
</html>
