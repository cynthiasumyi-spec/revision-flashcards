<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no"/>
<title>Unit 1 For a good cause</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --ink:#1a2332; --muted:#5b6b7c;
  --accent:#2a9d8f; --accent-soft:#d0e9e6;
  --coral:#FF6B4A; --teal:#01383b; --box:#e6f5f3;
  --shadow:0 8px 24px rgba(26,35,50,.08); --radius:18px;
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header {
  position:sticky; top:0; z-index:10;
  background:rgba(244,247,251,.94);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(26,35,50,.06);
  padding:14px 16px 12px;
}
.back { display:inline-block; color:var(--accent); text-decoration:none; font-weight:600; font-size:.92rem; margin-bottom:6px; }
h1 { margin:0; font-size:1.28rem; font-weight:700; }
.sub { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
.hint { max-width:720px; margin:10px auto 0; padding:0 16px; color:var(--muted); font-size:.88rem; }
.list {
  max-width:720px; margin:0 auto;
  padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:14px;
}
.card {
  background:var(--card); border-radius:var(--radius);
  box-shadow:var(--shadow); border:1px solid rgba(26,35,50,.05);
  padding:16px 16px 14px; position:relative;
}
.card.playing { outline:2px solid var(--accent); }
.top { display:flex; gap:12px; align-items:flex-start; }
.illust {
  flex:0 0 96px; width:96px; height:96px; border-radius:14px;
  background:#eef2f7; overflow:hidden; border:1px solid rgba(26,35,50,.06);
}
.illust img { width:100%; height:100%; object-fit:contain; background:#fff; display:block; }
.main { flex:1; min-width:0; }
.num {
  display:inline-grid; place-items:center;
  min-width:28px; height:28px; padding:0 8px; border-radius:8px;
  background:var(--accent-soft); color:var(--accent);
  font-weight:700; font-size:.85rem; margin-bottom:6px;
}
.syllables {
  font-size:1.55rem; font-weight:800; color:var(--teal);
  line-height:1.25; letter-spacing:.01em; margin:0 0 6px;
  word-break:break-word;
}
.zh {
  font-size:1.05rem; font-weight:700; color:var(--coral);
  margin:0 0 10px; line-height:1.35;
}
.speaker {
  position:absolute; top:14px; right:14px;
  width:52px; height:52px; border-radius:50%; border:0;
  background:var(--accent); color:#fff; font-size:1.4rem;
  box-shadow:0 6px 16px rgba(0,0,0,.16);
  display:grid; place-items:center; cursor:pointer; z-index:2;
}
.speaker:active { transform:scale(.94); }
.card.playing .speaker { animation:pulse .9s ease infinite; filter:brightness(.92); }
@keyframes pulse {
  0%,100% { box-shadow:0 0 0 0 rgba(0,0,0,.25); }
  50% { box-shadow:0 0 0 10px rgba(0,0,0,0); }
}
.ex {
  background:var(--box); border:1.5px solid color-mix(in srgb, var(--accent) 45%, white);
  border-radius:14px; padding:12px 12px 10px; margin-top:8px;
}
.ex-label {
  display:inline-block; font-size:.78rem; font-weight:700; color:#fff;
  background:var(--accent); border-radius:999px; padding:3px 10px; margin-bottom:6px;
}
.ex-en { font-size:.98rem; line-height:1.45; color:var(--teal); margin:0 0 4px; }
.ex-zh { font-size:.9rem; line-height:1.4; color:var(--muted); margin:0; }
.hl { color:var(--coral); font-weight:700; }
@media (min-width:640px) {
  .illust { flex-basis:120px; width:120px; height:120px; }
  .syllables { font-size:1.75rem; }
}
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← 返回目錄</a>
  <h1>Unit 1 For a good cause</h1>
  <p class="sub">點 🔊 聽讀音 · 例句目標字已標示橙色</p>
</header>
<p class="hint">共 10 個生字／詞語 · Primary 6 例句 + 中一進階例句</p>
<main class="list" id="list"></main>
<script>
const CARDS = [{"n": 1, "en": "adopt a pet", "syllables": "a-dopt a pet", "zh": "領養寵物", "pos": "動詞 v.", "ex_en": "The family wants to adopt a pet from the shelter.", "ex_zh": "這家人想從收容所領養寵物。", "adv_en": "Because they love animals, the family decided to adopt a pet that needed a home.", "adv_zh": "因為他們喜愛動物，這家人決定領養一隻需要家的寵物。", "highlight": "adopt a pet", "audio": "audio/audio_01.mp3", "img": "thumb_01.jpg", "art_source": "generated"}, {"n": 2, "en": "be a volunteer", "syllables": "be a vol-un-teer", "zh": "當志願者", "pos": "動詞短語 v.", "ex_en": "The boy is happy to be a volunteer.", "ex_zh": "那個男孩很高興當志願者。", "adv_en": "When the school needs helpers, he is always glad to be a volunteer.", "adv_zh": "當學校需要幫手時，他總是樂於當志願者。", "highlight": "be a volunteer", "audio": "audio/audio_02.mp3", "img": "thumb_02.jpg", "art_source": "generated"}, {"n": 3, "en": "buy/sell flags", "syllables": "buy/sell flags", "zh": "買／賣旗籌", "pos": "動詞短語 v.", "ex_en": "The children buy/sell flags to raise money.", "ex_zh": "孩子們買／賣旗籌來籌款。", "adv_en": "Although it is raining, the children still buy/sell flags for charity.", "adv_zh": "雖然下着雨，孩子們仍為慈善買／賣旗籌。", "highlight": "buy/sell flags", "audio": "audio/audio_03.mp3", "img": "thumb_03.jpg", "art_source": "generated"}, {"n": 4, "en": "buy/sell raffle tickets", "syllables": "buy/sell raf-fle tick-ets", "zh": "買／賣抽獎券", "pos": "動詞短語 v.", "ex_en": "She helps buy/sell raffle tickets at the fair.", "ex_zh": "她在義賣會幫忙買／賣抽獎券。", "adv_en": "If more people buy/sell raffle tickets, the school can raise more money.", "adv_zh": "如果有更多人買／賣抽獎券，學校就能籌到更多錢。", "highlight": "buy/sell raffle tickets", "audio": "audio/audio_04.mp3", "img": "thumb_04.jpg", "art_source": "generated"}, {"n": 5, "en": "do voluntary work", "syllables": "do vol-un-ta-ry work", "zh": "做義務工作", "pos": "動詞短語 v.", "ex_en": "The girl does voluntary work at the elderly home.", "ex_zh": "那個女孩在安老院做義務工作。", "adv_en": "Every Saturday she does voluntary work, which helps the elderly people feel less lonely.", "adv_zh": "她每逢星期六做義務工作，這能幫助長者少點孤單。", "highlight": "does voluntary work", "audio": "audio/audio_05.mp3", "img": "thumb_05.jpg", "art_source": "generated"}, {"n": 6, "en": "donate money", "syllables": "do-nate mon-ey", "zh": "捐錢", "pos": "動詞短語 v.", "ex_en": "The boy puts a coin in to donate money.", "ex_zh": "那個男孩把硬幣投進去捐錢。", "adv_en": "Because he wants to help others, the boy saves his pocket money to donate money.", "adv_zh": "因為他想幫助別人，那個男孩把零用錢存起來捐錢。", "highlight": "donate money", "audio": "audio/audio_06.mp3", "img": "thumb_06.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_7349.html"}, {"n": 7, "en": "give away old books", "syllables": "give a-way old books", "zh": "贈送舊書", "pos": "動詞短語 v.", "ex_en": "He puts books in the box to give away old books.", "ex_zh": "他把書放進箱子裡，以便贈送舊書。", "adv_en": "When he cleans his room, he likes to give away old books that he no longer reads.", "adv_zh": "當他整理房間時，他喜歡把不再看的舊書贈送出去。", "highlight": "give away old books", "audio": "audio/audio_07.mp3", "img": "thumb_07.jpg", "art_source": "generated"}, {"n": 8, "en": "go on a walkathon", "syllables": "go on a walk-a-thon", "zh": "參加步行籌款", "pos": "動詞短語 v.", "ex_en": "The children go on a walkathon together.", "ex_zh": "孩子們一起參加步行籌款。", "adv_en": "Although they feel tired, the children still go on a walkathon to help raise money.", "adv_zh": "雖然他們感到疲倦，孩子們仍參加步行籌款來幫忙籌錢。", "highlight": "go on a walkathon", "audio": "audio/audio_08.mp3", "img": "thumb_08.jpg", "art_source": "generated"}, {"n": 9, "en": "take part in a fund-raising fair", "syllables": "take part in a fund-rais-ing fair", "zh": "參加籌款嘉年華", "pos": "動詞短語 v.", "ex_en": "They take part in a fund-raising fair at school.", "ex_zh": "他們在學校參加籌款嘉年華。", "adv_en": "Many parents come to watch when the students take part in a fund-raising fair.", "adv_zh": "當學生參加籌款嘉年華時，很多家長都會前來觀看。", "highlight": "take part in a fund-raising fair", "audio": "audio/audio_09.mp3", "img": "thumb_09.jpg", "art_source": "generated"}, {"n": 10, "en": "visit an elderly home", "syllables": "vis-it an eld-er-ly home", "zh": "探訪安老院", "pos": "動詞短語 v.", "ex_en": "The children visit an elderly home and chat.", "ex_zh": "孩子們探訪安老院並聊天。", "adv_en": "When they visit an elderly home, the children sing songs which make the old people smile.", "adv_zh": "當他們探訪安老院時，孩子們唱歌，讓長者臉上露出笑容。", "highlight": "visit an elderly home", "audio": "audio/audio_10.mp3", "img": "thumb_10.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_87.html"}];
const list = document.getElementById('list');
let currentAudio=null, currentEl=null, lastPlayAt=0;
const GUARD_MS=180;

function highlight(text, target) {
  if (!target) return text;
  // Escape and match with word boundaries (letters)
  const esc = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/ /g, '\\s+');
  const re = new RegExp('(?<![A-Za-z])(' + esc + ')(?![A-Za-z])', 'ig');
  return text.replace(re, '<span class="hl">$1</span>');
}

function stopCurrent() {
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime=0; currentAudio=null; }
  if (currentEl) { currentEl.classList.remove('playing'); currentEl=null; }
}

function playCard(card, el) {
  const now=Date.now();
  if (now-lastPlayAt<GUARD_MS && currentEl===el) return;
  lastPlayAt=now; stopCurrent();
  const audio=new Audio(card.audio);
  currentAudio=audio; currentEl=el||null;
  if (el) el.classList.add('playing');
  audio.addEventListener('ended', () => {
    if (currentAudio===audio) { if (el) el.classList.remove('playing'); currentAudio=null; currentEl=null; }
  });
  audio.addEventListener('error', () => {
    if (el) el.classList.remove('playing');
    if (currentAudio===audio) { currentAudio=null; currentEl=null; }
  });
  const p=audio.play();
  if (p && p.catch) p.catch(() => { if (el) el.classList.remove('playing'); });
}

CARDS.forEach(card => {
  const article=document.createElement('article');
  article.className='card';
  article.id='c'+String(card.n).padStart(2,'0');

  const speaker=document.createElement('button');
  speaker.type='button'; speaker.className='speaker';
  speaker.setAttribute('aria-label','播放：'+card.en);
  speaker.textContent='🔊';
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });

  const top=document.createElement('div'); top.className='top';
  if (card.img) {
    const wrap=document.createElement('div'); wrap.className='illust';
    const img=document.createElement('img');
    img.src=card.img; img.alt=card.en; img.loading='lazy'; img.decoding='async';
    wrap.appendChild(img); top.appendChild(wrap);
  }
  const main=document.createElement('div'); main.className='main';
  main.innerHTML =
    '<span class="num">'+String(card.n).padStart(2,'0')+'</span>'+
    '<p class="syllables">'+card.syllables+'</p>'+
    '<p class="zh">'+card.zh+'（'+card.pos+'）</p>';
  top.appendChild(main);

  function exBox(label, en, zh) {
    const d=document.createElement('div'); d.className='ex';
    d.innerHTML =
      '<span class="ex-label">'+label+'</span>'+
      '<p class="ex-en">'+highlight(en, card.highlight)+'</p>'+
      '<p class="ex-zh">'+zh+'</p>';
    return d;
  }

  article.appendChild(speaker);
  article.appendChild(top);
  article.appendChild(exBox('例句', card.ex_en, card.ex_zh));
  article.appendChild(exBox('進階例句', card.adv_en, card.adv_zh));
  // tap card (except speaker) also plays
  article.addEventListener('click', e => {
    if (e.target===speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });
  list.appendChild(article);
});
</script>
</body>
</html>
