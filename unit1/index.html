<p class="hint">Tap Play for audio. Tap the illustration to enlarge.</p>
<div class="section-pills" role="tablist" aria-label="Card sections">

<script src="../assets/last-place.js"></script>
<script>
const CARDS = [{"n": 1, "en": "adopt a pet", "syllables": "a-dopt a pet", "zh": "領養寵物", "pos": "動詞 v.", "ex_en": "The family wants to adopt a pet from the shelter.", "ex_zh": "這家人想從收容所領養寵物。", "adv_en": "Because they love animals, the family decided to adopt a pet that needed a home.", "adv_zh": "因為他們喜愛動物，這家人決定領養一隻需要家的寵物。", "highlight": "adopt a pet", "audio": "audio/audio_01.mp3", "img": "thumb_01.jpg", "art_source": "generated"}, {"n": 2, "en": "be a volunteer", "syllables": "be a vol-un-teer", "zh": "當志願者", "pos": "動詞短語 v.", "ex_en": "The boy is happy to be a volunteer.", "ex_zh": "那個男孩很高興當志願者。", "adv_en": "When the school needs helpers, he is always glad to be a volunteer.", "adv_zh": "當學校需要幫手時，他總是樂於當志願者。", "highlight": "be a volunteer", "audio": "audio/audio_02.mp3", "img": "thumb_02.jpg", "art_source": "generated"}, {"n": 3, "en": "buy/sell flags", "syllables": "buy/sell flags", "zh": "買／賣旗籌", "pos": "動詞短語 v.", "ex_en": "The children buy/sell flags to raise money.", "ex_zh": "孩子們買／賣旗籌來籌款。", "adv_en": "Although it is raining, the children still buy/sell flags for charity.", "adv_zh": "雖然下着雨，孩子們仍為慈善買／賣旗籌。", "highlight": "buy/sell flags", "audio": "audio/audio_03.mp3", "img": "thumb_03.jpg", "art_source": "generated"}, {"n": 4, "en": "buy/sell raffle tickets", "syllables": "buy/sell raf-fle tick-ets", "zh": "買／賣抽獎券", "pos": "動詞短語 v.", "ex_en": "She helps buy/sell raffle tickets at the fair.", "ex_zh": "她在義賣會幫忙買／賣抽獎券。", "adv_en": "If more people buy/sell raffle tickets, the school can raise more money.", "adv_zh": "如果有更多人買／賣抽獎券，學校就能籌到更多錢。", "highlight": "buy/sell raffle tickets", "audio": "audio/audio_04.mp3", "img": "thumb_04.jpg", "art_source": "generated"}, {"n": 5, "en": "do voluntary work", "syllables": "do vol-un-ta-ry work", "zh": "做義務工作", "pos": "動詞短語 v.", "ex_en": "The girl does voluntary work at the elderly home.", "ex_zh": "那個女孩在安老院做義務工作。", "adv_en": "Every Saturday she does voluntary work, which helps the elderly people feel less lonely.", "adv_zh": "她每逢星期六做義務工作，這能幫助長者少點孤單。", "highlight": "does voluntary work", "audio": "audio/audio_05.mp3", "img": "thumb_05.jpg", "art_source": "generated"}, {"n": 6, "en": "donate money", "syllables": "do-nate mon-ey", "zh": "捐錢", "pos": "動詞短語 v.", "ex_en": "The boy puts a coin in to donate money.", "ex_zh": "那個男孩把硬幣投進去捐錢。", "adv_en": "Because he wants to help others, the boy saves his pocket money to donate money.", "adv_zh": "因為他想幫助別人，那個男孩把零用錢存起來捐錢。", "highlight": "donate money", "audio": "audio/audio_06.mp3", "img": "thumb_06.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_7349.html"}, {"n": 7, "en": "give away old books", "syllables": "give a-way old books", "zh": "贈送舊書", "pos": "動詞短語 v.", "ex_en": "He puts books in the box to give away old books.", "ex_zh": "他把書放進箱子裡，以便贈送舊書。", "adv_en": "When he cleans his room, he likes to give away old books that he no longer reads.", "adv_zh": "當他整理房間時，他喜歡把不再看的舊書贈送出去。", "highlight": "give away old books", "audio": "audio/audio_07.mp3", "img": "thumb_07.jpg", "art_source": "generated"}, {"n": 8, "en": "go on a walkathon", "syllables": "go on a walk-a-thon", "zh": "參加步行籌款", "pos": "動詞短語 v.", "ex_en": "The children go on a walkathon together.", "ex_zh": "孩子們一起參加步行籌款。", "adv_en": "Although they feel tired, the children still go on a walkathon to help raise money.", "adv_zh": "雖然他們感到疲倦，孩子們仍參加步行籌款來幫忙籌錢。", "highlight": "go on a walkathon", "audio": "audio/audio_08.mp3?v=2", "img": "thumb_08.jpg", "art_source": "generated"}, {"n": 9, "en": "take part in a fund-raising fair", "syllables": "take part in a fund-rais-ing fair", "zh": "參加籌款嘉年華", "pos": "動詞短語 v.", "ex_en": "They take part in a fund-raising fair at school.", "ex_zh": "他們在學校參加籌款嘉年華。", "adv_en": "Many parents come to watch when the students take part in a fund-raising fair.", "adv_zh": "當學生參加籌款嘉年華時，很多家長都會前來觀看。", "highlight": "take part in a fund-raising fair", "audio": "audio/audio_09.mp3", "img": "thumb_09.jpg", "art_source": "generated"}, {"n": 10, "en": "visit an elderly home", "syllables": "vis-it an eld-er-ly home", "zh": "探訪安老院", "pos": "動詞短語 v.", "ex_en": "The children visit an elderly home and chat.", "ex_zh": "孩子們探訪安老院並聊天。", "adv_en": "When they visit an elderly home, the children sing songs which make the old people smile.", "adv_zh": "當他們探訪安老院時，孩子們唱歌，讓長者臉上露出笑容。", "highlight": "visit an elderly home", "audio": "audio/audio_10.mp3", "img": "thumb_10.png", "art_source": "irasutoya:https://www.irasutoya.com/2015/08/blog-post_33.html"}, {"n": 11, "en": "so many", "syllables": "", "zh": "這麼多（可數）", "pos": "", "pattern": "so many + plural countable noun", "ex_en": "Ben sells so many flags at the fair.", "ex_zh": "Ben在嘉年華賣出這麼多面旗。", "adv_en": "Because the walkathon is popular, Ben sells so many flags before lunch.", "adv_zh": "因為步行籌款很受歡迎，Ben在午飯前就賣出這麼多面旗。", "highlight": "so many", "audio": "audio/audio_11.mp3", "img": "thumb_11.png", "cutout": true, "art_source": "generated"}, {"n": 12, "en": "so much", "syllables": "", "zh": "這麼多（不可數）", "pos": "", "pattern": "so much + uncountable noun", "ex_en": "The class raises so much money for the shelter.", "ex_zh": "這個班為收容所籌得這麼多錢。", "adv_en": "After they visit the elderly home, the children donate so much money that the teacher smiles.", "adv_zh": "探訪安老院之後，孩子們捐出這麼多錢，老師也笑了。", "highlight": "so much", "audio": "audio/audio_12.mp3", "img": "thumb_12.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/01/blog-post_5281.html"}, {"n": 13, "en": "who", "syllables": "", "zh": "……的人", "pos": "", "note_zh": "who 只用於人；動物不是人，不要寫 who", "chips": [{"ok": true, "text": "which（動物）"},{"ok": false, "text": "who（動物）"}], "pattern": "person / people + who + clause", "ex_en": "She is the volunteer who looks after the pets.", "ex_zh": "她就是那位照顧寵物的志願者。", "adv_en": "Although he is busy after school, Tom is the boy who always helps at the fund-raising fair.", "adv_zh": "雖然放學後很忙，Tom仍是那位常常在籌款嘉年華幫忙的男孩。", "highlight": "who", "audio": "audio/audio_13.mp3", "img": "thumb_13.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/09/blog-post_738.html"}, {"n": 14, "en": "which", "syllables": "", "zh": "……的事物", "pos": "", "pattern": "thing / things + which + clause", "ex_en": "This is the raffle ticket which wins a prize.", "ex_zh": "這就是那張會得獎的抽獎券。", "adv_en": "While May packs the box, she chooses the book which she will give away.", "adv_zh": "May收拾箱子時，選了她要贈送的那本書。", "highlight": "which", "audio": "audio/audio_14.mp3", "img": "thumb_14.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/11/blog-post_6260.html"}];
const WORDS_MAX = 10;
const list = document.getElementById('list');
const FILLS = ['fill-a','fill-b','fill-c','fill-d','fill-e','fill-f'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  activeCard = { card, article };
  lbImg.src = card.img + "?v=4";
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio);
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

function glossLine(card) {
  return card.pos ? card.zh + '（' + card.pos + '）' : card.zh;
}

function showSyllableLine(card) {
  if (card.n > WORDS_MAX) return false;
  var syl = String(card.syllables || '');
  var norm = function (value) {
    return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
  };
  if (norm(syl) === norm(card.en)) return false;
  if (syl.indexOf('-') < 0) return false;
  return true;
}

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function chipHtml(chips) {
  return (chips || []).map(function (chip) {
    var ok = !!chip.ok;
    return '<span class="chip ' + (ok ? 'chip-ok' : 'chip-no') + '">' +
      (ok ? '✓' : '✕') + ' ' + esc(chip.text) + '</span>';
  }).join('');
}

function appendTeach(article, card) {
  var hasNote = !!card.note_zh || (card.chips && card.chips.length);
  var hasPattern = !!card.pattern;
  if (!hasNote && !hasPattern) return;
  if (hasNote) {
    var tip = document.createElement('div');
    tip.className = 'teach teach-tip';
    tip.innerHTML =
      '<span class="ex-label note-label">Note<img class="note-bulb" src="../assets/note-bulb.png?v=15" alt=""></span>' +
      '<div class="tip-inline"><p class="tip-en">' + esc(card.note_zh || '') + '</p>' + chipHtml(card.chips) + '</div>';
    article.appendChild(tip);
  }
  if (hasPattern) {
    var pattern = document.createElement('div');
    pattern.className = 'teach';
    pattern.innerHTML = '<span class="ex-label">Pattern</span><p class="pattern">' + esc(card.pattern) + '</p>';
    article.appendChild(pattern);
  }
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];
  article.id = 'c' + card.n;
  article.dataset.section = card.n <= WORDS_MAX ? 'words' : 'grammar';

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top' + (card.img ? '' : ' no-illust');

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust' + ((card.cutout || card.img === 'thumb_10.png') ? ' cutout' : '');
    const img = document.createElement('img');
    img.src = card.img + "?v=4"; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + card.n + '</span>' +
    '<p class="headword">' + card.en + '</p>' +
    (showSyllableLine(card) ? '<p class="syllables is-break">' + card.syllables + '</p>' : '') +
    '<p class="zh">' + glossLine(card) + '</p>';
  top.appendChild(main);
  article.appendChild(top);
  appendTeach(article, card);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
function showSection(name) {
  document.querySelectorAll('.section-pill').forEach(function (btn) {
    var on = btn.dataset.section === name;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#list .card').forEach(function (el) {
    el.hidden = el.dataset.section !== name;
  });
}
document.querySelectorAll('.section-pill').forEach(function (btn) {
  btn.addEventListener('click', function () { showSection(btn.dataset.section); });
});
var hashN = Number(String(location.hash).replace('#c', ''));
showSection(hashN > WORDS_MAX ? 'grammar' : 'words');
if (window.LastPlace && location.hash) {
  var hashed = CARDS.filter(function (c) { return c.n === hashN; })[0];
  if (hashed) LastPlace.save(hashed);
  LastPlace.focusHash();
}
</script>
</body>
