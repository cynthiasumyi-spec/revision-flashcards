const CARDS = [{"n": 1, "en": "go snowboarding", "syllables": "go snow-board-ing", "zh": "去滑雪板", "pos": "片語動詞 phr. v.", "ex_en": "We go snowboarding on the snowy hill.", "ex_zh": "我們在下雪的山坡去滑雪板。", "adv_en": "When the snow is thick, we go snowboarding with our friends.", "adv_zh": "當雪下得很厚時，我們和朋友去滑雪板。", "highlight": "go snowboarding", "audio": "audio/audio_01.mp3", "img": "thumb_01.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/01/blog-post_332.html"}, {"n": 2, "en": "go on a guided tour", "syllables": "go on a guided tour", "zh": "參加導賞團", "pos": "片語動詞 phr. v.", "ex_en": "We go on a guided tour of the old city.", "ex_zh": "我們參加舊城區的導賞團。", "adv_en": "Because the guide explains each stop, we go on a guided tour.", "adv_zh": "因為導遊會講解每一站，我們參加導賞團。", "highlight": "go on a guided tour", "audio": "audio/audio_02.mp3", "img": "thumb_02.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/11/blog-post_7.html"}, {"n": 3, "en": "go sightseeing", "syllables": "go sight-see-ing", "zh": "去觀光", "pos": "片語動詞 phr. v.", "ex_en": "They go sightseeing and take many photos.", "ex_zh": "他們去觀光，拍了很多照片。", "adv_en": "When the family visits a new city, they go sightseeing all afternoon.", "adv_zh": "當這家人去一個新城市時，他們整個下午都去觀光。", "highlight": "go sightseeing", "audio": "audio/audio_03.mp3", "img": "thumb_03.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/07/blog-post_4069.html"}, {"n": 4, "en": "visit a zoo", "syllables": "vis-it a zoo", "zh": "參觀動物園", "pos": "片語動詞 phr. v.", "ex_en": "The class will visit a zoo on Friday.", "ex_zh": "班上星期五會去參觀動物園。", "adv_en": "Because they love animals, the children visit a zoo and watch the pandas.", "adv_zh": "因為他們喜愛動物，孩子們參觀動物園並看熊貓。", "highlight": "visit a zoo", "audio": "audio/audio_04.mp3", "img": "thumb_04.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/12/blog-post_17.html"}, {"n": 5, "en": "ride on a banana boat", "syllables": "ride on a ba-na-na boat", "zh": "坐香蕉船", "pos": "片語動詞 phr. v.", "ex_en": "We ride on a banana boat at the beach.", "ex_zh": "我們在沙灘坐香蕉船。", "adv_en": "When the boat speeds up, the children ride on a banana boat and laugh.", "adv_zh": "當船加速時，孩子們坐香蕉船並大笑。", "highlight": "ride on a banana boat", "audio": "audio/audio_05.mp3", "img": "thumb_05.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/09/blog-post_24.html"}, {"n": 6, "en": "visit a palace", "syllables": "vis-it a pal-ace", "zh": "參觀宮殿", "pos": "片語動詞 phr. v.", "ex_en": "They visit a palace with gold chairs.", "ex_zh": "他們參觀一座有金色椅子的宮殿。", "adv_en": "When they visit a palace, a guide tells them about the king.", "adv_zh": "當他們參觀宮殿時，導遊告訴他們國王的故事。", "highlight": "visit a palace", "audio": "audio/audio_06.mp3", "img": "thumb_06.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2013/04/blog-post_4581.html"}, {"n": 7, "en": "go skiing", "syllables": "go ski-ing", "zh": "去滑雪", "pos": "片語動詞 phr. v.", "ex_en": "Dad and I go skiing in winter.", "ex_zh": "冬天爸爸和我去滑雪。", "adv_en": "Although the hill is steep, they go skiing with two long poles.", "adv_zh": "雖然山坡很陡，他們拿着兩支長雪杖去滑雪。", "highlight": "go skiing", "audio": "audio/audio_07.mp3", "img": "thumb_07.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/03/blog-post_9365.html"}, {"n": 8, "en": "visit a theme park", "syllables": "vis-it a theme park", "zh": "參觀主題樂園", "pos": "片語動詞 phr. v.", "ex_en": "We visit a theme park and try the big rides.", "ex_zh": "我們參觀主題樂園並試坐大型機動遊戲。", "adv_en": "Because the rides look exciting, we visit a theme park on Sunday.", "adv_zh": "因為機動遊戲看起來很刺激，我們星期天參觀主題樂園。", "highlight": "visit a theme park", "audio": "audio/audio_08.mp3", "img": "thumb_08.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2012/03/blog-post_1205.html"}, {"n": 9, "en": "feed a kangaroo", "syllables": "feed a kan-ga-roo", "zh": "餵袋鼠", "pos": "片語動詞 phr. v.", "ex_en": "The girl can feed a kangaroo some leaves.", "ex_zh": "女孩可以用樹葉餵袋鼠。", "adv_en": "When the joey peeks out, she is careful to feed a kangaroo gently.", "adv_zh": "當小袋鼠探出頭時，她小心地輕輕餵袋鼠。", "highlight": "feed a kangaroo", "audio": "audio/audio_09.mp3", "img": "thumb_09.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/07/blog-post_2801.html"}, {"n": 10, "en": "go into a rainforest", "syllables": "go into a rain-for-est", "zh": "進入雨林", "pos": "片語動詞 phr. v.", "ex_en": "They go into a rainforest full of tall trees.", "ex_zh": "他們進入長滿高樹的雨林。", "adv_en": "When the path is wet, the hikers go into a rainforest and listen to the birds.", "adv_zh": "當小路濕滑時，徒步的人進入雨林並聽鳥聲。", "highlight": "go into a rainforest", "audio": "audio/audio_10.mp3", "img": "thumb_10.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2015/06/blog-post_744.html"}, {"n": 11, "en": "go on a cruise", "syllables": "go on a cruise", "zh": "坐郵輪／遊輪旅行", "pos": "片語動詞 phr. v.", "ex_en": "The family will go on a cruise next month.", "ex_zh": "這家人下個月會坐郵輪旅行。", "adv_en": "Because they want to see the sea, they go on a cruise for three days.", "adv_zh": "因為他們想看海，他們坐郵輪旅行三天。", "highlight": "go on a cruise", "audio": "audio/audio_11.mp3", "img": "thumb_11.jpg", "cutout": false, "art_source": "generated"}, {"n": 12, "en": "go scuba-diving", "syllables": "go scu-ba-div-ing", "zh": "去水肺潛水", "pos": "片語動詞 phr. v.", "ex_en": "Sam wants to go scuba-diving with an air tank.", "ex_zh": "阿森想戴着氣瓶去水肺潛水。", "adv_en": "When he can breathe underwater, Sam will go scuba-diving near the reef.", "adv_zh": "當他可以在水下呼吸時，阿森會在珊瑚礁附近去水肺潛水。", "highlight": "go scuba-diving", "audio": "audio/audio_12.mp3", "img": "thumb_12.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2013/05/blog-post_9.html"}, {"n": 13, "en": "go snorkelling", "syllables": "go snor-kel-ling", "zh": "去浮潛", "pos": "片語動詞 phr. v.", "ex_en": "Amy will go snorkelling near the rocks.", "ex_zh": "艾美會在岩石附近去浮潛。", "adv_en": "When the sea is clear, Amy will go snorkelling with a short tube.", "adv_zh": "當海水清澈時，艾美會用一條短呼吸管去浮潛。", "highlight": "go snorkelling", "audio": "audio/audio_13.mp3", "img": "thumb_13.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/02/blog-post_5765.html"}, {"n": 14, "en": "go surfing", "syllables": "go surf-ing", "zh": "去衝浪", "pos": "片語動詞 phr. v.", "ex_en": "Ben likes to go surfing on tall waves.", "ex_zh": "阿斌喜歡在高浪上去衝浪。", "adv_en": "When a tall wave arrives, Ben will go surfing and stay standing.", "adv_zh": "當高浪來時，阿斌會去衝浪並保持站着。", "highlight": "go surfing", "audio": "audio/audio_14.mp3", "img": "thumb_14.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/06/blog-post_2596.html"}, {"n": 15, "en": "visit a safari park", "syllables": "vis-it a sa-fa-ri park", "zh": "參觀野生動物園", "pos": "片語動詞 phr. v.", "ex_en": "We visit a safari park in an open car.", "ex_zh": "我們坐敞篷車參觀野生動物園。", "adv_en": "Because the animals walk nearby, we visit a safari park and stay in the car.", "adv_zh": "因為動物在附近走，我們參觀野生動物園並留在車裡。", "highlight": "visit a safari park", "audio": "audio/audio_15.mp3", "img": "thumb_15.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/02/blog-post_650.html"}, {"n": 16, "en": "visit an aquarium", "syllables": "vis-it an a-quar-i-um", "zh": "參觀水族館", "pos": "片語動詞 phr. v.", "ex_en": "They visit an aquarium and watch the sharks.", "ex_zh": "他們參觀水族館並看鯊魚。", "adv_en": "When they visit an aquarium, they stand by the glass and watch the sharks.", "adv_zh": "當他們參觀水族館時，他們站在玻璃旁看鯊魚。", "highlight": "visit an aquarium", "audio": "audio/audio_16.mp3", "img": "thumb_16.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/11/blog-post_751.html"}, {"n": 17, "en": "afraid of", "syllables": "a-fraid of", "zh": "害怕……", "pos": "adj. + prep.", "ex_en": "The boy is afraid of the loud monkeys.", "ex_zh": "那個男孩害怕那些吵鬧的猴子。", "adv_en": "Because the monkeys shout, the boy is afraid of them and steps back.", "adv_zh": "因為猴子大聲叫，那個男孩害怕牠們並往後退。", "highlight": "afraid of", "audio": "audio/audio_17.mp3", "img": "thumb_17.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/09/blog-post_42.html"}, {"n": 18, "en": "fond of", "syllables": "fond of", "zh": "喜愛……", "pos": "adj. + prep.", "ex_en": "Grandma is fond of music.", "ex_zh": "奶奶喜愛音樂。", "adv_en": "When the radio plays, Grandma is fond of music and starts to hum.", "adv_zh": "當收音機響起時，奶奶喜愛音樂並開始哼歌。", "highlight": "fond of", "audio": "audio/audio_18.mp3", "img": "thumb_18.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/03/blog-post_506.html"}, {"n": 19, "en": "full of", "syllables": "full of", "zh": "充滿……", "pos": "adj. + prep.", "ex_en": "The room is full of laughter.", "ex_zh": "房間裡充滿笑聲。", "adv_en": "When the party starts, the room is full of laughter.", "adv_zh": "當派對開始時，房間裡充滿笑聲。", "highlight": "full of", "audio": "audio/audio_19.mp3", "img": "thumb_19.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_798.html"}, {"n": 20, "en": "angry with", "syllables": "an-gry with", "zh": "對……生氣", "pos": "adj. + prep.", "ex_en": "Dad is angry with my brother.", "ex_zh": "爸爸對我弟弟生氣。", "adv_en": "Because my brother broke the cup, Dad is angry with him.", "adv_zh": "因為弟弟打碎了杯子，爸爸對他生氣。", "highlight": "angry with", "audio": "audio/audio_20.mp3", "img": "thumb_20.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/08/blog-post_140.html"}, {"n": 21, "en": "bored with", "syllables": "bored with", "zh": "對……感到無聊", "pos": "adj. + prep.", "ex_en": "Lily is bored with the same game.", "ex_zh": "莉莉對同一個遊戲感到無聊。", "adv_en": "When she has played it all week, Lily is bored with the same game.", "adv_zh": "當她玩了整整一星期後，莉莉對同一個遊戲感到無聊。", "highlight": "bored with", "audio": "audio/audio_21.mp3", "img": "thumb_21.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/03/blog-post_63.html"}, {"n": 22, "en": "pleased with", "syllables": "pleased with", "zh": "對……滿意", "pos": "adj. + prep.", "ex_en": "The teacher is pleased with me.", "ex_zh": "老師對我感到滿意。", "adv_en": "Because my work is neat, the teacher is pleased with me.", "adv_zh": "因為我的功課很整齊，老師對我感到滿意。", "highlight": "pleased with", "audio": "audio/audio_22.mp3", "img": "thumb_22.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/01/blog-post_753.html"}, {"n": 23, "en": "popular with", "syllables": "pop-u-lar with", "zh": "受……歡迎", "pos": "adj. + prep.", "ex_en": "Sam is popular with the neighbours.", "ex_zh": "阿森很受鄰居歡迎。", "adv_en": "When he helps carry bags, Sam is popular with the neighbours.", "adv_zh": "當他幫忙提袋子時，阿森很受鄰居歡迎。", "highlight": "popular with", "audio": "audio/audio_23.mp3", "img": "thumb_23.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/12/blog-post_76.html"}, {"n": 24, "en": "crazy about", "syllables": "cra-zy about", "zh": "對……痴迷", "pos": "adj. + prep.", "ex_en": "May is crazy about cats.", "ex_zh": "阿美對貓很痴迷。", "adv_en": "Because cat pictures cover her wall, May is crazy about cats.", "adv_zh": "因為牆上貼滿貓的圖畫，阿美對貓很痴迷。", "highlight": "crazy about", "audio": "audio/audio_24.mp3", "img": "thumb_24.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/09/blog-post_84.html"}, {"n": 25, "en": "excited about", "syllables": "ex-ci-ted about", "zh": "對……感到興奮", "pos": "adj. + prep.", "ex_en": "Tom is excited about the camp.", "ex_zh": "阿湯對營會感到興奮。", "adv_en": "When the bus is coming, Tom is excited about the camp.", "adv_zh": "當旅遊巴快到時，阿湯對營會感到興奮。", "highlight": "excited about", "audio": "audio/audio_25.mp3", "img": "thumb_25.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2012/12/blog-post_5119.html"}, {"n": 26, "en": "happy about", "syllables": "hap-py about", "zh": "對……感到高興", "pos": "adj. + prep.", "ex_en": "Amy is happy about her surprise cake.", "ex_zh": "艾美對驚喜蛋糕感到高興。", "adv_en": "When she sees the candles, Amy is happy about her surprise cake.", "adv_zh": "當她看見蠟燭時，艾美對驚喜蛋糕感到高興。", "highlight": "happy about", "audio": "audio/audio_26.mp3", "img": "thumb_26.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/12/blog-post_833.html"}, {"n": 27, "en": "worried about", "syllables": "wor-ried about", "zh": "擔心……", "pos": "adj. + prep.", "ex_en": "Mum is worried about the long flight.", "ex_zh": "媽媽擔心那趟長途飛行。", "adv_en": "Because the plane leaves at night, Mum is worried about the long flight.", "adv_zh": "因為飛機在晚上起飛，媽媽擔心那趟長途飛行。", "highlight": "worried about", "audio": "audio/audio_27.mp3", "img": "thumb_27.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/03/blog-post_81.html"}, {"n": 28, "en": "bad for", "syllables": "bad for", "zh": "對……有害", "pos": "adj. + prep.", "ex_en": "Too many sweets are bad for your teeth.", "ex_zh": "太多糖果對你的牙齒有害。", "adv_en": "When you eat sweets every day, they are bad for your teeth.", "adv_zh": "如果你每天吃糖果，它們對你的牙齒有害。", "highlight": "bad for", "audio": "audio/audio_28.mp3", "img": "thumb_28.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/05/blog-post_3061.html"}, {"n": 29, "en": "famous for", "syllables": "fa-mous for", "zh": "以……聞名", "pos": "adj. + prep.", "ex_en": "That town is famous for kimchi.", "ex_zh": "那個城鎮以泡菜聞名。", "adv_en": "When travellers visit, they learn the town is famous for kimchi.", "adv_zh": "當旅客到訪時，他們知道那個城鎮以泡菜聞名。", "highlight": "famous for", "audio": "audio/audio_29.mp3", "img": "thumb_29.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_145.html"}, {"n": 30, "en": "good for", "syllables": "good for", "zh": "對……有益", "pos": "adj. + prep.", "ex_en": "Fresh fruit is good for her.", "ex_zh": "新鮮水果對她有益。", "adv_en": "Because she wants to stay well, fresh fruit is good for her.", "adv_zh": "因為她想保持健康，新鮮水果對她有益。", "highlight": "good for", "audio": "audio/audio_30.mp3", "img": "thumb_30.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/06/blog-post_282.html"}, {"n": 31, "en": "interested in", "syllables": "in-terest-ed in", "zh": "對……感興趣", "pos": "adj. + prep.", "ex_en": "Ben is interested in animals.", "ex_zh": "阿斌對動物感興趣。", "adv_en": "When he sees a new creature, Ben is interested in animals and stays to look.", "adv_zh": "當他看見新的生物時，阿斌對動物感興趣並留下來看。", "highlight": "interested in", "audio": "audio/audio_31.mp3", "img": "thumb_31.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/05/blog-post_297.html"}, {"n": 32, "en": "successful in", "syllables": "suc-cess-ful in", "zh": "在……方面成功", "pos": "adj. + prep.", "ex_en": "Dad is successful in his work.", "ex_zh": "爸爸在工作方面很成功。", "adv_en": "Because he plans carefully, Dad is successful in his work.", "adv_zh": "因為他計劃得很仔細，爸爸在工作方面很成功。", "highlight": "successful in", "audio": "audio/audio_32.mp3", "img": "thumb_32.jpg", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/01/blog-post_57.html"}, {"n": 33, "en": "where", "syllables": "where", "zh": "為地方加資料", "pos": "", "ex_en": "This is the cinema where we can watch films.", "ex_zh": "這就是我們可以看電影的電影院。", "adv_en": "We meet at the cinema where we can watch films on Saturday.", "adv_zh": "我們星期六在那間可以看電影的電影院見面。", "highlight": "where", "audio": "audio/audio_33.mp3", "img": "thumb_33.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/09/3d_28.html"}];

const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  activeCard = { card, article };
  lbImg.src = card.img + "?v=2";
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio + "?v=2");
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

function glossLine(card) {
  return card.pos ? card.zh + '（' + card.pos + '）' : card.zh;
}

function showSyllableLine(card) {
  var syl = String(card.syllables || '');
  var norm = function (value) {
    return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
  };
  if (norm(syl) === norm(card.en)) return false;
  if (syl.indexOf('-') < 0) return false;
  return true;
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];
  article.id = 'c' + card.n;
  article.dataset.section = card.n <= WORDS_MAX ? 'words' : 'grammar';

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust' + (card.cutout ? ' cutout' : '');
    const img = document.createElement('img');
    img.src = card.img + "?v=2"; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + card.n + '</span>' +
    '<p class="headword">' + card.en + '</p>' +
    (showSyllableLine(card) ? '<p class="syllables is-break">' + card.syllables + '</p>' : '') +
    '<p class="zh">' + glossLine(card) + '</p>';
  top.appendChild(main);
  article.appendChild(top);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
function showSection(name) {
  document.querySelectorAll('.section-pill').forEach(function (btn) {
    var on = btn.dataset.section === name;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#list .card').forEach(function (el) {
    el.hidden = el.dataset.section !== name;
  });
}
document.querySelectorAll('.section-pill').forEach(function (btn) {
  btn.addEventListener('click', function () { showSection(btn.dataset.section); });
});
var hashN = Number(String(location.hash).replace('#c', ''));
showSection(hashN > WORDS_MAX ? 'grammar' : 'words');
if (window.LastPlace && location.hash) {
  var hashed = CARDS.filter(function (c) { return c.n === hashN; })[0];
  if (hashed) LastPlace.save(hashed);
  LastPlace.focusHash();
}
</script>
</body>
</html>
