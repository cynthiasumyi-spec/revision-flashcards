const CARDS = [{"n": 1, "en": "go snowboarding", "syllables": "go snow-board-ing", "zh": "去單板滑雪", "pos": "片語動詞 phr. v.", "ex_en": "We go snowboarding on the snowy slopes.", "ex_zh": "我們在積雪的山坡上單板滑雪。", "adv_en": "If the mountain has deep powder after a storm, we go snowboarding with our friends until sunset.", "adv_zh": "如果暴風雪過後山上有厚厚的粉雪，我們會和朋友去單板滑雪，直到日落。", "highlight": "go snowboarding", "audio": "audio/audio_01.mp3", "img": "thumb_01.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/01/blog-post_332.html"}, {"n": 2, "en": "go on a guided tour", "syllables": "go on a guided tour", "zh": "參加導賞團", "pos": "片語動詞 phr. v.", "ex_en": "We go on a guided tour of the old city.", "ex_zh": "我們參加舊城區的導賞團。", "adv_en": "Because we want to learn the city's history, we go on a guided tour.", "adv_zh": "因為我們想認識這座城市的歷史，我們參加導賞團。", "highlight": "go on a guided tour", "audio": "audio/audio_02.mp3", "img": "thumb_02.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/11/blog-post_7.html"}, {"n": 3, "en": "go sightseeing", "syllables": "go sight-see-ing", "zh": "去觀光", "pos": "片語動詞 phr. v.", "ex_en": "They go sightseeing and take many photos.", "ex_zh": "他們去觀光，拍了很多照片。", "adv_en": "After they check into the hotel, they go sightseeing and take photos of every square.", "adv_zh": "他們辦好酒店入住後，便去觀光，並為每個廣場拍照。", "highlight": "go sightseeing", "audio": "audio/audio_03.mp3", "img": "thumb_03.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/07/blog-post_4069.html"}, {"n": 4, "en": "visit a zoo", "syllables": "vis-it a zoo", "zh": "參觀動物園", "pos": "片語動詞 phr. v.", "ex_en": "The class will visit a zoo on Friday.", "ex_zh": "班級星期五會去參觀動物園。", "adv_en": "Because they love animals, the children visit a zoo and watch the pandas.", "adv_zh": "因為他們喜愛動物，孩子們參觀動物園並看熊貓。", "highlight": "visit a zoo", "audio": "audio/audio_04.mp3", "img": "thumb_04.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/12/blog-post_17.html"}, {"n": 5, "en": "ride on a banana boat", "syllables": "ride on a ba-na-na boat", "zh": "坐香蕉船", "pos": "片語動詞 phr. v.", "ex_en": "We ride on a banana boat in the sea.", "ex_zh": "我們在海上坐香蕉船。", "adv_en": "When the gentle waves roll in, the children ride on a banana boat as it floats across the sea.", "adv_zh": "當海浪輕拂時，孩子們搭乘香蕉船隨波起伏。", "highlight": "ride on a banana boat", "audio": "audio/audio_05.mp3", "img": "thumb_05.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2015/09/blog-post_24.html"}, {"n": 6, "en": "visit a palace", "syllables": "vis-it a pal-ace", "zh": "參觀宮殿", "pos": "片語動詞 phr. v.", "ex_en": "They visit a palace with gold chairs.", "ex_zh": "他們參觀一座有金色椅子的宮殿。", "adv_en": "While the guide explains the gold chairs, the pupils quietly visit a palace and take notes.", "adv_zh": "當導遊講解金椅子時，同學們靜靜地參觀宮殿並做筆記。", "highlight": "visit a palace", "audio": "audio/audio_06.mp3", "img": "thumb_06.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2013/04/blog-post_4581.html"}, {"n": 7, "en": "go skiing", "syllables": "go ski-ing", "zh": "去滑雪", "pos": "片語動詞 phr. v.", "ex_en": "Dad and I go skiing in winter.", "ex_zh": "冬天爸爸和我去滑雪。", "adv_en": "Although the hill is steep, they go skiing with two long poles.", "adv_zh": "雖然山坡很陡，他們拿着兩支長雪杖去滑雪。", "highlight": "go skiing", "audio": "audio/audio_07.mp3", "img": "thumb_07.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/03/blog-post_9365.html"}, {"n": 8, "en": "visit a theme park", "syllables": "vis-it a theme park", "zh": "參觀主題樂園", "pos": "片語動詞 phr. v.", "ex_en": "We visit a theme park and try the big rides.", "ex_zh": "我們參觀主題樂園並試坐大型機動遊戲。", "adv_en": "Because the rides look exciting, we visit a theme park on Sunday.", "adv_zh": "因為機動遊戲看起來很刺激，我們星期天參觀主題樂園。", "highlight": "visit a theme park", "audio": "audio/audio_08.mp3", "img": "thumb_08.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2012/03/blog-post_1205.html"}, {"n": 9, "en": "feed a kangaroo", "syllables": "feed a kan-ga-roo", "zh": "餵袋鼠", "pos": "片語動詞 phr. v.", "ex_en": "The girl can feed a kangaroo some leaves.", "ex_zh": "女孩可以用樹葉餵袋鼠。", "adv_en": "Before she holds out the leaves, she is careful to feed a kangaroo only when the keeper says it is safe.", "adv_zh": "在伸出樹葉之前，她只在管理員說安全時才小心餵袋鼠。", "highlight": "feed a kangaroo", "audio": "audio/audio_09.mp3", "img": "thumb_09.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/07/blog-post_2801.html"}, {"n": 10, "en": "go into a rainforest", "syllables": "go into a rain-for-est", "zh": "進入雨林", "pos": "片語動詞 phr. v.", "ex_en": "They go into a rainforest full of tall trees.", "ex_zh": "他們進入長滿高樹的雨林。", "adv_en": "Although the path is wet, the hikers go into a rainforest and listen to the birds.", "adv_zh": "雖然小路濕滑，徒步的人仍進入雨林並聆聽鳥聲。", "highlight": "go into a rainforest", "audio": "audio/audio_10.mp3", "img": "thumb_10.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2015/06/blog-post_744.html"}, {"n": 11, "en": "go on a cruise", "syllables": "go on a cruise", "zh": "坐郵輪／遊輪旅行", "pos": "片語動詞 phr. v.", "ex_en": "The family will go on a cruise next month.", "ex_zh": "這家人下個月會坐郵輪旅行。", "adv_en": "Since they have never slept on a ship before, they go on a cruise for three days along the coast.", "adv_zh": "因為他們從未在船上過夜，他們沿岸坐郵輪旅行三天。", "highlight": "go on a cruise", "audio": "audio/audio_11.mp3", "img": "thumb_11.jpg", "cutout": false, "art_source": "generated"}, {"n": 12, "en": "go scuba-diving", "syllables": "go scu-ba-div-ing", "zh": "去水肺潛水", "pos": "片語動詞 phr. v.", "ex_en": "Sam wants to go scuba-diving with an air tank.", "ex_zh": "Sam想戴着氣瓶去水肺潛水。", "adv_en": "After Sam learns to use an air tank, he will go scuba-diving near the reef.", "adv_zh": "Sam學會使用氣瓶後，會在珊瑚礁附近去水肺潛水。", "highlight": "go scuba-diving", "audio": "audio/audio_12.mp3", "img": "thumb_12.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2013/05/blog-post_9.html"}, {"n": 13, "en": "go snorkelling", "syllables": "go snor-kel-ling", "zh": "去浮潛", "pos": "片語動詞 phr. v.", "ex_en": "Amy will go snorkelling near the rocks.", "ex_zh": "Amy會在岩石附近去浮潛。", "adv_en": "Once Amy puts on her mask, she will go snorkelling near the rocks with a short breathing tube.", "adv_zh": "Amy一戴上面罩，便會用短呼吸管在岩石附近浮潛。", "highlight": "go snorkelling", "audio": "audio/audio_13.mp3", "img": "thumb_13.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/02/blog-post_5765.html"}, {"n": 14, "en": "go surfing", "syllables": "go surf-ing", "zh": "去衝浪", "pos": "片語動詞 phr. v.", "ex_en": "Ben likes to go surfing on tall waves.", "ex_zh": "Ben喜歡在高浪上去衝浪。", "adv_en": "Although the waves look frightening at first, Ben will go surfing and try to stay standing on the board.", "adv_zh": "雖然浪起初看起來很可怕，Ben仍會去衝浪，並嘗試站穩在板上。", "highlight": "go surfing", "audio": "audio/audio_14.mp3", "img": "thumb_14.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2013/06/blog-post_2596.html"}, {"n": 15, "en": "visit a safari park", "syllables": "vis-it a sa-fa-ri park", "zh": "參觀野生動物園", "pos": "片語動詞 phr. v.", "ex_en": "We visit a safari park in an open car.", "ex_zh": "我們坐敞篷車參觀野生動物園。", "adv_en": "Because we want to see lions up close, we visit a safari park and stay in the car.", "adv_zh": "因為我們想近距離看獅子，我們參觀野生動物園並留在車內。", "highlight": "visit a safari park", "audio": "audio/audio_15.mp3", "img": "thumb_15.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/02/blog-post_650.html"}, {"n": 16, "en": "visit an aquarium", "syllables": "vis-it an a-quar-i-um", "zh": "參觀水族館", "pos": "片語動詞 phr. v.", "ex_en": "They visit an aquarium and watch the sharks.", "ex_zh": "他們參觀水族館並看鯊魚。", "adv_en": "As the sharks swim past the thick glass, the children visit an aquarium and press their noses to the window.", "adv_zh": "隨着鯊魚游過厚玻璃，孩子們參觀水族館，並把鼻子貼在窗上。", "highlight": "visit an aquarium", "audio": "audio/audio_16.mp3", "img": "thumb_16.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/11/blog-post_751.html"}, {"n": 17, "en": "afraid of", "syllables": "a-fraid of", "zh": "害怕……", "pos": "adj. + prep.", "note_zh": "用 of，不要寫 afraid to + (n.)", "chips": [{"ok": true, "text": "of"}, {"ok": false, "text": "to"}], "pattern": "be + afraid of + noun / pronoun", "ex_en": "The boy is afraid of the loud monkeys.", "ex_zh": "那個男孩害怕那些吵鬧的猴子。", "adv_en": "Even though the monkeys are behind a fence, the boy is afraid of them and steps back when they shout.", "adv_zh": "即使猴子在圍欄後面，男孩仍害怕牠們，牠們一叫便往後退。", "highlight": "afraid of", "audio": "audio/audio_17.mp3", "img": "thumb_17.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/09/blog-post_42.html"}, {"n": 18, "en": "fond of", "syllables": "fond of", "zh": "喜愛……", "pos": "adj. + prep.", "note_zh": "用 of，不要寫 fond with", "chips": [{"ok": true, "text": "of"}, {"ok": false, "text": "with"}], "pattern": "be + fond of + noun / pronoun", "ex_en": "Grandma is fond of music.", "ex_zh": "奶奶喜愛音樂。", "adv_en": "Because she grew up with old songs, Grandma is fond of music and often hums along.", "adv_zh": "因為她從小聽老歌長大，奶奶喜愛音樂，常常跟着哼。", "highlight": "fond of", "audio": "audio/audio_18.mp3", "img": "thumb_18.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/03/blog-post_506.html"}, {"n": 19, "en": "full of", "syllables": "full of", "zh": "充滿……", "pos": "adj. + prep.", "note_zh": "用 of，不要寫 full about", "chips": [{"ok": true, "text": "of"}, {"ok": false, "text": "about"}], "pattern": "be + full of + noun", "ex_en": "The room is full of laughter.", "ex_zh": "房間裡充滿笑聲。", "adv_en": "As more friends walk in with gifts, the room is full of laughter and bright balloons.", "adv_zh": "隨着愈來愈多朋友帶着禮物進來，房間充滿笑聲與鮮艷的氣球。", "highlight": "full of", "audio": "audio/audio_19.mp3", "img": "thumb_19.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_798.html"}, {"n": 20, "en": "angry with", "syllables": "an-gry with", "zh": "對……生氣", "pos": "adj. + prep.", "pattern": "be + angry with + noun / pronoun", "ex_en": "Dad is angry with my brother.", "ex_zh": "爸爸對我弟弟生氣。", "adv_en": "After my brother broke Mum's favourite cup, Dad is angry with him and asks him to apologise.", "adv_zh": "弟弟打破媽媽最愛的杯子後，爸爸對他生氣，並叫他道歉。", "highlight": "angry with", "audio": "audio/audio_20.mp3", "img": "thumb_20.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/08/blog-post_140.html"}, {"n": 21, "en": "bored with", "syllables": "bored with", "zh": "對……感到無聊", "pos": "adj. + prep.", "pattern": "be + bored with + noun / pronoun", "ex_en": "Lily is bored with the same game.", "ex_zh": "Lily對同一個遊戲感到無聊。", "adv_en": "Although the game was fun at first, Lily is bored with it after playing the same levels all week.", "adv_zh": "雖然這遊戲起初很好玩，Lily玩同一關卡整個星期後已對它感到無聊。", "highlight": "bored with", "audio": "audio/audio_21.mp3", "img": "thumb_21.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/03/blog-post_63.html"}, {"n": 22, "en": "pleased with", "syllables": "pleased with", "zh": "對……滿意", "pos": "adj. + prep.", "note_zh": "用 with，不要寫 pleased about（對人）", "chips": [{"ok": true, "text": "with"}, {"ok": false, "text": "about"}], "pattern": "be + pleased with + noun / pronoun", "ex_en": "The teacher is pleased with me.", "ex_zh": "老師對我感到滿意。", "adv_en": "Now that my handwriting is neat and my answers are complete, the teacher is pleased with me.", "adv_zh": "既然我的字跡整齊而且答案齊全，老師對我感到滿意。", "highlight": "pleased with", "audio": "audio/audio_22.mp3", "img": "thumb_22.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/01/blog-post_753.html"}, {"n": 23, "en": "popular with", "syllables": "pop-u-lar with", "zh": "受……歡迎", "pos": "adj. + prep.", "pattern": "be + popular with + noun", "ex_en": "Sam is popular with the neighbours.", "ex_zh": "Sam很受鄰居歡迎。", "adv_en": "Because he often helps elderly neighbours carry heavy bags, Sam is popular with everyone in the building.", "adv_zh": "因為他常常幫年長鄰居提重袋，Sam在整棟樓都很受歡迎。", "highlight": "popular with", "audio": "audio/audio_23.mp3", "img": "thumb_23.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2016/12/blog-post_76.html"}, {"n": 24, "en": "crazy about", "syllables": "cra-zy about", "zh": "對……痴迷", "pos": "adj. + prep.", "pattern": "be + crazy about + noun / pronoun", "ex_en": "May is crazy about cats.", "ex_zh": "May對貓很痴迷。", "adv_en": "Although she already has two cats, May is crazy about cats and wants another.", "adv_zh": "雖然她已有兩隻貓，May仍對貓很痴迷，還想再養一隻。", "highlight": "crazy about", "audio": "audio/audio_24.mp3", "img": "thumb_24.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/09/blog-post_84.html"}, {"n": 25, "en": "excited about", "syllables": "ex-ci-ted about", "zh": "對……感到興奮", "pos": "adj. + prep.", "note_zh": "用 about，不要寫 excited with", "chips": [{"ok": true, "text": "about"}, {"ok": false, "text": "with"}], "pattern": "be + excited about + noun", "ex_en": "Tom is excited about the camp.", "ex_zh": "Tom對營會感到興奮。", "adv_en": "If the camp bus arrives before lunch, Tom is excited about packing his bag and meeting his teammates.", "adv_zh": "如果營隊巴士在午飯前到達，Tom會為收拾行李和會見隊友而感到興奮。", "highlight": "excited about", "audio": "audio/audio_25.mp3", "img": "thumb_25.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2012/12/blog-post_5119.html"}, {"n": 26, "en": "happy about", "syllables": "hap-py about", "zh": "對……感到高興", "pos": "adj. + prep.", "pattern": "be + happy about + noun / pronoun", "ex_en": "Amy is happy about her surprise cake.", "ex_zh": "Amy對驚喜蛋糕感到高興。", "adv_en": "As soon as she sees the candles on the table, Amy is happy about her surprise cake.", "adv_zh": "她一看見桌上的蠟燭，就為驚喜蛋糕感到高興。", "highlight": "happy about", "audio": "audio/audio_26.mp3", "img": "thumb_26.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2017/12/blog-post_833.html"}, {"n": 27, "en": "worried about", "syllables": "wor-ried about", "zh": "擔心……", "pos": "adj. + prep.", "note_zh": "用 about，不要寫 worried of／in", "chips": [{"ok": true, "text": "about"}, {"ok": false, "text": "of"}, {"ok": false, "text": "in"}], "pattern": "be + worried about + noun", "ex_en": "Mum is worried about the long flight.", "ex_zh": "媽媽擔心那趟長途飛行。", "adv_en": "Because the plane leaves at night, Mum is worried about the long flight.", "adv_zh": "因為飛機在晚上起飛，媽媽擔心那趟長途飛行。", "highlight": "worried about", "audio": "audio/audio_27.mp3", "img": "thumb_27.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/03/blog-post_81.html"}, {"n": 28, "en": "bad for", "syllables": "bad for", "zh": "對……有害", "pos": "adj. + prep.", "pattern": "be + bad for + noun / pronoun", "ex_en": "Too many sweets are bad for your teeth.", "ex_zh": "太多糖果對你的牙齒有害。", "adv_en": "Unless you brush after sweets, they are bad for your teeth and gums.", "adv_zh": "除非吃糖後刷牙，否則它們對你的牙齒和牙齦有害。", "highlight": "bad for", "audio": "audio/audio_28.mp3", "img": "thumb_28.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2014/05/blog-post_3061.html"}, {"n": 29, "en": "famous for", "syllables": "fa-mous for", "zh": "以……聞名", "pos": "adj. + prep.", "note_zh": "表示出名的原因用 for，不要寫 famous in", "chips": [{"ok": true, "text": "for"}, {"ok": false, "text": "in"}], "pattern": "be + famous for + noun", "ex_en": "That town is famous for kimchi.", "ex_zh": "那個城鎮以泡菜聞名。", "adv_en": "Visitors who travel through the market soon learn that the town is famous for kimchi.", "adv_zh": "走過市場的旅客很快就知道，那市鎮以泡菜聞名。", "highlight": "famous for", "audio": "audio/audio_29.mp3", "img": "thumb_29.jpg", "cutout": false, "art_source": "irasutoya:https://www.irasutoya.com/2014/09/blog-post_145.html"}, {"n": 30, "en": "good for", "syllables": "good for", "zh": "對……有益", "pos": "adj. + prep.", "pattern": "be + good for + noun / pronoun", "ex_en": "Fresh fruit is good for her.", "ex_zh": "新鮮水果對她有益。", "adv_en": "Because it is rich in vitamins, fresh fruit is good for her.", "adv_zh": "因為富含維生素，新鮮水果對她有益。", "highlight": "good for", "audio": "audio/audio_30.mp3", "img": "thumb_30.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2018/06/blog-post_282.html"}, {"n": 31, "en": "interested in", "syllables": "in-terest-ed in", "zh": "對……感興趣", "pos": "adj. + prep.", "note_zh": "用 in，不要寫 interested on", "chips": [{"ok": true, "text": "in"}, {"ok": false, "text": "on"}], "pattern": "be + interested in + noun", "ex_en": "Ben is interested in animals.", "ex_zh": "Ben對動物感興趣。", "adv_en": "Because he reads many animal books, Ben is interested in animals and visits the zoo often.", "adv_zh": "因為他讀了很多動物書，Ben對動物感興趣，也常去動物園。", "highlight": "interested in", "audio": "audio/audio_31.mp3", "img": "thumb_31.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/05/blog-post_297.html"}, {"n": 32, "en": "successful in", "syllables": "suc-cess-ful in", "zh": "在……方面成功", "pos": "adj. + prep.", "note_zh": "用 in，不要寫 successful for", "chips": [{"ok": true, "text": "in"}, {"ok": false, "text": "for"}], "pattern": "be + successful in + noun", "ex_en": "Dad is successful in his work.", "ex_zh": "爸爸在工作方面很成功。", "adv_en": "While others rush their tasks, Dad is successful in his work because he plans each step carefully.", "adv_zh": "當別人匆忙趕工時，爸爸因仔細計劃每一步而在工作上取得成功。", "highlight": "successful in", "audio": "audio/audio_32.mp3", "img": "thumb_32.jpg", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/01/blog-post_57.html"}, {"n": 33, "en": "where", "syllables": "where", "zh": "為地方加資料", "pos": "", "pattern": "place + where + clause", "ex_en": "This is the museum where we saw the dinosaur bones.", "ex_zh": "這就是我們看過恐龍骨骼的博物館。", "adv_en": "After school we go to the park where the children play football.", "adv_zh": "放學後我們去那座孩子們踢足球的公園。", "highlight": "where", "audio": "audio/audio_33.mp3", "img": "thumb_33.png", "cutout": true, "art_source": "irasutoya:https://www.irasutoya.com/2019/09/3d_28.html"}];
const WORDS_MAX = 16;
const list = document.getElementById('list');
const FILLS = ['fill-a','fill-b','fill-c','fill-d','fill-e','fill-f'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
const SPEAKER_SVG = "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"currentColor\"><path d=\"M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z\"/></svg>";
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  activeCard = { card, article };
  lbImg.src = card.img + "?v=3";
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (window.LastPlace) LastPlace.save(card);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio + "?v=2");
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

function glossLine(card) {
  return card.pos ? card.zh + '（' + card.pos + '）' : card.zh;
}

function showSyllableLine(card) {
  var syl = String(card.syllables || '');
  var norm = function (value) {
    return String(value || '').replace(/\s+/g, ' ').trim().toLowerCase();
  };
  if (norm(syl) === norm(card.en)) return false;
  if (syl.indexOf('-') < 0) return false;
  return true;
}

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function chipHtml(chips) {
  return (chips || []).map(function (chip) {
    var ok = !!chip.ok;
    return '<span class="chip ' + (ok ? 'chip-ok' : 'chip-no') + '">' +
      (ok ? '✓' : '✕') + ' ' + esc(chip.text) + '</span>';
  }).join('');
}

function appendTeach(article, card) {
  var hasNote = !!card.note_zh || (card.chips && card.chips.length);
  var hasPattern = !!card.pattern;
  if (!hasNote && !hasPattern) return;
  if (hasNote) {
    var tip = document.createElement('div');
    tip.className = 'teach teach-tip';
    tip.innerHTML =
      '<span class="ex-label note-label">Note<img class="note-bulb" src="../assets/note-bulb.png?v=15" alt=""></span>' +
      '<div class="tip-inline"><p class="tip-en">' + esc(card.note_zh || '') + '</p>' + chipHtml(card.chips) + '</div>';
    article.appendChild(tip);
  }
  if (hasPattern) {
    var pattern = document.createElement('div');
    pattern.className = 'teach';
    pattern.innerHTML = '<span class="ex-label">Pattern</span><p class="pattern">' + esc(card.pattern) + '</p>';
    article.appendChild(pattern);
  }
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];
  article.id = 'c' + card.n;
  article.dataset.section = card.n <= WORDS_MAX ? 'words' : 'grammar';

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.innerHTML = SPEAKER_SVG;
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust' + (card.cutout ? ' cutout' : '');
    const img = document.createElement('img');
    img.src = card.img + "?v=3"; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + card.n + '</span>' +
    '<p class="headword">' + card.en + '</p>' +
    (showSyllableLine(card) ? '<p class="syllables is-break">' + card.syllables + '</p>' : '') +
    '<p class="zh">' + glossLine(card) + '</p>';
  top.appendChild(main);
  article.appendChild(top);
  appendTeach(article, card);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
function showSection(name) {
  document.querySelectorAll('.section-pill').forEach(function (btn) {
    var on = btn.dataset.section === name;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('#list .card').forEach(function (el) {
    el.hidden = el.dataset.section !== name;
  });
}
document.querySelectorAll('.section-pill').forEach(function (btn) {
  btn.addEventListener('click', function () { showSection(btn.dataset.section); });
});
var hashN = Number(String(location.hash).replace('#c', ''));
showSection(hashN > WORDS_MAX ? 'grammar' : 'words');
if (window.LastPlace && location.hash) {
  var hashed = CARDS.filter(function (c) { return c.n === hashN; })[0];
  if (hashed) LastPlace.save(hashed);
  LastPlace.focusHash();
}
</script>
</body>
</html>
