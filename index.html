<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小六英文生字卡 · Revision Flashcards</title>
  <style>
    :root {
      --bg:#f4f7fb; --ink:#1a2332; --muted:#5b6b7c; --card:#fff;
      --line:rgba(26,35,50,.08);
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
      background:var(--bg); color:var(--ink);
      -webkit-tap-highlight-color:transparent;
    }
    header { padding:28px 20px 8px; text-align:center; }
    h1 { margin:0; font-size:1.55rem; font-weight:800; }
    .sub { color:var(--muted); margin:8px 0 0; font-size:0.95rem; }
    .wrap {
      max-width:720px; margin:0 auto;
      padding:16px 16px calc(36px + env(safe-area-inset-bottom,0px));
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
    }
    a.chapter {
      display:flex; flex-direction:column;
      text-decoration:none; color:inherit;
      background:var(--card); border-radius:16px;
      border:1px solid var(--line); box-shadow:none;
      overflow:hidden; transition:transform .12s ease;
      min-height:230px;
    }
    a.chapter:active { transform:scale(0.985); }
    .hero {
      height:130px; background:#eef2f7; overflow:hidden;
      display:block; position:relative;
    }
    .hero img {
      width:100%; height:100%; object-fit:cover; display:block;
      box-shadow:none;
    }
    .body { padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .title {
      margin:0; font-size:1.02rem; font-weight:800; line-height:1.3;
    }
    .desc {
      margin:0; color:var(--muted); font-size:0.84rem; line-height:1.35;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    }
    .tag {
      align-self:flex-start; margin-top:auto;
      font-size:0.75rem; font-weight:700;
      border-radius:8px; padding:4px 9px;
    }
    .tag.teal { background:#d7f1ec; color:#0f6b5c; }
    .tag.blue { background:#ddeaff; color:#1d5bbf; }
    .tag.orange { background:#ffe6d6; color:#b85a1a; }
    .tag.purple { background:#ebe6ff; color:#5b45c4; }
    .tag.green { background:#dff5e4; color:#1f7a3a; }
    .note { text-align:center; color:var(--muted); font-size:0.85rem; padding:0 20px 24px; }
    @media (max-width:420px) {
      .wrap { grid-template-columns:1fr; }
      .hero { height:160px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>小六英文生字卡</h1>
    <p class="sub">點選單元開始溫習</p>
  </header>
  <main class="wrap">
    <a class="chapter" href="unit1/index.html">
      <div class="hero"><img src="covers/unit1.jpg" alt="Unit 1" loading="lazy" decoding="async" /></div>
      <div class="body">
        <h2 class="title">Unit 1 For a good cause</h2>
        <p class="desc">慈善與義工 · 10 個生字</p>
        <span class="tag teal">Words in use</span>
      </div>
    </a>
    <a class="chapter" href="unit2/index.html">
      <div class="hero"><img src="covers/unit2.jpg" alt="Unit 2" loading="lazy" decoding="async" /></div>
      <div class="body">
        <h2 class="title">Unit 2 Lend a helping hand</h2>
        <p class="desc">天災與影響 · 10 個生字</p>
        <span class="tag blue">Words in use</span>
      </div>
    </a>
    <a class="chapter" href="unit3/index.html">
      <div class="hero"><img src="covers/unit3.jpg" alt="Unit 3" loading="lazy" decoding="async" /></div>
      <div class="body">
        <h2 class="title">Unit 3 Junior Super Chef</h2>
        <p class="desc">煮食動詞 · 12 個生字</p>
        <span class="tag orange">Words in use</span>
      </div>
    </a>
    <a class="chapter" href="unit4/index.html">
      <div class="hero"><img src="covers/unit4.jpg" alt="Unit 4" loading="lazy" decoding="async" /></div>
      <div class="body">
        <h2 class="title">Unit 4 Film magic</h2>
        <p class="desc">電影類型與性格形容詞 · 14 個生字</p>
        <span class="tag purple">Words in use</span>
      </div>
    </a>
    <a class="chapter" href="dictation3/index.html">
      <div class="hero"><img src="covers/dictation3.jpg" alt="Dictation 3" loading="lazy" decoding="async" /></div>
      <div class="body">
        <h2 class="title">Dictation 3 生字卡</h2>
        <p class="desc">默書溫習（電影＋明喻）· 15 張字卡</p>
        <span class="tag green">生字卡</span>
      </div>
    </a>
  </main>
  <p class="note">點開單元後可聽讀音、看例句</p>
</body>
</html>
