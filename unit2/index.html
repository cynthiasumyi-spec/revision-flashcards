<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="format-detection" content="telephone=no"/>
<title>Unit 2 Lend a helping hand</title>
<style>
:root {
  --bg:#fcf0d8; --cream:#fcf0d8; --navy:#243c6c; --white:#ffffff;
  --coral:#fc903c; --green:#009c48; --sky:#84c0e4; --sunny:#fcc03c; --pink:#f0909c;
  --muted:#5a6570; --ink:#183c6c; --radius:22px;
  --illust:168px;
}
* { box-sizing:border-box; }
html,body {
  margin:0; padding:0; background:var(--bg); color:var(--navy);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent;
}
header {
  position:sticky; top:0; z-index:10;
  background:rgba(252,240,216,.96);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:0; box-shadow:none;
  padding:14px 16px 12px;
}
/* Solid coral color block (not a stroke frame) */
header::after {
  content:""; display:block; height:8px; background:var(--coral);
  margin:12px -16px -12px;
}
.back { display:inline-block; color:var(--coral); text-decoration:none; font-weight:700; font-size:.92rem; margin-bottom:6px; }
h1 { margin:0; font-size:1.28rem; font-weight:800; color:var(--navy); }
.sub { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
.hint { max-width:720px; margin:10px auto 0; padding:0 16px; color:var(--muted); font-size:.88rem; }
.list {
  max-width:720px; margin:0 auto;
  padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:16px;
}
/* Canva Class News: solid fills, rounded, NO outer stroke */
.card {
  border-radius:var(--radius);
  box-shadow:none; border:0; outline:none;
  padding:16px 16px 14px; position:relative;
  color:var(--white);
}
.card.fill-coral { background:var(--coral); color:var(--white); }
.card.fill-green { background:var(--green); color:var(--white); }
.card.fill-navy  { background:var(--navy);  color:var(--white); }
.card.fill-sky   { background:var(--sky);   color:#183c6c; }
.card.fill-sunny { background:var(--sunny); color:#183c6c; }
.card.fill-pink  { background:var(--pink);  color:var(--white); }
.card.playing { outline:none; }
.top { display:flex; gap:14px; align-items:flex-start; }
.illust {
  flex:0 0 var(--illust); width:var(--illust); height:var(--illust);
  border-radius:14px; background:var(--white); overflow:hidden;
  border:0; box-shadow:none; cursor:zoom-in;
}
.illust img {
  width:100%; height:100%; object-fit:contain; background:var(--white);
  display:block; box-shadow:none; filter:none;
}
.main { flex:1; min-width:0; padding-right:56px; }
.num {
  display:inline-grid; place-items:center;
  min-width:28px; height:28px; padding:0 8px; border-radius:8px;
  background:rgba(255,255,255,.28); color:inherit;
  font-weight:800; font-size:.85rem; margin-bottom:6px;
}
.fill-sky .num, .fill-sunny .num {
  background:rgba(24,60,108,.14); color:#183c6c;
}
.syllables {
  font-size:1.5rem; font-weight:800; color:inherit;
  line-height:1.25; margin:0 0 6px; word-break:break-word;
}
.zh {
  font-size:1.02rem; font-weight:700; color:inherit;
  margin:0 0 4px; line-height:1.35; opacity:.95;
}
.speaker {
  position:absolute; top:14px; right:14px;
  width:52px; height:52px; border-radius:50%; border:0;
  background:rgba(255,255,255,.95); color:var(--navy); font-size:1.45rem;
  box-shadow:none !important; filter:none !important; text-shadow:none;
  display:grid; place-items:center; cursor:pointer; z-index:3; line-height:1;
}
.fill-sky .speaker, .fill-sunny .speaker {
  background:var(--navy); color:var(--white);
}
.speaker:active { transform:scale(.94); }
.card.playing .speaker {
  outline:3px solid var(--sunny); outline-offset:2px;
  box-shadow:none !important; animation:none; filter:none;
}
/* Example: high-contrast near-white inset on ALL fills (navy text) */
.ex {
  background:rgba(255,255,255,.92);
  border:0; border-radius:14px; padding:12px; margin-top:10px;
  color:#183c6c;
}
.ex-label {
  display:inline-block; font-size:.78rem; font-weight:800;
  color:#fff; background:#183c6c;
  border-radius:999px; padding:3px 10px; margin-bottom:6px;
}
.ex-en { font-size:.98rem; line-height:1.45; color:#183c6c; margin:0 0 4px; }
.ex-zh { font-size:.9rem; line-height:1.4; color:#183c6c; opacity:.92; margin:0; }
/* Universal vocab highlight: navy chip + white text (passes on every fill) */
.hl {
  background:#183c6c; color:#fff; font-weight:800;
  padding:0 4px; border-radius:4px;
}
@media (min-width:640px) {
  :root { --illust:196px; }
  .syllables { font-size:1.7rem; }
}
@media (max-width:380px) {
  :root { --illust:140px; }
}
/* Lightbox */
.lightbox {
  position:fixed; inset:0; z-index:100;
  background:rgba(36,60,108,.92);
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px; padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
.lightbox.open { display:flex; }
.lightbox img {
  max-width:100%; max-height:calc(100vh - 88px);
  width:auto; height:auto; object-fit:contain;
  border-radius:16px; background:var(--white); box-shadow:none;
}
.lb-bar {
  display:flex; gap:12px; align-items:center; justify-content:center;
  margin-top:12px; width:100%; max-width:480px;
}
.lb-btn {
  appearance:none; border:0; border-radius:999px;
  padding:12px 18px; font-size:1rem; font-weight:700;
  cursor:pointer; color:var(--white); box-shadow:none;
}
.lb-close { background:var(--navy); }
.lb-play { background:var(--coral); }
</style>
</head>
<body>
<header>
  <a class="back" href="../index.html">← Back to home</a>
  <h1>Unit 2 Lend a helping hand</h1>
  <p class="sub">10 words · Primary 6 examples + Form 1 advanced examples</p>
</header>
<p class="hint">Tap the speaker for audio; tap the illustration to enlarge. Mid-size art, no shadow or frame.</p>
<div class="list" id="list"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarge illustration">
  <img id="lb-img" alt="" />
  <div class="lb-bar">
    <button type="button" class="lb-btn lb-play" id="lb-play">🔊 Play audio</button>
    <button type="button" class="lb-btn lb-close" id="lb-close">Close</button>
  </div>
</div>
<script>
const CARDS = [{"n": 1, "en": "a drought", "syllables": "a drought", "zh": "旱災", "pos": "名詞 n.", "ex_en": "The dry land shows there is a drought.", "ex_zh": "乾裂的土地顯示發生了旱災。", "adv_en": "Because there has been no rain for months, the farmers suffer from a drought.", "adv_zh": "因為好幾個月沒有下雨，農夫正受旱災之苦。", "highlight": "a drought", "audio": "audio/audio_01.mp3", "img": "thumb_01.png", "art_source": "irasutoya:https://www.irasutoya.com/2016/08/blog-post_84.html"}, {"n": 2, "en": "an earthquake", "syllables": "an earth-quake", "zh": "地震", "pos": "名詞 n.", "ex_en": "The buildings fell down in an earthquake.", "ex_zh": "地震中樓房倒塌了。", "adv_en": "When an earthquake suddenly starts, people must hide under a strong table.", "adv_zh": "當地震突然發生時，人們必須躲在堅固的桌子下。", "highlight": "an earthquake", "audio": "audio/audio_02.mp3", "img": "thumb_02.jpg", "art_source": "generated"}, {"n": 3, "en": "a flood", "syllables": "a flood", "zh": "水災", "pos": "名詞 n.", "ex_en": "People walk through water during a flood.", "ex_zh": "水災期間人們在水中行走。", "adv_en": "After heavy rain, a flood fills the streets so nobody can drive.", "adv_zh": "大雨過後，水災淹沒街道，所以沒有人能開車。", "highlight": "a flood", "audio": "audio/audio_03.mp3", "img": "thumb_03.png", "art_source": "irasutoya:https://www.irasutoya.com/2018/07/blog-post_91.html"}, {"n": 4, "en": "a landslip", "syllables": "a land-slip", "zh": "山泥傾瀉", "pos": "名詞 n.", "ex_en": "Rocks cover the road after a landslip.", "ex_zh": "山泥傾瀉後，石頭覆蓋了道路。", "adv_en": "Because of a landslip on the mountain, the road is blocked and cars cannot pass.", "adv_zh": "因為山上發生山泥傾瀉，道路被堵塞，汽車無法通過。", "highlight": "a landslip", "audio": "audio/audio_04.mp3", "img": "thumb_04.png", "art_source": "irasutoya:https://www.irasutoya.com/2012/10/blog-post_25.html"}, {"n": 5, "en": "a tsunami", "syllables": "a tsu-na-mi", "zh": "海嘯", "pos": "名詞 n.", "ex_en": "A huge wave comes in a tsunami.", "ex_zh": "海嘯時湧來巨大的海浪。", "adv_en": "When a tsunami approaches the coast, people must move to higher ground quickly.", "adv_zh": "當海嘯逼近海岸時，人們必須迅速移往高處。", "highlight": "a tsunami", "audio": "audio/audio_05.mp3", "img": "thumb_05.jpg", "art_source": "generated"}, {"n": 6, "en": "a typhoon", "syllables": "a ty-phoon", "zh": "颱風", "pos": "名詞 n.", "ex_en": "Strong wind bends the trees in a typhoon.", "ex_zh": "颱風中強風吹彎了樹木。", "adv_en": "Although a typhoon is coming, the family stays indoors and waits safely.", "adv_zh": "雖然颱風快到了，這家人仍留在室內安全地等待。", "highlight": "a typhoon", "audio": "audio/audio_06.mp3", "img": "thumb_06.jpg", "art_source": "generated"}, {"n": 7, "en": "block roads", "syllables": "block roads", "zh": "堵塞道路", "pos": "動詞短語 v.", "ex_en": "The flood water can block roads.", "ex_zh": "洪水可以堵塞道路。", "adv_en": "Fallen trees block roads after the storm, so buses cannot run.", "adv_zh": "暴風雨後倒下的樹木堵塞道路，所以巴士無法行駛。", "highlight": "block roads", "audio": "audio/audio_07.mp3", "img": "thumb_07.png", "art_source": "irasutoya:https://www.irasutoya.com/2017/07/blog-post_48.html"}, {"n": 8, "en": "damage crops", "syllables": "dam-age crops", "zh": "損毀農作物", "pos": "動詞短語 v.", "ex_en": "The dry weather can damage crops.", "ex_zh": "乾旱天氣會損毀農作物。", "adv_en": "If there is no rain for too long, the heat will damage crops in the fields.", "adv_zh": "如果太久沒下雨，高溫就會損毀田裡的農作物。", "highlight": "damage crops", "audio": "audio/audio_08.mp3", "img": "thumb_08.png", "art_source": "irasutoya:https://www.irasutoya.com/2014/08/blog-post_86.html"}, {"n": 9, "en": "destroy buildings", "syllables": "de-stroy build-ings", "zh": "摧毀建築物", "pos": "動詞短語 v.", "ex_en": "The strong quake can destroy buildings.", "ex_zh": "強烈地震能摧毀建築物。", "adv_en": "An earthquake which is very strong may destroy buildings in the city centre.", "adv_zh": "非常強烈的地震可能摧毀市中心的建築物。", "highlight": "destroy buildings", "audio": "audio/audio_09.mp3", "img": "thumb_09.jpg", "art_source": "generated"}, {"n": 10, "en": "injure people", "syllables": "in-jure peo-ple", "zh": "使人受傷", "pos": "動詞短語 v.", "ex_en": "Falling rocks may injure people.", "ex_zh": "掉落的石頭可能使人受傷。", "adv_en": "Rescuers help a girl who was hurt when the disaster injured people nearby.", "adv_zh": "救護人員幫助一個女孩，她是在災難使人受傷時被傷到的。", "highlight": "injure people", "audio": "audio/audio_10.mp3", "img": "thumb_10.jpg", "art_source": "generated"}];
const list = document.getElementById('list');
const FILLS = ['fill-coral','fill-green','fill-navy','fill-sky','fill-sunny','fill-pink'];
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbPlay = document.getElementById('lb-play');
const lbClose = document.getElementById('lb-close');
let currentAudio = null;
let activeCard = null;

function openLightbox(card, article) {
  activeCard = { card, article };
  lbImg.src = card.img;
  lbImg.alt = card.en;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
  activeCard = null;
}
if (lbClose) lbClose.addEventListener('click', closeLightbox);
if (lightbox) lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
if (lbPlay) lbPlay.addEventListener('click', () => { if (activeCard) playCard(activeCard.card, activeCard.article); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function hl(text, target) {
  if (!target) return text;
  const i = text.toLowerCase().indexOf(target.toLowerCase());
  if (i < 0) return text;
  return text.slice(0,i) + '<span class="hl">' + text.slice(i,i+target.length) + '</span>' + text.slice(i+target.length);
}

function playCard(card, article) {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  document.querySelectorAll('.card.playing').forEach(el => el.classList.remove('playing'));
  article.classList.add('playing');
  const a = new Audio(card.audio);
  currentAudio = a;
  a.play().catch(()=>{});
  a.onended = () => article.classList.remove('playing');
}

CARDS.forEach(card => {
  const article = document.createElement('article');
  article.className = 'card ' + FILLS[(card.n - 1) % FILLS.length];

  const speaker = document.createElement('button');
  speaker.type = 'button';
  speaker.className = 'speaker';
  speaker.setAttribute('aria-label', 'Play: ' + card.en);
  speaker.textContent = '🔊';
  speaker.addEventListener('click', e => { e.stopPropagation(); playCard(card, article); });
  article.appendChild(speaker);

  const top = document.createElement('div');
  top.className = 'top';

  if (card.img) {
    const wrap = document.createElement('div');
    wrap.className = 'illust';
    const img = document.createElement('img');
    img.src = card.img; img.alt = card.en; img.loading = 'lazy'; img.decoding = 'async';
    wrap.appendChild(img);
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', 'Enlarge: ' + card.en);
    wrap.addEventListener('click', e => { e.stopPropagation(); openLightbox(card, article); });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); openLightbox(card, article); }
    });
    top.appendChild(wrap);
  }

  const main = document.createElement('div');
  main.className = 'main';
  main.innerHTML =
    '<span class="num">' + String(card.n).padStart(2,'0') + '</span>' +
    '<p class="syllables">' + card.syllables + '</p>' +
    '<p class="zh">' + card.zh + '（' + card.pos + '）</p>';
  top.appendChild(main);
  article.appendChild(top);

  const ex1 = document.createElement('div');
  ex1.className = 'ex';
  ex1.innerHTML = '<span class="ex-label">Example</span><p class="ex-en">' + hl(card.ex_en, card.highlight) + '</p><p class="ex-zh">' + card.ex_zh + '</p>';
  const ex2 = document.createElement('div');
  ex2.className = 'ex';
  ex2.innerHTML = '<span class="ex-label">Advanced example</span><p class="ex-en">' + hl(card.adv_en, card.highlight) + '</p><p class="ex-zh">' + card.adv_zh + '</p>';
  article.appendChild(ex1);
  article.appendChild(ex2);

  article.addEventListener('click', e => {
    if (e.target === speaker || speaker.contains(e.target)) return;
    playCard(card, article);
  });

  list.appendChild(article);
});
</script>
</body>
</html>
